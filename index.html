"answer": "B", "answerText": "Rủi ro nợ nần, chậm thanh toán, xung đột chi phí và sự gian lận lệch số liệu giữa Advertiser và Publisher.", "explanation": "Smart Contracts tự kích hoạt chuyển tiền ngay khi dữ liệu ghi nhận lượt hiển thị hợp lệ trên chuỗi khối, loại bỏ tranh chấp và khâu trung gian thanh toán.", "level": "Thông hiểu"}, {"num": 25, "question": "Sự khác biệt giữa Engagement Metrics và Conversion Metrics khi đánh giá một chiến dịch VR/AR là gì?", "options": [{"letter": "A", "text": "Engagement Metrics đo tiền mặt; Conversion Metrics đo thời gian"}, {"letter": "B", "text": "Engagement Metrics đo mức độ tương tác (thời gian dùng, số lần click vào vật thể ảo); Conversion Metrics đo kết quả hành động kinh doanh (tỷ lệ mua hàng, số đơn từ AR)."}, {"letter": "C", "text": "Hai nhóm chỉ số này hoàn toàn giống nhau"}, {"letter": "D", "text": "Engagement Metrics chỉ áp dụng cho báo chí"}], "answer": "B", "answerText": "Engagement Metrics đo mức độ tương tác (thời gian dùng, số lần click vào vật thể ảo); Conversion Metrics đo kết quả hành động kinh doanh (tỷ lệ mua hàng, số đơn từ AR).", "explanation": "Engagement đo lường mức độ đắm chìm/thích thú của người dùng với trải nghiệm ảo; Conversion đo lường tác động thực tế đến doanh thu.", "level": "Thông hiểu"}, {"num": 26, "question": "Blockchain giải quyết bài toán \"Minh bạch chuỗi cung ứng quảng cáo\" (Ad Supply Chain) bằng cách nào?", "options": [{"letter": "A", "text": "Cấm các nhà quảng cáo dùng tiền mặt"}, {"letter": "B", "text": "Ghi lại công khai toàn bộ dòng tiền và chi phí qua từng đơn vị trung gian (DSP, SSP, Ad Exchange) từ Advertiser tới Publisher."}, {"letter": "C", "text": "Yêu cầu chính phủ quản lý 100% ngân sách quảng cáo"}, {"letter": "D", "text": "Giảm số lượng bài viết quảng cáo trên mạng"}], "answer": "B", "answerText": "Ghi lại công khai toàn bộ dòng tiền và chi phí qua từng đơn vị trung gian (DSP, SSP, Ad Exchange) từ Advertiser tới Publisher.", "explanation": "Blockchain giúp theo dõi minh bạch nguồn tiền quảng cáo, cắt giảm phí ẩn của các bên trung gian và đảm bảo ngân sách đến đúng nhà xuất bản.", "level": "Thông hiểu"}, {"num": 27, "question": "Tại sao trải nghiệm VR lại tạo ra \"kết nối cảm xúc\" (Emotional Connection) mạnh mẽ hơn các quảng cáo video 2D truyền thống?", "options": [{"letter": "A", "text": "Vì video VR luôn có nhạc nền hay hơn"}, {"letter": "B", "text": "Vì VR tạo cảm giác \"hiện diện\" thực sự trong không gian ảo (Immersion), khiến não bộ ghi nhớ trải nghiệm như một sự kiện thực tế từng trải qua."}, {"letter": "C", "text": "Vì kính VR tự động kích thích thần kinh con người"}, {"letter": "D", "text": "Vì VR chỉ sử dụng màu sắc đỏ và vàng"}], "answer": "B", "answerText": "Vì VR tạo cảm giác \"hiện diện\" thực sự trong không gian ảo (Immersion), khiến não bộ ghi nhớ trải nghiệm như một sự kiện thực tế từng trải qua.", "explanation": "Mức độ đắm chìm tuyệt đối của VR cô lập nhiễu xung quanh, tạo cảm xúc chân thật như thể khách hàng đang trực tiếp ở trong bối cảnh thương hiệu.", "level": "Thông hiểu"}, {"num": 28, "question": "So sánh sự khác nhau giữa chiến lược \"Thâm nhập thị trường\" và \"Phát triển thị trường\" trong Marketing tập trung?", "options": [{"letter": "A", "text": "Thâm nhập thị trường bán hàng cho người nước ngoài; Phát triển thị trường bán cho người trong nước"}, {"letter": "B", "text": "Thâm nhập thị trường là tăng thị phần sản phẩm hiện tại trên thị trường hiện tại; Phát triển thị trường là đưa sản phẩm hiện tại sang phân khúc/thị trường mới."}, {"letter": "C", "text": "Cả hai chiến lược này đều yêu cầu sản xuất sản phẩm mới hoàn toàn"}, {"letter": "D", "text": "Thâm nhập thị trường không cần dùng quảng cáo"}], "answer": "B", "answerText": "Thâm nhập thị trường là tăng thị phần sản phẩm hiện tại trên thị trường hiện tại; Phát triển thị trường là đưa sản phẩm hiện tại sang phân khúc/thị trường mới.", "explanation": "Slide phân biệt: Market Penetration dồn lực khai thác sâu thị trường cũ; Market Development khai phá nhóm khách hàng/địa lý hoàn toàn mới.", "level": "Thông hiểu"}, {"num": 29, "question": "Trong ứng dụng Blockchain cho Influencer Marketing, tại sao người tiêu dùng ngày nay lại tin tưởng Micro-Influencers hơn các ngôi sao lớn?", "options": [{"letter": "A", "text": "Vì Micro-Influencers nhận quảng cáo miễn phí"}, {"letter": "B", "text": "Vì Micro-Influencers có sự tương tác chân thật, gần gũi như con người thật ủng hộ thương hiệu và nội dung đánh giá có độ tin cậy cao hơn."}, {"letter": "C", "text": "Vì các ngôi sao lớn không được phép dùng mạng xã hội"}, {"letter": "D", "text": "Vì Micro-Influencers chỉ phục vụ khách hàng giàu có"}], "answer": "B", "answerText": "Vì Micro-Influencers có sự tương tác chân thật, gần gũi như con người thật ủng hộ thương hiệu và nội dung đánh giá có độ tin cậy cao hơn.", "explanation": "Trích bài giảng: 90% người tiêu dùng xem review trước khi mua. Khách hàng thích tiếp xúc với con người thật ủng hộ nhãn hàng (Micro-influencer) nhờ sự tinh tế và chân thực.", "level": "Thông hiểu"}, {"num": 30, "question": "Thách thức lớn nhất về mặt KỸ THUẬT khi tích hợp Blockchain vào các hệ thống tiếp thị tập trung xử lý hàng triệu giao dịch mỗi giây là gì?", "options": [{"letter": "A", "text": "Màn hình máy tính không đủ độ phân giải"}, {"letter": "B", "text": "Khả năng mở rộng (Scalability) và tốc độ xử lý giao dịch của Blockchain còn hạn chế so với tốc độ thời gian thực của ngành quảng cáo."}, {"letter": "C", "text": "Blockchain không hỗ trợ lưu trữ chữ viết"}, {"letter": "D", "text": "Thiếu điện năng để chạy các máy chủ"}], "answer": "B", "answerText": "Khả năng mở rộng (Scalability) và tốc độ xử lý giao dịch của Blockchain còn hạn chế so với tốc độ thời gian thực của ngành quảng cáo.", "explanation": "Ngành quảng cáo Programmatic yêu cầu xử lý hàng trăm nghìn đấu giá/giây. Tốc độ xác thực của Blockchain hiện tại là rào cản lớn về Scalability. 🟠 PHẦN 3: MỨC ĐỘ VẬN DỤNG (10 CÂU - CĐR 2.1 & 2.2) Mục tiêu: Đánh giá khả năng phân tích case study thực tế (IKEA, Sephora, Tesla, Coca-Cola), giải quyết bài toán trải nghiệm AR/VR và ứng dụng Blockchain.", "level": "Thông hiểu"}, {"num": 31, "question": "Case Study IKEA Place: Thương hiệu nội thất IKEA đã giải quyết bài toán lo âu \"Sofa này có vừa phòng khách nhà mình không?\" của khách hàng mua sắm online bằng giải pháp AR nào?", "options": [{"letter": "A", "text": "Cho nhân viên mang sofa thật đến nhà khách thử 1 ngày"}, {"letter": "B", "text": "Phát triển ứng dụng IKEA Place cho phép người dùng thả mô hình 3D của đồ nội thất chuẩn tỉ lệ vào không gian thực qua camera điện thoại."}, {"letter": "C", "text": "Tặng thước dây miễn phí cho khách hàng tự đo"}, {"letter": "D", "text": "Yêu cầu khách hàng vẽ bản vẽ kiến trúc nhà gửi cho IKEA"}], "answer": "B", "answerText": "Phát triển ứng dụng IKEA Place cho phép người dùng thả mô hình 3D của đồ nội thất chuẩn tỉ lệ vào không gian thực qua camera điện thoại.", "explanation": "Case Study IKEA Place ứng dụng AR mô phỏng 3D chuẩn kích thước giúp khách hàng xem trước món đồ trong căn phòng mình, giảm thiểu lo âu và tăng tỷ lệ chốt đơn.", "level": "Vận dụng"}, {"num": 32, "question": "Case Study Sephora Virtual Artist: Ứng dụng AR thử trang điểm ảo của Sephora mang lại kết quả kinh doanh đột phá nào?", "options": [{"letter": "A", "text": "Giảm 50% giá bán toàn bộ sản phẩm"}, {"letter": "B", "text": "Tăng đáng kể tỷ lệ chuyển đổi đơn hàng online, giảm tỷ lệ trả hàng và nâng cao sự hài lòng của khách hàng."}, {"letter": "C", "text": "Đóng cửa toàn bộ các cửa hàng vật lý"}, {"letter": "D", "text": "Miễn phí vận chuyển cho tất cả các đơn hàng"}], "answer": "B", "answerText": "Tăng đáng kể tỷ lệ chuyển đổi đơn hàng online, giảm tỷ lệ trả hàng và nâng cao sự hài lòng của khách hàng.", "explanation": "Sephora Virtual Artist cho phép khách dùng thử son/màu mắt ảo qua camera, giúp mua đúng màu hợp da, từ đó tăng tỷ lệ chuyển đổi và giảm đổi trả hàng.", "level": "Vận dụng"}, {"num": 33, "question": "Case Study Tesla: Tesla triển khai trải nghiệm Thực tế ảo (VR) tại các Showroom nhằm mục đích chiến lược gì?", "options": [{"letter": "A", "text": "Cho khách hàng chơi game đua xe giải trí"}, {"letter": "B", "text": "Cho phép khách hàng ngồi buồng lái ảo, tùy chỉnh màu sơn/nội thất và \"lái thử\" xe trong môi trường mô phỏng sang trọng."}, {"letter": "C", "text": "Bán kính VR kiếm thêm lợi nhuận"}, {"letter": "D", "text": "Giảm bớt số lượng nhân viên bảo vệ showroom"}], "answer": "B", "answerText": "Cho phép khách hàng ngồi buồng lái ảo, tùy chỉnh màu sơn/nội thất và \"lái thử\" xe trong môi trường mô phỏng sang trọng.", "explanation": "Tesla ứng dụng VR cung cấp trải nghiệm công nghệ cao: Khách hàng được ngồi lái thử ảo và tùy biến xe mơ ước ngay tại showroom, thúc đẩy quyết định mua xe.", "level": "Vận dụng"}, {"num": 34, "question": "Case Study Coca-Cola tại Zurich (FIFA World Cup): Chiến dịch tiếp thị trải nghiệm tại ga xe lửa của Coca-Cola đã ứng dụng AR/VR như thế nào?", "options": [{"letter": "A", "text": "Phát lon nước miễn phí cho toàn bộ hành khách"}, {"letter": "B", "text": "Đặt màn hình trải nghiệm cho phép hành khách đứng tương tác, đá bóng ảo cùng các cầu thủ nổi tiếng ngay tại nhà ga."}, {"letter": "C", "text": "Bán vé xem World Cup giá rẻ"}, {"letter": "D", "text": "Thu âm giọng nói của hành khách để làm quảng cáo"}], "answer": "B", "answerText": "Đặt màn hình trải nghiệm cho phép hành khách đứng tương tác, đá bóng ảo cùng các cầu thủ nổi tiếng ngay tại nhà ga.", "explanation": "Coca-Cola tạo điểm chạm kích hoạt thương hiệu tại Zurich: Hành khách đứng trước màn hình AR tương tác và tập luyện động tác bóng đá cùng cầu thủ ảo, tạo ấn tượng mạnh.", "level": "Vận dụng"}, {"num": 35, "question": "Một thương hiệu chuỗi cà phê muốn xây dựng hệ thống Khách hàng thân thiết (Loyalty Program) liên minh với các chuỗi rạp chiếu phim. Giải pháp Blockchain nào giúp tích điểm dùng chung dễ dàng?", "options": [{"letter": "A", "text": "Tạo mã giảm giá in trên giấy"}, {"letter": "B", "text": "Token hóa điểm thưởng trên nền tảng Blockchain chung, cho phép khách hàng tích và đổi điểm linh hoạt giữa cà phê và rạp chiếu phim mà không sợ gian lận."}, {"letter": "C", "text": "Yêu cầu khách hàng xuất trình căn cước công dân mỗi khi mua"}, {"letter": "D", "text": "Tự động gửi SMS mã OTP mỗi lần tích điểm"}], "answer": "B", "answerText": "Token hóa điểm thưởng trên nền tảng Blockchain chung, cho phép khách hàng tích và đổi điểm linh hoạt giữa cà phê và rạp chiếu phim mà không sợ gian lận.", "explanation": "Blockchain cho phép liên minh các doanh nghiệp phát hành Token điểm thưởng dùng chung, đảm bảo tính minh bạch, chống làm giả điểm và giảm chi phí đối soát.", "level": "Vận dụng"}, {"num": 36, "question": "Một cửa hàng bán kính mát online muốn giảm tỷ lệ khách hàng ngần ngại mua vì không biết dáng kính có hợp với khuôn mặt mình hay không. Bạn đề xuất tính năng AR nào?", "options": [{"letter": "A", "text": "Cho khách hàng gửi ảnh chân dung để nhân viên vẽ tay"}, {"letter": "B", "text": "Tích hợp tính năng \"Virtual Try-On\" qua AR trên Website/App để khách hàng ướm thử kính 3D trực tiếp lên khuôn mặt real-time."}, {"letter": "C", "text": "Gửi 5 cặp kính thật đến nhà khách để chọn 1"}, {"letter": "D", "text": "Tăng thời gian bảo hành kính lên 5 năm"}], "answer": "B", "answerText": "Tích hợp tính năng \"Virtual Try-On\" qua AR trên Website/App để khách hàng ướm thử kính 3D trực tiếp lên khuôn mặt real-time.", "explanation": "AR Virtual Try-On là giải pháp chuẩn xác cho ngành thời trang/phụ kiện (kính mát, trang sức) giúp thử đồ trực quan qua camera, thúc đẩy chuyển đổi ngay.", "level": "Vận dụng"}, {"num": 37, "question": "Doanh nghiệp bạn bị nghi ngờ ngốn ngân sách quảng cáo cho các lượt Click ảo (Bot Fraud). Để đảm bảo \"Tiền trao cháo múc\", bạn đề xuất kịch bản Smart Contract nào với đơn vị chạy Ads?", "options": [{"letter": "A", "text": "Trả trước 100% ngân sách quảng cáo"}, {"letter": "B", "text": "Cấu hình Smart Contract: Ngân sách chỉ tự động giải ngân cho nhà quảng cáo khi hệ thống Blockchain xác minh lượt nhấp/hành động đến từ người dùng thật."}, {"letter": "C", "text": "Yêu cầu công ty quảng cáo ký cam kết trên giấy"}, {"letter": "D", "text": "Tự đi bấm click quảng cáo của chính mình"}], "answer": "B", "answerText": "Cấu hình Smart Contract: Ngân sách chỉ tự động giải ngân cho nhà quảng cáo khi hệ thống Blockchain xác minh lượt nhấp/hành động đến từ người dùng thật.", "explanation": "Kịch bản \"Tiền trao cháo múc\" qua Smart Contract: Tiền nằm trên chuỗi khối và chỉ thanh toán tự động khi các điều kiện xác thực hợp lệ được ghi nhận.", "level": "Vận dụng"}, {"num": 38, "question": "Một thương hiệu nước hoa triển khai chiến dịch AR Filter trên Instagram. Để đánh giá mức độ lan truyền thương hiệu (Virality Metrics), Marketer cần ưu tiên theo dõi chỉ số nào?", "options": [{"letter": "A", "text": "Chi phí điện năng chạy máy chủ"}, {"letter": "B", "text": "Số lượt người dùng quay video dùng filter và chia sẻ (Shares), số lượt dùng hashtag và số lượt nhắc tên thương hiệu trên MXH."}, {"letter": "C", "text": "Tốc độ gõ phím của nhân viên thiết kế"}, {"letter": "D", "text": "Số lượng sản phẩm bán ra tại cửa hàng offline"}], "answer": "B", "answerText": "Số lượt người dùng quay video dùng filter và chia sẻ (Shares), số lượt dùng hashtag và số lượt nhắc tên thương hiệu trên MXH.", "explanation": "Nhóm Virality Metrics tập trung đo lường tính lan tỏa: Số lượt share UGC, lượt sử dụng hashtag và tốc độ phủ sóng thương hiệu trên mạng xã hội.", "level": "Vận dụng"}, {"num": 39, "question": "Một thương hiệu sữa tươi muốn thực hiện chiến lược \"Phát triển sản phẩm\" (Product Development) trong Marketing tập trung cho tệp khách hàng người cao tuổi hiện tại. Đâu là bước đi đúng đắn?", "options": [{"letter": "A", "text": "Mở rộng bán sữa tươi sang thị trường Châu Âu"}, {"letter": "B", "text": "Nghiên cứu và tung ra dòng sản phẩm mới \"Sữa bổ sung Canxi & Bổ não\" thiết kế riêng cho tệp khách hàng người cao tuổi hiện có."}, {"letter": "C", "text": "Giảm giá bán sữa tươi xuống 50%"}, {"letter": "D", "text": "Đổi tên thương hiệu sữa tươi thành tên tiếng Anh"}], "answer": "B", "answerText": "Nghiên cứu và tung ra dòng sản phẩm mới \"Sữa bổ sung Canxi & Bổ não\" thiết kế riêng cho tệp khách hàng người cao tuổi hiện có.", "explanation": "Chiến lược Product Development là tạo ra sản phẩm mới/cải tiến sản phẩm để phục vụ tốt hơn cho tệp thị trường hiện có của doanh nghiệp.", "level": "Vận dụng"}, {"num": 40, "question": "Một hợp tác社 sản xuất Trà Shan Tuyết cổ thụ muốn chứng minh sản phẩm của mình đạt chuẩn Organic 100% không hóa chất để bán với giá cao. Ứng dụng Blockchain nào giải quyết triệt để bài toán này?", "options": [{"letter": "A", "text": "Dán tem giấy tự in lên hộp trà"}, {"letter": "B", "text": "Tích hợp mã QR Blockchain trên bao bì: Mỗi công đoạn (hái trà, chế biến, kiểm định chất lượng, đóng gói) đều được nông dân và đơn vị kiểm định ghi nhận bất biến lên chuỗi khối."}, {"letter": "C", "text": "Thuê diễn viên nổi tiếng nói trà sạch"}, {"letter": "D", "text": "Đăng bài khẳng định uy tín trên Facebook cá nhân"}], "answer": "B", "answerText": "Tích hợp mã QR Blockchain trên bao bì: Mỗi công đoạn (hái trà, chế biến, kiểm định chất lượng, đóng gói) đều được nông dân và đơn vị kiểm định ghi nhận bất biến lên chuỗi khối.", "explanation": "Ứng dụng Blockchain truy xuất nguồn gốc nông sản (Farm-to-Table): Giúp minh bạch hóa toàn bộ chuỗi cung ứng, xóa bỏ nghi ngờ về chất lượng và nâng cao giá trị sản phẩm. 🔴 PHẦN 4: MỨC ĐỘ VẬN DỤNG CAO (10 CÂU - CĐR 2.2 & 4.1) Mục tiêu: Đánh giá khả năng phân tích tích hợp xu hướng tương lai (VR/AR, Blockchain, Centralized Marketing), giải quyết rào cản quy mô và đề xuất chiến lược tổng thể.", "level": "Vận dụng"}, {"num": 41, "question": "Đánh giá sự kết hợp mang tính chiến lược giữa Blockchain và Marketing tập trung (Centralized Marketing) được phân tích trong bài giảng?", "options": [{"letter": "A", "text": "Blockchain sẽ tiêu diệt hoàn toàn Marketing tập trung"}, {"letter": "B", "text": "Blockchain cung cấp hạ tầng minh bạch, bảo mật và xác minh dữ liệu giúp giải quyết các vấn đề cố hữu của Marketing tập trung (gian lận quảng cáo, lãng phí ngân sách, thiếu hụt niềm tin)."}, {"letter": "C", "text": "Marketing tập trung làm cho Blockchain bị chậm đi"}, {"letter": "D", "text": "Hai công nghệ này không thể kết hợp vì triết lý trái ngược"}], "answer": "B", "answerText": "Blockchain cung cấp hạ tầng minh bạch, bảo mật và xác minh dữ liệu giúp giải quyết các vấn đề cố hữu của Marketing tập trung (gian lận quảng cáo, lãng phí ngân sách, thiếu hụt niềm tin).", "explanation": "Kết luận Chương 5 khẳng định: Blockchain không chỉ dành cho marketing phi tập trung mà là công cụ nâng cấp, giải quyết các lỗ hổng gian lận và bảo mật cho Marketing tập trung.", "level": "Vận dụng cao"}, {"num": 42, "question": "Một tập đoàn Bất động sản muốn bán các căn hộ xa xỉ cho khách hàng thượng lưu quốc tế mà khách không cần bay đến xem trực tiếp. Đề xuất giải pháp VR/AR Marketing hoàn chỉnh?", "options": [{"letter": "A", "text": "Gửi ảnh chụp 2D qua email"}, {"letter": "B", "text": "Xây dựng Trải nghiệm Virtual Tour 360/VR đắm chìm cho phép tham quan nhà mẫu ảo, kết hợp AR cho phép tùy chỉnh màu sơn/nội thất theo sở thích real-time."}, {"letter": "C", "text": "Yêu cầu khách hàng bắt buộc phải bay sang xem"}, {"letter": "D", "text": "Cho nhân viên mô tả căn hộ qua điện thoại"}], "answer": "B", "answerText": "Xây dựng Trải nghiệm Virtual Tour 360/VR đắm chìm cho phép tham quan nhà mẫu ảo, kết hợp AR cho phép tùy chỉnh màu sơn/nội thất theo sở thích real-time.", "explanation": "Giải pháp VR/AR cho Bất động sản: Xóa bỏ rào cản địa lý, cho phép khách thượng lưu \"bước vào\" căn hộ ảo, tùy chỉnh nội thất và ra quyết định mua sắm từ xa.", "level": "Vận dụng cao"}, {"num": 43, "question": "Đánh giá sự phát triển của Metaverse sẽ định hình lại tương lai ngành Marketing như thế nào trong 5-10 năm tới?", "options": [{"letter": "A", "text": "Metaverse làm cho ngành tiếp thị bị x khách sạn hoặc đi taxi tức thì với tỷ lệ quy đổi minh bạch được mã hóa."}, {"letter": "C", "text": "Khách hàng phải tự gọi điện thỏa thuận tỷ lệ đổi điểm"}, {"letter": "D", "text": "Cấm khách hàng quy đổi điểm giữa các bên"}], "answer": "B", "answerText": "Phát hành Token chung trên chuỗi khối liên minh: Khách bay tích điểm -> Đổi sang điểm thuê khách sạn hoặc đi taxi tức thì với tỷ lệ quy đổi minh bạch được mã hóa.", "explanation": "Liên minh Loyalty trên Blockchain cho phép kết nối hệ sinh thái đa ngành, Token hóa điểm thưởng giúp trao đổi ngang giá tức thì và gia tăng giữ chân khách hàng.", "level": "Vận dụng cao"}, {"num": 48, "question": "Đánh giá chiến lược của các tập đoàn công nghệ lớn (Meta, Google, Amazon) đối với công nghệ Blockchain được đề cập trong bài giảng?", "options": [{"letter": "A", "text": "Tất cả các tập đoàn lớn đều cấm sử dụng Blockchain"}, {"letter": "B", "text": "Meta đầu tư Metaverse/NFT; Google phát triển xác minh quảng cáo Blockchain trên Cloud; Amazon cung cấp dịch vụ Managed Blockchain cho chuỗi cung ứng."}, {"letter": "C", "text": "Các tập đoàn chỉ tập trung vào quảng cáo báo in"}, {"letter": "D", "text": "Họ coi Blockchain là công cụ không có tương lai"}], "answer": "B", "answerText": "Meta đầu tư Metaverse/NFT; Google phát triển xác minh quảng cáo Blockchain trên Cloud; Amazon cung cấp dịch vụ Managed Blockchain cho chuỗi cung ứng.", "explanation": "Slide bài giảng dẫn chứng các Big Tech đều đang tích cực tích hợp Blockchain: Meta (nền tảng tài sản ảo), Google (xác minh ads), Amazon (Managed Blockchain service).", "level": "Vận dụng cao"}, {"num": 49, "question": "Phân tích sự chuyển dịch từ tiếp thị thụ động sang tiếp thị tương tác đắm chìm (Immersive Marketing) trong kỷ nguyên số?", "options": [{"letter": "A", "text": "Người tiêu dùng muốn đọc nhiều văn bản quảng cáo hơn"}, {"letter": "B", "text": "Người tiêu dùng (đặc biệt Gen Z) giảm lòng tin vào quảng cáo 1 chiều, đòi hỏi quyền \"sống\", dùng thử, tương tác 3D và tự tay tạo dấu ấn cá nhân (UGC)."}, {"letter": "C", "text": "Doanh nghiệp không cần phải sáng tạo nội dung nữa"}, {"letter": "D", "text": "Quảng cáo truyền hình sẽ lấy lại vị thế số 1"}], "answer": "B", "answerText": "Người tiêu dùng (đặc biệt Gen Z) giảm lòng tin vào quảng cáo 1 chiều, đòi hỏi quyền \"sống\", dùng thử, tương tác 3D và tự tay tạo dấu ấn cá nhân (UGC).", "explanation": "Tiếp thị hiện đại dịch chuyển từ \"cho khách xem\" sang \"cho khách sống cùng\". VR/AR và tương tác 3D giải quyết đúng kỳ vọng về sự duy nhất và trải nghiệm đa tầng của người dùng.", "level": "Vận dụng cao"}, {"num": 50, "question": "Đánh giá tổng kết vai trò của Chương 5 (VR/AR, Blockchain, Centralized Marketing) đối với bức tranh tổng thể Công nghệ Marketing hiện đại?", "options": [{"letter": "A", "text": "Chỉ là các khái niệm lý thuyết không có tính ứng dụng"}, {"letter": "B", "text": "Là các mảnh ghép công nghệ tiên phong định hình tương lai: nâng cao trải nghiệm cảm xúc (VR/AR), củng cố niềm tin và sự minh bạch (Blockchain) và tối ưu hóa lực lượng cạnh tranh (Marketing tập trung)."}, {"letter": "C", "text": "Làm tăng chi phí tiếp thị mà không mang lại doanh thu"}, {"letter": "D", "text": "Chỉ phù hợp với các thị trường phát triển ở Châu Âu"}], "answer": "B", "answerText": "Là các mảnh ghép công nghệ tiên phong định hình tương lai: nâng cao trải nghiệm cảm xúc (VR/AR), củng cố niềm tin và sự minh bạch (Blockchain) và tối ưu hóa lực lượng cạnh tranh (Marketing tập trung).", "explanation": "Kết luận toàn bộ Chương 5: VR/AR giải bài toán trải nghiệm cảm xúc, Blockchain giải bài toán minh bạch/niềm tin, còn Marketing tập trung tối ưu hóa hiệu quả nguồn lực, tạo nên lợi thế cạnh tranh bền vững.", "level": "Vận dụng cao"}]}]};

const state = {
  chapter: Number(localStorage.getItem("martech_chapter") || 1),
  section: localStorage.getItem("martech_section") || "theory",
  quizIndex: {},
  answers: {}
};

for (let ch=1; ch<=5; ch++) {
  state.quizIndex[ch] = Number(localStorage.getItem(`martech_qidx_${ch}`) || 0);
  try { state.answers[ch] = JSON.parse(localStorage.getItem(`martech_answers_${ch}`) || "{}"); }
  catch { state.answers[ch] = {}; }
}

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

function chapterData(){ return DATA.chapters[state.chapter-1]; }
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
}
function formatText(s){ return esc(s).replace(/\s+/g," ").trim(); }

function saveBase(){
  localStorage.setItem("martech_chapter", state.chapter);
  localStorage.setItem("martech_section", state.section);
}
function saveQuiz(ch){
  localStorage.setItem(`martech_qidx_${ch}`, state.quizIndex[ch]);
  localStorage.setItem(`martech_answers_${ch}`, JSON.stringify(state.answers[ch]));
  updateOverallProgress();
}

function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(window._toastTimer);
  window._toastTimer=setTimeout(()=>t.classList.remove("show"),1600);
}

function renderChapterNav(){
  const nav=$("#chapterNav");
  nav.innerHTML=DATA.chapters.map(c =>
    `<button class="chapter-btn ${c.id===state.chapter?"active":""}" data-ch="${c.id}">Chương ${c.id}</button>`
  ).join("");
  nav.querySelectorAll(".chapter-btn").forEach(btn => btn.onclick=()=>{
    state.chapter=Number(btn.dataset.ch); saveBase(); renderAll();
    window.scrollTo({top:0,behavior:"smooth"});
  });
}

function renderHero(){
  const c=chapterData();
  $("#heroTitle").textContent=`Chương ${c.id}: ${c.title}`;
  $("#heroDesc").textContent=
    state.section==="theory" ? "Nắm phần kiến thức trọng tâm trước khi chuyển sang câu hỏi và bài tập." :
    state.section==="qa" ? "Ôn 10 câu hỏi giảng viên theo dạng mở — bấm vào từng câu để xem lời giải." :
    "Làm 50 câu theo 4 mức độ. Chọn đáp án xong sẽ hiện kết quả và giải thích chi tiết ngay.";
}

function renderSide(){
  $$(".section-btn").forEach(b=>{
    b.classList.toggle("active", b.dataset.section===state.section);
    b.onclick=()=>{
      state.section=b.dataset.section; saveBase(); renderAll();
      document.querySelector(".content-card").scrollIntoView({behavior:"smooth",block:"start"});
    };
  });
}

function termify(text){
  const idx=text.indexOf(":");
  if(idx>0 && idx<75){
    return `<strong>${formatText(text.slice(0,idx+1))}</strong> ${formatText(text.slice(idx+1))}`;
  }
  return formatText(text);
}

function renderTheory(){
  const c=chapterData();
  const items=c.theory;
  $("#content").innerHTML=`
    <div class="content-head">
      <div><div class="kicker">Phần 1 · Kiến thức</div><h2>Lý thuyết trọng tâm</h2>
      <p>Tóm tắt nội dung cốt lõi của Chương ${c.id} từ tài liệu ôn tập.</p></div>
      <span class="badge">${items.length} ý trọng tâm</span>
    </div>
    <div class="theory-grid">
      ${items.map((x,i)=>`<div class="theory-item ${x.length>180?"full":""}">${termify(x)}</div>`).join("")}
    </div>
    <div class="footer-nav">
      <span></span>
      <button class="btn primary" id="nextSection">Tiếp: Câu hỏi giảng viên →</button>
    </div>`;
  $("#nextSection").onclick=()=>{state.section="qa";saveBase();renderAll();scrollToContent()};
}

function renderQA(){
  const c=chapterData();
  $("#content").innerHTML=`
    <div class="content-head">
      <div><div class="kicker">Phần 2 · Tự luận</div><h2>Câu hỏi giảng viên & bài giải</h2>
      <p>Bấm vào câu hỏi để tự nhớ trước, sau đó mở lời giải để đối chiếu.</p></div>
      <span class="badge">10 câu</span>
    </div>
    <div class="qa-list">
      ${c.qa.map(q=>`
        <article class="qa-item">
          <button class="qa-q">
            <span class="qnum">Câu ${q.num}</span>
            <span class="qtext">${formatText(q.question)}</span>
            <span class="chev">⌄</span>
          </button>
          <div class="qa-a">${q.answer.map(a=>`<p class="answer-line">${termify(a)}</p>`).join("")}</div>
        </article>`).join("")}
    </div>
    <div class="footer-nav">
      <button class="btn" id="prevSection">← Lý thuyết</button>
      <button class="btn primary" id="nextSection">Tiếp: Trắc nghiệm →</button>
    </div>`;
  $$(".qa-q").forEach(b=>b.onclick=()=>b.closest(".qa-item").classList.toggle("open"));
  $("#prevSection").onclick=()=>{state.section="theory";saveBase();renderAll();scrollToContent()};
  $("#nextSection").onclick=()=>{state.section="quiz";saveBase();renderAll();scrollToContent()};
}

function levelClass(level){
  return level==="Nhận biết"?"nb":level==="Thông hiểu"?"th":level==="Vận dụng"?"vd":"vdc";
}

function renderQuiz(){
  const c=chapterData(), ch=c.id;
  let idx=Math.max(0,Math.min(49,state.quizIndex[ch]||0)); state.quizIndex[ch]=idx;
  const q=c.quiz[idx], saved=state.answers[ch][q.num];
  const answered=Object.keys(state.answers[ch]).length;
  const correct=Object.values(state.answers[ch]).filter(x=>x.correct).length;
  const percent=Math.round(answered/50*100);

  $("#content").innerHTML=`
    <div class="content-head">
      <div><div class="kicker">Phần 3 · Luyện tập</div><h2>Trắc nghiệm Chương ${ch}</h2>
      <p>Chọn 1 đáp án. Kết quả và giải thích chi tiết sẽ xuất hiện ngay.</p></div>
      <span class="badge">${answered}/50 đã làm</span>
    </div>

    <div class="quiz-toolbar">
      <div class="quiz-meter">
        <div class="quiz-meter-top"><span>Tiến độ chương</span><span>${percent}%</span></div>
        <div class="progress-track"><div class="progress-fill" style="width:${percent}%"></div></div>
      </div>
      <div class="score-box">Đúng: <span class="score-num">${correct}</span> / ${answered || 0}</div>
      <button class="btn danger" id="resetQuiz">Làm lại</button>
    </div>

    <article class="quiz-card">
      <div class="quiz-meta">
        <span class="level ${levelClass(q.level)}">${q.level}</span>
        <span class="badge">Câu ${q.num}/50</span>
      </div>
      <div class="quiz-question">${formatText(q.question)}</div>
      <div class="options" id="options">
        ${q.options.map(o=>{
          let cls="";
          if(saved){
            if(o.letter===q.answer) cls="correct";
            else if(o.letter===saved.choice && saved.choice!==q.answer) cls="wrong";
          }
          return `<button class="option ${cls}" data-letter="${o.letter}" ${saved?"disabled":""}>
            <span class="letter">${o.letter}</span><span>${formatText(o.text)}</span>
          </button>`;
        }).join("")}
      </div>
      <div class="feedback ${saved?"show "+(saved.correct?"good":"bad"):""}" id="feedback">
        ${saved ? feedbackHTML(q,saved) : ""}
      </div>
      <div class="quiz-actions">
        <button class="btn" id="prevQ" ${idx===0?"disabled":""}>← Câu trước</button>
        <button class="btn primary" id="nextQ">${idx===49?"Xem lại từ đầu":"Câu tiếp →"}</button>
      </div>
      <div class="quiz-jump">
        ${c.quiz.map((qq,i)=>{
          const a=state.answers[ch][qq.num];
          const cls=i===idx?"current":a?(a.correct?"done-good":"done-bad"):"";
          return `<button class="jump ${cls}" data-i="${i}" title="Câu ${qq.num}">${qq.num}</button>`;
        }).join("")}
      </div>
    </article>

    <div class="footer-nav">
      <button class="btn" id="prevSection">← Câu hỏi giảng viên</button>
      <button class="btn" id="nextChapter">${ch<5?"Sang Chương "+(ch+1)+" →":"Về Chương 1 ↺"}</button>
    </div>`;

  if(!saved){
    $$(".option").forEach(btn=>btn.onclick=()=>answerQuestion(btn.dataset.letter));
  }
  $("#prevQ").onclick=()=>{if(idx>0){state.quizIndex[ch]=idx-1;saveQuiz(ch);renderQuiz();scrollToQuiz()}};
  $("#nextQ").onclick=()=>{state.quizIndex[ch]=idx===49?0:idx+1;saveQuiz(ch);renderQuiz();scrollToQuiz()};
  $$(".jump").forEach(b=>b.onclick=()=>{state.quizIndex[ch]=Number(b.dataset.i);saveQuiz(ch);renderQuiz();scrollToQuiz()});
  $("#resetQuiz").onclick=()=>{
    if(confirm(`Xóa toàn bộ kết quả trắc nghiệm Chương ${ch} và làm lại từ đầu?`)){
      state.answers[ch]={}; state.quizIndex[ch]=0; saveQuiz(ch); renderQuiz(); toast("Đã đặt lại bài trắc nghiệm");
    }
  };
  $("#prevSection").onclick=()=>{state.section="qa";saveBase();renderAll();scrollToContent()};
  $("#nextChapter").onclick=()=>{
    state.chapter = ch<5 ? ch+1 : 1;
    state.section = "theory"; saveBase(); renderAll(); window.scrollTo({top:0,behavior:"smooth"});
  };
}

function feedbackHTML(q,saved){
  if(saved.correct){
    return `<div class="feedback-title">✓ Chính xác — đáp án ${q.answer}</div>
      <div>${formatText(q.explanation)}</div>`;
  }
  return `<div class="feedback-title">✗ Chưa đúng — đáp án đúng là ${q.answer}. ${formatText(q.answerText)}</div>
    <div>${formatText(q.explanation)}</div>`;
}

function answerQuestion(letter){
  const c=chapterData(), ch=c.id, q=c.quiz[state.quizIndex[ch]];
  if(state.answers[ch][q.num]) return;
  const correct=letter===q.answer;
  state.answers[ch][q.num]={choice:letter,correct};
  saveQuiz(ch);
  renderQuiz();
  toast(correct ? "Chính xác! 🎉" : `Chưa đúng — đáp án là ${q.answer}`);
}

function scrollToQuiz(){
  const el=document.querySelector(".quiz-card");
  if(el) el.scrollIntoView({behavior:"smooth",block:"start"});
}
function scrollToContent(){
  document.querySelector(".content-card").scrollIntoView({behavior:"smooth",block:"start"});
}

function updateOverallProgress(){
  const done=DATA.chapters.reduce((sum,c)=>sum+Object.keys(state.answers[c.id]||{}).length,0);
  const pct=Math.round(done/250*100);
  $("#overallText").textContent=`Quiz ${done}/250 · ${pct}%`;
  $("#overallFill").style.width=pct+"%";
}

function renderAll(){
  renderChapterNav(); renderHero(); renderSide(); updateOverallProgress();
  if(state.section==="theory") renderTheory();
  else if(state.section==="qa") renderQA();
  else renderQuiz();
}
renderAll();
</script>
</body>
</html>
