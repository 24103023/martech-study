ao"}, {"num": 49, "question": "Trong bài học về Chatbot Unibot của Uniqlo, bài học chiến lược quan trọng nhất khi áp dụng AI vào Chăm sóc khách hàng là gì?", "options": [{"letter": "A", "text": "Phải thay thế 100% nhân viên tổng đài bằng AI"}, {"letter": "B", "text": "AI đóng vai trò xử lý các tác vụ quy chuẩn 24/7 và hỗ trợ phân tích; các tình huống phức tạp/cảm xúc cao bắt buộc phải có sự phối hợp liền mạch với con người (Hybrid model)"}, {"letter": "C", "text": "Không nên sử dụng AI vì quá tốn kém"}, {"letter": "D", "text": "Chỉ dùng Chatbot cho mục đích chơi game giải trí"}], "answer": "B", "answerText": "AI đóng vai trò xử lý các tác vụ quy chuẩn 24/7 và hỗ trợ phân tích; các tình huống phức tạp/cảm xúc cao bắt buộc phải có sự phối hợp liền mạch với con người (Hybrid model)", "explanation": "Bài học chiến lược cuối slide Chương 3.2: Kết hợp Con người & AI (Hybrid Model) — AI tối ưu tốc độ và dữ liệu, con người mang lại sự thấu hiểu đồng cảm sâu sắc.", "level": "Vận dụng cao"}, {"num": 50, "question": "Đánh giá tổng thể vai trò của Chương 3 (Marketing Automation, Chatbot, Retargeting) trong việc xây dựng năng lực cạnh tranh số cho doanh nghiệp?", "options": [{"letter": "A", "text": "Chỉ là các thủ thuật kỹ thuật ngắn hạn để tăng view"}, {"letter": "B", "text": "Là trụ cột vận hành giúp doanh nghiệp tự động hóa quy trình, tối ưu hóa chi phí tiếp cận, cá nhân hóa trải nghiệm quy mô lớn và tăng trưởng doanh thu bền vững"}, {"letter": "C", "text": "Chỉ áp dụng được cho các công ty khởi nghiệp công nghệ"}, {"letter": "D", "text": "Làm giảm khả năng sáng tạo của đội ngũ marketing"}], "answer": "B", "answerText": "Là trụ cột vận hành giúp doanh nghiệp tự động hóa quy trình, tối ưu hóa chi phí tiếp cận, cá nhân hóa trải nghiệm quy mô lớn và tăng trưởng doanh thu bền vững", "explanation": "Bộ ba công cụ Tự động hóa - Chatbot AI - Retargeting cấu thành năng lực vận hành tiếp thị số hiện đại, giúp doanh nghiệp tối ưu chi phí và tăng trưởng bền vững.", "level": "Vận dụng cao"}]}, {"id": 4, "title": "Dữ liệu lớn (Big Data) & AI/Machine Learning trong Marketing", "theory": ["Mô hình 4V của Big Data:", "Volume: Khối lượng dữ liệu cực lớn.", "Velocity: Tốc độ phát sinh và xử lý real-time.", "Variety: Đa dạng định dạng (văn bản, hình ảnh, video, audio, GPS).", "Veracity: Độ tin cậy/chính xác của dữ liệu.", "Bài học New Coke (1985): Dựa vào thử nghiệm vị (taste test) 200.000 người nhưng thất bại vì bỏ qua yếu tố cảm xúc, thói quen và tính gắn kết thương hiệu dài hạn.", "Các Mô hình Dự đoán AI/ML:", "CLTV Prediction: Dự đoán giá trị trọn đời khách hàng.", "Recommendation Models: Đề xuất sản phẩm/nội dung cá nhân hóa (Amazon, Spotify, Netflix).", "Next Best Action: AI gợi ý hành động marketing tối ưu tiếp theo cho từng cá nhân."], "qa": [{"num": 1, "question": "Data là gì? Big Data là gì? Hãy giải thích điểm khác biệt cơ bản giữa dữ liệu thông thường và Big Data.", "answer": ["Data: Các sự thật, dữ kiện biết đựợc có thể ghi lại và mang ý nghĩa ẩn.", "Big Data: Tập hợp dữ liệu có dung lượng vượt trội, tốc độ sinh ra nhanh và đa dạng mà các phần mềm truyền thống không thể xử lý được.", "Khác biệt: Dữ liệu thông thường có dung lượng nhỏ, cấu trúc rõ ràng; Big Data vượt trội về quy mô (Volume), tốc độ (Velocity), độ đa dạng (Variety) và tính phức tạp."]}, {"num": 2, "question": "Trình bày và giải thích mô hình 4V của Big Data: Volume, Velocity, Variety, Veracity. Hãy đưa ra một ví dụ marketing đơn giản cho mỗi đặc điểm.", "answer": ["Volume (Kích thước): Khối lượng dữ liệu cực lớn. VD: Hàng tỷ lượt click mỗi ngày trên trang Shopee.", "Velocity (Tốc độ): Dữ liệu phát sinh và xử lý real-time. VD: Grab xử lý định vị tài xế và khách hàng theo từng giây.", "Variety (Đa dạng): Nhiều định dạng (text, video, ảnh, GPS, âm thanh). VD: Đánh giá sản phẩm gồm cả bài viết và video clip thực tế.", "Veracity (Độ tin cậy): Tính chính xác của dữ liệu. VD: Lọc bỏ các đánh giá ảo/seeding giả mạo trên sàn thương mại điện tử."]}, {"num": 3, "question": "Trình bày các ứng dụng chính của Big Data trong Marketing: Xây dựng hồ sơ KH 360; Phân tích hành vi & sở thích; Cá nhân hóa; Recommendation; Tối ưu quảng cáo; Đo lường hiệu suất.", "answer": ["Big Data giúp tổng hợp dữ liệu đa điểm chạm thành hồ sơ 360 độ, dùng thuật toán bóc tách sở thích ẩn, đề xuất sản phẩm chuẩn xác (Amazon, Spotify), tối ưu hóa chiến dịch A/B Testing và xác định chính xác ROI cùng mô hình quy kết (Attribution modeling)."]}, {"num": 4, "question": "Tại sao Veracity - độ tin cậy của dữ liệu đặc biệt quan trọng trong Marketing? Hãy đưa ra ví dụ về hậu quả khi doanh nghiệp đưa ra quyết định dựa trên: Dữ liệu sai; Dữ liệu thiếu; Dữ liệu lỗi thời; Dữ liệu không nhất quán.", "answer": ["Tầm quan trọng: Quyết định dựa trên dữ liệu sai dẫn đến thất bại chiến dịch và mất uy tín.", "Dữ liệu sai: Quảng cáo nhắm sai đối tượng do nick ảo -> lãng phí tiền.", "Dữ liệu thiếu: Gửi email thiếu tên/địa chỉ -> bị coi là spam.", "Dữ liệu lỗi thời: Gửi ưu đãi cho số điện thoại khách đã bỏ dùng.", "Dữ liệu không nhất quán: Giá sản phẩm trên App khác trên Website -> khách hàng mất niềm tin."]}, {"num": 5, "question": "Từ case New Coke, hãy trình bày bài học về việc sử dụng dữ liệu trong nghiên cứu và ra quyết định Marketing.", "answer": ["Bài học: Coca-Cola thử nghiệm vị (taste test) trên 200.000 người cho thấy thích New Coke hơn, nhưng thất bại thảm hại khi tung ra thị trường. Bài học rút ra là dữ liệu khảo sát 1 khoảnh khắc không đại diện cho trải nghiệm dài hạn, và không được bỏ qua yếu tố cảm xúc, thói quen và sự trung thành thương hiệu."]}, {"num": 6, "question": "AI và Machine Learning là gì? Trình bày mối quan hệ giữa AI và Machine Learning trong Marketing.", "answer": ["AI: Khả năng máy móc mô phỏng tư duy con người để giải quyết vấn đề.", "Machine Learning (ML): Tập con của AI, là phương pháp huấn luyện máy tính học từ dữ liệu để tự cải thiện.", "Mối quan hệ: ML là công cụ chính giúp AI thực thi các tác vụ dự đoán và đề xuất cá nhân hóa trong Marketing."]}, {"num": 7, "question": "Trình bày quy trình Machine Learning gồm: Data Collection -> Preprocessing -> Training -> Evaluation -> Improvement. Theo bạn, tại sao chất lượng dữ liệu đầu vào có thể ảnh hưởng mạnh tới kết quả của mô hình?", "answer": ["Quy trình gồm Thu thập -> Tiền xử lý (làm sạch) -> Huấn luyện mô hình -> Đánh giá -> Cải tiến.", "Ảnh hưởng dữ liệu đầu vào: Mô hình ML học trực tiếp từ dữ liệu được cung cấp. Nếu dữ liệu đầu vào nhiễu hoặc lệch (biased), mô hình sẽ đưa ra các dự đoán sai lệch hoàn toàn (\"Garbage in, Garbage out\")."]}, {"num": 8, "question": "Hãy giải thích cách AI/ML có thể được sử dụng trong Marketing để: Dự đoán nhu cầu; Cá nhân hóa sản phẩm/nội dung; Recommendation; Phân tích hành vi; Tối ưu quảng cáo.", "answer": ["ML phân tích mẫu mua hàng quá khứ để dự báo nhu cầu tương lai, tạo nội dung hiển thị riêng cho từng người, chạy mô hình Recommendation (như Netflix dùng công cụ AVA phân tích khung ảnh thumbnail cho phù hợp với từng người) và tự động điều chỉnh ngân sách quảng cáo real-time."]}, {"num": 9, "question": "Trình bày các loại dữ liệu hành vi khách hàng mà doanh nghiệp có thể thu thập: Transactional Data; Website/App Interaction Data; Social Media Data; Email/SMS Data; Customer Service Data; Location Data; Multimedia Data.", "answer": ["Transactional: Lịch sử đơn hàng, giá trị thanh toán.", "Interaction: Lượt click, thời gian xem trang, lộ trình di chuyển.", "Social: Like, share, bình luận, chỉ số cảm xúc.", "Email/SMS: Tỷ lệ mở, tỷ lệ nhấp.", "Customer Service: Log chat, nhật ký khiếu nại.", "Location: Vị trí GPS từ ứng dụng.", "Multimedia: Hình ảnh check-in, voice note."]}, {"num": 10, "question": "Trình bày các công nghệ/phương pháp có thể được sử dụng để thu thập và phân tích hành vi khách hàng như: Pixel/Cookie/SDK; Social Listening; CRM; Email Marketing Platform; Chatbot/Live Chat. Theo bạn, những thách thức chính khi thu thập dữ liệu hành vi khách hàng là gì?", "answer": ["Các công nghệ trên giúp gắn mã theo dõi, lắng nghe mạng xã hội và ghi nhận điểm chạm.", "Thách thức chính: Vấn đề bảo mật thông tin cá nhân (GDPR, Luật an ninh mạng), rào cản bỏ cookie của các trình duyệt và thách thức làm sạch khối lượng dữ liệu khổng lồ bị phân mảnh."]}], "quiz": [{"num": 1, "question": "Khái niệm \"Data\" (Dữ liệu) được định nghĩa như thế nào trong bài giảng Chương 4?", "options": [{"letter": "A", "text": "Các ý kiến cá nhân chưa được kiểm chứng trên mạng xã hội"}, {"letter": "B", "text": "Các sự thật, dữ kiện hoặc số liệu được ghi lại, mang ý nghĩa ẩn và có thể xử lý được bằng máy tính"}, {"letter": "C", "text": "Tất cả các cuốn sách in trong thư viện"}, {"letter": "D", "text": "Phần mềm máy tính dùng để vẽ đồ họa"}], "answer": "B", "answerText": "Các sự thật, dữ kiện hoặc số liệu được ghi lại, mang ý nghĩa ẩn và có thể xử lý được bằng máy tính", "explanation": "Slide bài giảng Chương 4 mở đầu định nghĩa Data là các sự thật, dữ kiện hoặc số liệu biết được có thể ghi lại và mang ý nghĩa ẩn bên trong.", "level": "Nhận biết"}, {"num": 2, "question": "Khái niệm \"Big Data\" (Dữ liệu lớn) khác biệt cốt lõi với dữ liệu thông thường ở điểm nào?", "options": [{"letter": "A", "text": "Big Data chỉ chứa văn bản tiếng Anh"}, {"letter": "B", "text": "Khối lượng dữ liệu cực lớn, tốc độ phát sinh nhanh và đa dạng định dạng mà các công cụ xử lý dữ liệu truyền thống không thể đảm nhận"}, {"letter": "C", "text": "Big Data hoàn toàn miễn phí trên Internet"}, {"letter": "D", "text": "Big Data chỉ do các cơ quan nhà nước nắm giữ"}], "answer": "B", "answerText": "Khối lượng dữ liệu cực lớn, tốc độ phát sinh nhanh và đa dạng định dạng mà các công cụ xử lý dữ liệu truyền thống không thể đảm nhận", "explanation": "Bài giảng định nghĩa Big Data là thuật ngữ chỉ các tập dữ liệu có dung lượng vượt trội, tốc độ sinh ra nhanh và cấu trúc đa dạng mà phần mềm quản trị cơ sở dữ liệu truyền thống khó thu thập và xử lý.", "level": "Nhận biết"}, {"num": 3, "question": "Mô hình 4V kinh điển của Big Data bao gồm 4 đặc trưng nào?", "options": [{"letter": "A", "text": "Vision - Value - Victory - Version"}, {"letter": "B", "text": "Volume - Velocity - Variety - Veracity"}, {"letter": "C", "text": "Virtual - Video - Voice - Venture"}, {"letter": "D", "text": "Validity - Variables - Variance - Verification"}], "answer": "B", "answerText": "Volume - Velocity - Variety - Veracity", "explanation": "Slide Chương 4 nhấn mạnh mô hình 4V đại diện cho Big Data: Volume (Kích thước), Velocity (Tốc độ), Variety (Đa dạng), và Veracity (Độ tin cậy).", "level": "Nhận biết"}, {"num": 4, "question": "Trong mô hình 4V, đặc trưng \"Volume\" đại diện cho yếu tố nào?", "options": [{"letter": "A", "text": "Độ chính xác của thông tin"}, {"letter": "B", "text": "Tốc độ truyền tải dữ liệu qua mạng"}, {"letter": "C", "text": "Khối lượng hoặc dung lượng cực lớn của dữ liệu (từ Gigabyte đến Petabyte, Exabyte)"}, {"letter": "D", "text": "Sự phong phú về các loại tệp tin"}], "answer": "C", "answerText": "Khối lượng hoặc dung lượng cực lớn của dữ liệu (từ Gigabyte đến Petabyte, Exabyte)", "explanation": "Volume thể hiện quy mô khổng lồ của dữ liệu được thu thập và lưu trữ trong hệ thống Big Data.", "level": "Nhận biết"}, {"num": 5, "question": "Đặc trưng \"Velocity\" trong Big Data ám chỉ điều gì?", "options": [{"letter": "A", "text": "Tốc độ phát sinh và xử lý dữ liệu theo thời gian thực (real-time)"}, {"letter": "B", "text": "Chi phí lưu trữ dữ liệu ngày càng giảm"}, {"letter": "C", "text": "Số lượng máy tính tham gia vào hệ thống"}, {"letter": "D", "text": "Độ dài của bài viết quảng cáo"}], "answer": "A", "answerText": "Tốc độ phát sinh và xử lý dữ liệu theo thời gian thực (real-time)", "explanation": "Velocity là tốc độ dữ liệu được tạo ra, di chuyển và xử lý tức thì theo thời gian thực để đưa ra phản hồi nhanh chóng.", "level": "Nhận biết"}, {"num": 6, "question": "Sự đa dạng về các định dạng dữ liệu (văn bản, hình ảnh, video, âm thanh, dữ liệu vị trí GPS) phản ánh đặc trưng nào của Big Data?", "options": [{"letter": "A", "text": "Volume"}, {"letter": "B", "text": "Velocity"}, {"letter": "C", "text": "Variety"}, {"letter": "D", "text": "Veracity"}], "answer": "C", "answerText": "Variety", "explanation": "Variety thể hiện tính đa dạng của dữ liệu (bao gồm dữ liệu có cấu trúc như bảng biểu, và dữ liệu phi cấu trúc như video, ảnh, audio, log chat).", "level": "Nhận biết"}, {"num": 7, "question": "Đặc trưng \"Veracity\" trong mô hình 4V đề cập đến khía cạnh nào của dữ liệu?", "options": [{"letter": "A", "text": "Tốc độ tải dữ liệu về điện thoại"}, {"letter": "B", "text": "Độ tin cậy, tính chính xác và chất lượng của dữ liệu thu thập được"}, {"letter": "C", "text": "Khả năng bảo mật mật khẩu"}, {"letter": "D", "text": "Dung lượng lưu trữ trên thẻ nhớ"}], "answer": "B", "answerText": "Độ tin cậy, tính chính xác và chất lượng của dữ liệu thu thập được", "explanation": "Veracity đo lường độ tin cậy và tính chính xác của dữ liệu, đảm bảo dữ liệu không bị nhiễu, giả mạo hoặc sai lệch.", "level": "Nhận biết"}, {"num": 8, "question": "Trí tuệ nhân tạo (Artificial Intelligence - AI) được định nghĩa là gì?", "options": [{"letter": "A", "text": "Một loại robot cơ khí biết đi lại và nói chuyện"}, {"letter": "B", "text": "Khả năng của máy tính hoặc hệ thống mô phỏng tư duy, nhận thức và khả năng ra quyết định giống như con người"}, {"letter": "C", "text": "Việc lập trình trang web bằng ngôn ngữ HTML"}, {"letter": "D", "text": "Hệ thống mạng Internet băng thông rộng"}], "answer": "B", "answerText": "Khả năng của máy tính hoặc hệ thống mô phỏng tư duy, nhận thức và khả năng ra quyết định giống như con người", "explanation": "AI là ngành khoa học máy tính tập trung tạo ra các hệ thống có khả năng thực hiện các tác vụ đòi hỏi trí tuệ con người (học hỏi, suy luận, tự sửa lỗi).", "level": "Nhận biết"}, {"num": 9, "question": "Machine Learning (Học máy) có mối quan hệ như thế nào với Artificial Intelligence (AI)?", "options": [{"letter": "A", "text": "Machine Learning là một tập con (subcategory) của AI, sử dụng các thuật toán để máy tính tự học từ dữ liệu mà không cần lập trình cứng"}, {"letter": "B", "text": "Machine Learning là phần mềm hoàn toàn độc lập không liên quan tới AI"}, {"letter": "C", "text": "AI là một phần nhỏ thuộc Machine Learning"}, {"letter": "D", "text": "Machine Learning là tên gọi khác của hệ điều hành Windows"}], "answer": "A", "answerText": "Machine Learning là một tập con (subcategory) của AI, sử dụng các thuật toán để máy tính tự học từ dữ liệu mà không cần lập trình cứng", "explanation": "Bài giảng làm rõ: Machine Learning là một nhánh cốt lõi thuộc AI, tập trung vào việc huấn luyện máy tính học từ dữ liệu quá khứ để phát hiện quy luật và tự cải thiện.", "level": "Nhận biết"}, {"num": 10, "question": "Quy trình Machine Learning tiêu chuẩn gồm 5 bước theo thứ tự nào?", "options": [{"letter": "A", "text": "Training -> Data Collection -> Evaluation -> Preprocessing -> Improvement"}, {"letter": "B", "text": "Data Collection (Thu thập) -> Preprocessing (Tiền xử lý/Làm sạch) -> Training (Huấn luyện) -> Evaluation (Đánh giá) -> Improvement (Cải tiến)"}, {"letter": "C", "text": "Evaluation -> Training -> Data Collection -> Preprocessing -> Improvement"}, {"letter": "D", "text": "Preprocessing -> Data Collection -> Training -> Improvement -> Evaluation"}], "answer": "B", "answerText": "Data Collection (Thu thập) -> Preprocessing (Tiền xử lý/Làm sạch) -> Training (Huấn luyện) -> Evaluation (Đánh giá) -> Improvement (Cải tiến)", "explanation": "Sơ đồ quy trình ML trong slide Chương 4 gồm 5 bước: Thu thập dữ liệu -> Làm sạch & tiền xử lý -> Huấn luyện mô hình -> Đánh giá độ chính xác -> Cải tiến mô hình.", "level": "Nhận biết"}, {"num": 11, "question": "Hệ thống đề xuất (Recommendation Engine) của Amazon, Spotify hay Netflix ứng dụng công nghệ nào để đưa ra gợi ý sản phẩm/nội dung cá nhân hóa?", "options": [{"letter": "A", "text": "Quảng cáo trên báo in"}, {"letter": "B", "text": "Machine Learning & Predictive Analytics (Phân tích dự báo)"}, {"letter": "C", "text": "Kỹ thuật khảo sát gọi điện trực tiếp"}, {"letter": "D", "text": "Phần mềm Microsoft Word"}], "answer": "B", "answerText": "Machine Learning & Predictive Analytics (Phân tích dự báo)", "explanation": "Slide Chương 4 dẫn chứng Amazon, Spotify và Netflix sử dụng các thuật toán Machine Learning để phân tích hành vi tiêu dùng và đưa ra gợi ý cá nhân hóa.", "level": "Nhận biết"}, {"num": 12, "question": "Loại dữ liệu ghi nhận lịch sử đơn hàng, giá trị thanh toán, mã giảm giá đã dùng của khách hàng được gọi là nhóm dữ liệu nào?", "options": [{"letter": "A", "text": "Transactional Data (Dữ liệu giao dịch)"}, {"letter": "B", "text": "Location Data (Dữ liệu vị trí)"}, {"letter": "C", "text": "Social Media Data (Dữ liệu mạng xã hội)"}, {"letter": "D", "text": "Multimedia Data (Dữ liệu đa phương tiện)"}], "answer": "A", "answerText": "Transactional Data (Dữ liệu giao dịch)", "explanation": "Transactional Data bao gồm lịch sử mua hàng, thời gian thanh toán, số lượng sản phẩm, phương thức thanh toán và các giao dịch tài chính.", "level": "Nhận biết"}, {"num": 13, "question": "Thao tác lượt click, thời gian ở lại trang (time-on-site), lộ trình di chuyển giữa các trang trên Website/App thuộc nhóm dữ liệu nào?", "options": [{"letter": "A", "text": "Transactional Data"}, {"letter": "B", "text": "Interaction / Clickstream Data (Dữ liệu tương tác/dấu vết click)"}, {"letter": "C", "text": "Customer Service Data"}, {"letter": "D", "text": "Financial Report Data"}], "answer": "B", "answerText": "Interaction / Clickstream Data (Dữ liệu tương tác/dấu vết click)", "explanation": "Clickstream Data ghi lại toàn bộ hành trình tương tác của khách hàng khi lướt web/app (click, cuộn trang, xem sản phẩm).", "level": "Nhận biết"}, {"num": 14, "question": "Công cụ nào sau đây được gắn vào website để thu thập dữ liệu hành vi người dùng bằng các đoạn mã theo dõi?", "options": [{"letter": "A", "text": "Thẻ căn cước công dân"}, {"letter": "B", "text": "Pixel / Cookie / SDK"}, {"letter": "C", "text": "Máy quét mã vạch"}, {"letter": "D", "text": "Bàn phím máy tính"}], "answer": "B", "answerText": "Pixel / Cookie / SDK", "explanation": "Pixel, Cookie (trên web) và SDK (trên ứng dụng di động) là các công nghệ theo dõi hành vi và thu thập dữ liệu tương tác của người dùng.", "level": "Nhận biết"}, {"num": 15, "question": "Nguyên lý \"Garbage in, Garbage out\" (GIGO) trong khoa học dữ liệu và Machine Learning có ý nghĩa gì?", "options": [{"letter": "A", "text": "Rác thải máy tính phải được tái chế"}, {"letter": "B", "text": "Nếu dữ liệu đầu vào là \"rác\" (sai lệch, nhiễu, thiếu sót), kết quả đầu ra của mô hình AI/ML cũng sẽ là \"rác\" (dự đoán sai hoàn toàn)"}, {"letter": "C", "text": "Phần mềm AI tự động dọn rác ổ cứng"}, {"letter": "D", "text": "Càng nhiều dữ liệu rác thì mô hình học càng nhanh"}], "answer": "B", "answerText": "Nếu dữ liệu đầu vào là \"rác\" (sai lệch, nhiễu, thiếu sót), kết quả đầu ra của mô hình AI/ML cũng sẽ là \"rác\" (dự đoán sai hoàn toàn)", "explanation": "Bài giảng nhấn mạnh tầm quan trọng của chất lượng dữ liệu: Mô hình ML học trực tiếp từ dữ liệu. Dữ liệu đầu vào sai (Garbage in) chắc chắn dẫn đến quyết định sai (Garbage out). 🟡 PHẦN 2: MỨC ĐỘ THÔNG HIỂU (15 CÂU - CĐR 2.1) Mục tiêu: Đánh giá khả năng phân tích case study, giải thích các thuật toán dự báo và đánh giá hậu quả của dữ liệu sai lệch.", "level": "Nhận biết"}, {"num": 16, "question": "Bài học đắt giá nhất từ Case Study \"New Coke\" năm 1985 của Coca-Cola khi nghiên cứu thị trường là gì?", "options": [{"letter": "A", "text": "Thử nghiệm vị (taste test) 200.000 người bị sai công thức"}, {"letter": "B", "text": "Dữ liệu khảo sát vị giác trong 1 khoảnh khắc không đại diện cho trải nghiệm dài hạn, và thương hiệu đã bỏ qua yếu tố cảm xúc, thói quen và sự trung thành thương hiệu của khách hàng"}, {"letter": "C", "text": "Coca-Cola không đủ tiền chạy quảng cáo"}, {"letter": "D", "text": "New Coke có giá bán quá đắt so với Coke truyền thống"}], "answer": "B", "answerText": "Dữ liệu khảo sát vị giác trong 1 khoảnh khắc không đại diện cho trải nghiệm dài hạn, và thương hiệu đã bỏ qua yếu tố cảm xúc, thói quen và sự trung thành thương hiệu của khách hàng", "explanation": "Trích Case Study New Coke trong bài giảng: Khảo sát vị mù (blind taste test) cho thấy người dùng thích vị ngọt của New Coke hơn, nhưng khi mở bán thì thất bại thảm hại vì dữ liệu khảo sát đã bỏ qua yếu tố cảm xúc gắn kết với thương hiệu truyền thống.", "level": "Thông hiểu"}, {"num": 17, "question": "Trường hợp doanh nghiệp gửi email tiếp thị chào mua \"Nhà ở cao cấp 10 tỷ\" cho sinh viên chưa có thu nhập là minh chứng cho hậu quả của loại dữ liệu nào?", "options": [{"letter": "A", "text": "Dữ liệu lỗi thời"}, {"letter": "B", "text": "Dữ liệu thiếu tính chính xác / Nhắm sai tệp do Dữ liệu phân đoạn kém (Veracity thấp)"}, {"letter": "C", "text": "Dữ liệu có cấu trúc"}, {"letter": "D", "text": "Dữ liệu mã nguồn mở"}], "answer": "B", "answerText": "Dữ liệu thiếu tính chính xác / Nhắm sai tệp do Dữ liệu phân đoạn kém (Veracity thấp)", "explanation": "Khi dữ liệu không được làm sạch hoặc phân đoạn sai (Veracity kém), doanh nghiệp sẽ đưa ra thông điệp sai đối tượng, gây lãng phí chi phí và phiền hà cho người nhận.", "level": "Thông hiểu"}, {"num": 18, "question": "Công cụ AVA (Aesthetic Visual Analysis) của Netflix ứng dụng AI/ML vào công việc gì trong trải nghiệm người dùng?", "options": [{"letter": "A", "text": "Tự động viết kịch bản phim"}, {"letter": "B", "text": "Phân tích từng khung ảnh trong video để tự động chọn và tạo ra hình thu nhỏ (Thumbnail/Artwork) cá nhân hóa phù hợp nhất với sở thích riêng của từng người xem"}, {"letter": "C", "text": "Tự động lồng tiếng phim sang 100 ngôn ngữ"}, {"letter": "D", "text": "Tính tiền đăng ký hàng tháng của người dùng"}], "answer": "B", "answerText": "Phân tích từng khung ảnh trong video để tự động chọn và tạo ra hình thu nhỏ (Thumbnail/Artwork) cá nhân hóa phù hợp nhất với sở thích riêng của từng người xem", "explanation": "Slide Case Study Netflix trích dẫn công cụ AVA: AI phân tích hàng ngàn khung hình phim để hiển thị hình thu nhỏ (thumbnail) khớp với gu của từng người dùng (ví dụ: người thích phim tình cảm sẽ thấy ảnh cặp đôi, người thích hành động sẽ thấy cảnh rượt đuổi).", "level": "Thông hiểu"}, {"num": 19, "question": "Phân tích sự khác biệt giữa dữ liệu có cấu trúc (Structured Data) và dữ liệu phi cấu trúc (Unstructured Data)?", "options": [{"letter": "A", "text": "Dữ liệu có cấu trúc là video; dữ liệu phi cấu trúc là bảng Excel"}, {"letter": "B", "text": "Dữ liệu có cấu trúc được tổ chức rõ ràng theo hàng/cột (bảng SQL, CSV); dữ liệu phi cấu trúc không có định dạng cố định (văn bản tự do, hình ảnh, audio, bài viết mạng xã hội)"}, {"letter": "C", "text": "Dữ liệu có cấu trúc luôn đúng; dữ liệu phi cấu trúc luôn sai"}, {"letter": "D", "text": "Cả hai dạng dữ liệu này đều không lưu trữ được"}], "answer": "B", "answerText": "Dữ liệu có cấu trúc được tổ chức rõ ràng theo hàng/cột (bảng SQL, CSV); dữ liệu phi cấu trúc không có định dạng cố định (văn bản tự do, hình ảnh, audio, bài viết mạng xã hội)", "explanation": "Bài giảng phân loại: Structured data nằm trong các bảng cơ sở dữ liệu quan hệ (dễ phân tích); Unstructured data chiếm 80% Big Data (video, ảnh, voice, bài viết social) đòi hỏi AI/ML để bóc tách.", "level": "Thông hiểu"}, {"num": 20, "question": "Tại sao công đoạn \"Preprocessing\" (Tiền xử lý & Làm sạch dữ liệu) lại chiếm tới 70-80% thời gian của một dự án Machine Learning?", "options": [{"letter": "A", "text": "Vì lập trình viên muốn kéo dài thời gian dự án"}, {"letter": "B", "text": "Vì dữ liệu thực tế luôn chứa rác (trùng lặp, thiếu giá trị, lỗi định dạng, nhiễu); cần phải xử lý chuẩn hóa thì mô hình mới học chính xác"}, {"letter": "C", "text": "Vì các phần mềm làm sạch dữ liệu rất chậm"}, {"letter": "D", "text": "Vì bước này không thể thực hiện bằng máy tính"}], "answer": "B", "answerText": "Vì dữ liệu thực tế luôn chứa rác (trùng lặp, thiếu giá trị, lỗi định dạng, nhiễu); chuẩn hóa dữ liệu là bắt buộc để mô hình học chính xác", "explanation": "Slide quy trình ML giải thích: Dữ liệu thô trong thực tế rất \"bẩn\" (Dirty data). Tiền xử lý (xóa dữ liệu ảo, điền giá trị thiếu, chuẩn hóa định dạng) quyết định 80% sự thành bại của mô hình.", "level": "Thông hiểu"}, {"num": 21, "question": "Mô hình dự đoán \"Next Best Action\" (Hành động tối ưu tiếp theo) ứng dụng AI trong Marketing nhằm mục đích gì?", "options": [{"letter": "A", "text": "Dự đoán chính xác thời tiết ngày mai"}, {"letter": "B", "text": "Gợi ý cho Marketer hoặc tự động kích hoạt kênh giao tiếp/thông điệp/ưu đãi tối ưu nhất tiếp theo cho từng khách hàng cụ thể tại đúng thời điểm"}, {"letter": "C", "text": "Tự động tính tiền lương cho nhân viên"}, {"letter": "D", "text": "Báo cáo số lượng tồn kho trong siêu thị"}], "answer": "B", "answerText": "Gợi ý cho Marketer hoặc tự động kích hoạt kênh giao tiếp/thông điệp/ưu đãi tối ưu nhất tiếp theo cho từng khách hàng cụ thể tại đúng thời điểm", "explanation": "Next Best Action sử dụng ML phân tích hành trình quá khứ để đưa ra quyết định tiếp theo mang lại tỷ lệ chuyển đổi cao nhất cho từng cá nhân.", "level": "Thông hiểu"}, {"num": 22, "question": "Chỉ số CLTV (Customer Lifetime Value) được AI dự đoán dựa trên những yếu tố dữ liệu nào?", "options": [{"letter": "A", "text": "Chiều cao và cân nặng của khách hàng"}, {"letter": "B", "text": "Tần suất mua hàng, giá trị trung bình mỗi đơn, chi phí giữ chân và dự báo thời gian khách hàng tiếp tục gắn bó với thương hiệu"}, {"letter": "C", "text": "Số lượng bạn bè trên Facebook của khách hàng"}, {"letter": "D", "text": "Tốc độ gõ bàn phím của khách hàng"}], "answer": "B", "answerText": "Tần suất mua hàng, giá trị trung bình mỗi đơn, chi phí giữ chân và dự báo thời gian khách hàng tiếp tục gắn bó với thương hiệu", "explanation": "AI dự đoán CLTV bằng cách tổng hợp lịch sử giao dịch (AOV, Recency, Frequency) và hành vi tương tác để ước tính tổng lợi nhuận khách hàng sẽ mang lại trong suốt đời họ.", "level": "Thông hiểu"}, {"num": 23, "question": "Việc các trình duyệt (Chrome, Safari) dần loại bỏ Cookie từ bên thứ ba (Third-party Cookies) đặt ra thách thức lớn nào cho ngành Digital Marketing?", "options": [{"letter": "A", "text": "Không thể gửi email cho khách hàng nữa"}, {"letter": "B", "text": "Giảm khả năng theo dõi hành vi xuyên trang để nhắm mục tiêu quảng cáo bám đuổi (Retargeting), buộc doanh nghiệp phải chuyển sang tập trung thu thập First-Party Data"}, {"letter": "C", "text": "Doanh nghiệp bắt buộc phải đóng cửa website"}, {"letter": "D", "text": "Chi phí mua máy tính tăng cao"}], "answer": "B", "answerText": "Giảm khả năng theo dõi hành vi xuyên trang để nhắm mục tiêu quảng cáo bám đuổi (Retargeting), buộc doanh nghiệp phải chuyển sang tập trung thu thập First-Party Data", "explanation": "Thách thức Cookieless Future được slide thảo luận: Việc mất Third-party Cookie khiến việc theo dõi quảng cáo AdTech khó khăn hơn, thúc đẩy doanh nghiệp đầu tư thu thập First-Party Data qua CRM và Big Data nội bộ.", "level": "Thông hiểu"}, {"num": 24, "question": "Công nghệ \"Social Listening\" (Lắng nghe mạng xã hội) ứng dụng AI/NLP để làm gì trong quản trị thương hiệu?", "options": [{"letter": "A", "text": "Tự động like tất cả các bài viết trên Facebook"}, {"letter": "B", "text": "Thu thập và phân tích hàng triệu thảo luận công khai trên MXH để đo lường chỉ số cảm xúc (Sentiment Index), phát hiện khủng hoảng truyền thông và bóc tách insight"}, {"letter": "C", "text": "Tự động nhắn tin rác cho người dùng mạng xã hội"}, {"letter": "D", "text": "Xóa các bài viết của đối thủ cạnh tranh"}], "answer": "B", "answerText": "Thu thập và phân tích hàng triệu thảo luận công khai trên MXH để đo lường chỉ số cảm xúc (Sentiment Index), phát hiện khủng hoảng truyền thông và bóc tách insight", "explanation": "Social Listening dùng AI quét dữ liệu phi cấu trúc trên MXH (bình luận, bài đăng) để phân tích sắc thái cảm xúc (Tích cực, Tiêu cực, Trung tính) giúp quản trị uy tín thương hiệu.", "level": "Thông hiểu"}, {"num": 25, "question": "Đâu là ví dụ điển hình về việc ứng dụng Big Data để \"Định giá linh hoạt\" (Dynamic Pricing)?", "options": [{"letter": "A", "text": "Cửa hàng tạp hóa giữ nguyên 1 mức giá bán bánh mì suốt 10 năm"}, {"letter": "B", "text": "Hãng xe công nghệ (Grab, Uber) tự động điều chỉnh giá cước tăng lên vào giờ cao điểm hoặc khi trời mưa dựa trên phân tích thời gian thực về nguồn cung tài xế và cầu của khách"}, {"letter": "C", "text": "Nhà nước niêm yết giá xăng dầu"}, {"letter": "D", "text": "Doanh nghiệp tặng miễn phí sản phẩm"}], "answer": "B", "answerText": "Hãng xe công nghệ (Grab, Uber) tự động điều chỉnh giá cước tăng lên vào giờ cao điểm hoặc khi trời mưa dựa trên phân tích thời gian thực về nguồn cung tài xế và cầu của khách", "explanation": "Dynamic Pricing dựa trên Big Data phân tích các biến số real-time (tốc độ, thời tiết, vị trí, nhu cầu) để tối ưu hóa giá bán theo từng giây.", "level": "Thông hiểu"}, {"num": 26, "question": "Tại sao mô hình Churn Prediction (Dự báo khách hàng rời bỏ) lại quan trọng đối với các dịch vụ đăng ký trả phí định kỳ (SaaS, Netflix, Telecom)?", "options": [{"letter": "A", "text": "Vì giúp doanh nghiệp sa thải bớt nhân viên hỗ trợ"}, {"letter": "B", "text": "Phát hiện sớm các dấu hiệu giảm tương tác của khách hàng trước khi họ hủy gói, giúp doanh nghiệp chủ động đưa ra ưu đãi giữ chân kịp thời"}, {"letter": "C", "text": "Để tự động khóa tài khoản khách hàng trước"}, {"letter": "D", "text": "Để công khai danh tính khách hàng rời bỏ lên mạng"}], "answer": "B", "answerText": "Phát hiện sớm các dấu hiệu giảm tương tác của khách hàng trước khi họ hủy gói, giúp doanh nghiệp chủ động đưa ra ưu đãi giữ chân kịp thời", "explanation": "AI phân tích dấu hiệu giảm tần suất sử dụng để cảnh báo nguy cơ rời bỏ (Churn Risk), cho phép tiếp thị kích hoạt kịch bản giữ chân với chi phí rẻ hơn tìm khách mới.", "level": "Thông hiểu"}, {"num": 27, "question": "Trong bài giảng, sự khác biệt giữa \"Dữ liệu thiếu\" (Incomplete Data) và \"Dữ liệu không nhất quán\" (Inconsistent Data) là gì?", "options": [{"letter": "A", "text": "Dữ liệu thiếu là dữ liệu sai; dữ liệu không nhất quán là dữ liệu đúng"}, {"letter": "B", "text": "Dữ liệu thiếu là bị khuyết các trường thông tin quan trọng (thiếu SĐT, Email); Dữ liệu không nhất quán là cùng 1 khách hàng nhưng thông tin ở các hệ thống khác nhau lại mâu thuẫn nhau"}, {"letter": "C", "text": "Hai khái niệm này hoàn toàn giống nhau"}, {"letter": "D", "text": "Dữ liệu không nhất quán chỉ xảy ra ở dạng hình ảnh"}], "answer": "B", "answerText": "Dữ liệu thiếu là bị khuyết các trường thông tin quan trọng (thiếu SĐT, Email); Dữ liệu không nhất quán là cùng 1 khách hàng nhưng thông tin ở các hệ thống khác nhau lại mâu thuẫn nhau", "explanation": "Slide quản trị chất lượng dữ liệu phân biệt: Incomplete Data bị khuyết ô thông tin; Inconsistent Data bị chênh lệch/mâu thuẫn giữa các cơ sở dữ liệu (ví dụ: ngày sinh trên App khác trên CRM).", "level": "Thông hiểu"}, {"num": 28, "question": "Việc Spotify tạo ra danh sách phát \"Discover Weekly\" hàng tuần cho từng người dùng là sự kết hợp của những yếu tố nào?", "options": [{"letter": "A", "text": "Khảo sát ý kiến trực tiếp của chuyên gia âm nhạc"}, {"letter": "B", "text": "Thuật toán Machine Learning phân tích lịch sử nghe nhạc của cá nhân kết hợp với gu nghe nhạc của những người dùng khác có sở thích tương đồng (Collaborative Filtering)"}, {"letter": "C", "text": "Chọn ngẫu nhiên bài hát trên hệ thống"}, {"letter": "D", "text": "Phát lại toàn bộ bài hát phổ biến nhất toàn cầu"}], "answer": "B", "answerText": "Thuật toán Machine Learning phân tích lịch sử nghe nhạc của cá nhân kết hợp với gu nghe nhạc của những người dùng khác có sở thích tương đồng (Collaborative Filtering)", "explanation": "Case study Spotify trong bài giảng chứng minh việc phối hợp Lọc cộng tác (Collaborative Filtering) và AI để đưa ra danh sách đề xuất âm nhạc chuẩn xác cho từng cá nhân.", "level": "Thông hiểu"}, {"num": 29, "question": "Quy định pháp lý bảo vệ dữ liệu cá nhân như GDPR (Châu Âu) hoặc Nghị định 13/2023/NĐ-CP (Việt Nam) yêu cầu doanh nghiệp phải làm gì khi thu thập Big Data?", "options": [{"letter": "A", "text": "Cấm doanh nghiệp lưu trữ mọi loại dữ liệu"}, {"letter": "B", "text": "Phải có sự đồng ý rõ ràng của người dùng (Consent), đảm bảo minh bạch mục đích sử dụng và quyền xóa dữ liệu cá nhân"}, {"letter": "C", "text": "Bắt buộc chuyển toàn bộ dữ liệu cho đối thủ cạnh tranh"}, {"letter": "D", "text": "Cho phép tự do bán dữ liệu cho bất kỳ ai"}], "answer": "B", "answerText": "Phải có sự đồng ý rõ ràng của người dùng (Consent), đảm bảo minh bạch mục đích sử dụng và quyền xóa dữ liệu cá nhân", "explanation": "Khía cạnh pháp lý bảo mật dữ liệu nhấn mạnh tính tuân thủ: Doanh nghiệp phải thu thập Consent rõ ràng, cam kết bảo mật và minh bạch quyền dữ liệu người dùng.", "level": "Thông hiểu"}, {"num": 30, "question": "Mục tiêu cao nhất của việc ứng dụng Big Data & AI/ML trong Marketing là gì?", "options": [{"letter": "A", "text": "Thay thế hoàn toàn con người và đóng cửa các văn phòng"}, {"letter": "B", "text": "Chuyển đổi từ tiếp thị dựa trên \"phán đoán cảm tính\" sang tiếp thị dựa trên \"dữ liệu thực tế và trí tuệ dự báo\" để tối ưu hóa quyết định kinh doanh"}, {"letter": "C", "text": "Thu thập dữ liệu cá nhân để bán kiếm lời"}, {"letter": "D", "text": "Tăng số lượng tin nhắn rác gửi ra thị trường"}], "answer": "B", "answerText": "Chuyển đổi từ tiếp thị dựa trên \"phán đoán cảm tính\" sang tiếp thị dựa trên \"dữ liệu thực tế và trí tuệ dự báo\" để tối ưu hóa quyết định kinh doanh", "explanation": "Kết luận Chương 4 khẳng định: Big Data & AI/ML giúp doanh nghiệp chuyển đổi từ Data-informed / Intuition-based sang Data-driven decision making, nâng cao lợi thế cạnh tranh. 🟠 PHẦN 3: MỨC ĐỘ VẬN DỤNG (10 CÂU - CĐR 2.1 & 2.2) Mục tiêu: Đánh giá khả năng xử lý bài toán dữ liệu bẩn, ứng dụng thuật toán dự báo và lựa chọn giải pháp Big Data thực tế.", "level": "Thông hiểu"}, {"num": 31, "question": "Một sàn thương mại điện tử thu thập được 10 triệu lượt click mỗi ngày. Tuy nhiên, 30% dữ liệu bị khuyết thông tin ID người dùng và trùng lặp đơn hàng. Bộ phận khoa học dữ liệu cần làm gì ở bước Preprocessing?", "options": [{"letter": "A", "text": "Bỏ qua và đưa thẳng vào huấn luyện Machine Learning"}, {"letter": "B", "text": "Tiến hành dọn dẹp dữ liệu (Data Cleaning): Loại bỏ bản ghi trùng lặp, xử lý các ô dữ liệu bị thiếu (Imputation) và chuẩn hóa định dạng"}, {"letter": "C", "text": "Xóa toàn bộ 10 triệu dữ liệu đó"}, {"letter": "D", "text": "Tự điền ngẫu nhiên tên người dùng vào các ô trống"}], "answer": "B", "answerText": "Tiến hành dọn dẹp dữ liệu (Data Cleaning): Loại bỏ bản ghi trùng lặp, xử lý các ô dữ liệu bị thiếu (Imputation) và chuẩn hóa định dạng", "explanation": "Áp dụng bước Preprocessing trong quy trình ML: Bắt buộc phải xử lý loại bỏ trùng lặp và xử lý khuyết thiếu dữ liệu trước khi đưa vào mô hình học tập.", "level": "Vận dụng"}, {"num": 32, "question": "Bạn làm quản lý marketing cho ứng dụng giao đồ ăn. Bạn muốn AI dự đoán khách hàng nào có nguy cơ ngưng sử dụng app trong 7 ngày tới. Dữ liệu đầu vào nào là quan trọng nhất cần đưa vào mô hình ML?", "options": [{"letter": "A", "text": "Màu sắc trang phục yêu thích của khách hàng"}, {"letter": "B", "text": "Tần suất đặt hàng giảm đột ngột, số lần mở app giảm, và số lần gặp sự cố đơn hàng trong 30 ngày qua"}, {"letter": "C", "text": "Điểm thi đại học của khách hàng"}, {"letter": "D", "text": "Tên hãng điện thoại khách hàng đang dùng"}], "answer": "B", "answerText": "Tần suất đặt hàng giảm đột ngột, số lần mở app giảm, và số lần gặp sự cố đơn hàng trong 30 ngày qua", "explanation": "Mô hình Churn Prediction đòi hỏi các biến số đầu vào phản ánh sự sụt giảm tương tác hành vi và trải nghiệm tiêu cực thực tế của người dùng.", "level": "Vận dụng"}, {"num": 33, "question": "Nhãn hàng nước giải khát X chạy thử nghiệm quảng cáo A/B Testing trên Facebook cho 2 hình ảnh: (A) Hình lon nước đá lạnh; (B) Hình người mẫu đang uống nước. Sau 1 giờ, hệ thống AI tự động chuyển 80% ngân sách sang mẫu (A) vì CTR cao gấp 3 lần. Đây là ứng dụng đặc trưng nào của AI?", "options": [{"letter": "A", "text": "Tự động hóa sản xuất vỏ lon"}, {"letter": "B", "text": "Tối ưu hóa phân bổ ngân sách quảng cáo theo thời gian thực (Real-time Budget Optimization)"}, {"letter": "C", "text": "Khảo sát thị trường truyền thống"}, {"letter": "D", "text": "Phân tích tài chính kế toán"}], "answer": "B", "answerText": "Tối ưu hóa phân bổ ngân sách quảng cáo theo thời gian thực (Real-time Budget Optimization)", "explanation": "AI Ad Optimization phân tích chỉ số hiệu năng CTR real-time và tự động dồn ngân sách vào mẫu quảng cáo hoạt động tốt hơn để tối ưu chi phí.", "level": "Vận dụng"}, {"num": 34, "question": "Để xây dựng hệ thống Đề xuất sản phẩm (Recommendation System) cho một trang web sách trực tuyến hoàn toàn mới (chưa có lịch sử giao dịch), giải pháp xử lý rào cản \"Cold Start\" nào là phù hợp nhất?", "options": [{"letter": "A", "text": "Không hiển thị bất kỳ cuốn sách nào"}, {"letter": "B", "text": "Gợi ý các cuốn sách bán chạy nhất (Best-sellers) hoặc yêu cầu người dùng mới chọn 3 thể loại sách yêu thích ngay khi đăng ký"}, {"letter": "C", "text": "Ép người dùng mua 1 cuốn sách ngẫu nhiên"}, {"letter": "D", "text": "Chỉ hiển thị sách có giá đắt nhất"}], "answer": "B", "answerText": "Gợi ý các cuốn sách bán chạy nhất (Best-sellers) hoặc yêu cầu người dùng mới chọn 3 thể loại sách yêu thích ngay khi đăng ký", "explanation": "Bài toán Cold Start trong Recommendation System được giải quyết bằng cách lấy dữ liệu sở thích ban đầu do người dùng tự chọn hoặc dùng dữ liệu phổ biến toàn hệ thống (Top Trending/Best-sellers).", "level": "Vận dụng"}, {"num": 35, "question": "Một chuỗi siêu thị phát hiện ra rằng dữ liệu doanh số từ máy POS cửa hàng khác biệt hoàn toàn so với dữ liệu trên ứng dụng mua hàng online. Đây là sự vi phạm đặc trưng nào trong Big Data và cần khắc phục ra sao?", "options": [{"letter": "A", "text": "Vi phạm Volume; khắc phục bằng cách tăng dung lượng ổ cứng"}, {"letter": "B", "text": "Vi phạm Veracity (Dữ liệu không nhất quán); khắc phục bằng cách xây dựng kho dữ liệu tập trung (Data Warehouse) đồng bộ real-time"}, {"letter": "C", "text": "Vi phạm Velocity; khắc phục bằng cách tăng tốc độ mạng"}, {"letter": "D", "text": "Không cần khắc phục vì không ảnh hưởng đến doanh thu"}], "answer": "B", "answerText": "Vi phạm Veracity (Dữ liệu không nhất quán); khắc phục bằng cách xây dựng kho dữ liệu tập trung (Data Warehouse) đồng bộ real-time", "explanation": "Dữ liệu mâu thuẫn giữa 2 kênh online và offline vi phạm đặc trưng Veracity (Tính nhất quán); giải pháp là hợp nhất dữ liệu vào Data Warehouse / CDP thống nhất.", "level": "Vận dụng"}, {"num": 36, "question": "Một hãng thời trang muốn dự báo số lượng áo sơ mi cần sản xuất cho mùa hè năm sau dựa trên Big Data. Các nguồn dữ liệu nào nên được đưa vào mô hình dự báo?", "options": [{"letter": "A", "text": "Chỉ dựa vào số liệu bán hàng của mùa hè năm trước"}, {"letter": "B", "text": "Lịch sử bán hàng 3 năm gần nhất + Xu hướng tìm kiếm trên Google (Google Trends) + Xu hướng thảo luận thời trang trên TikTok + Dự báo thời tiết"}, {"letter": "C", "text": "Chiều cao trung bình của nhân viên công ty"}, {"letter": "D", "text": "Giá vàng trên thị trường tự do"}], "answer": "B", "answerText": "Lịch sử bán hàng 3 năm gần nhất + Xu hướng tìm kiếm trên Google (Google Trends) + Xu hướng thảo luận thời trang trên TikTok + Dự báo thời tiết", "explanation": "Mô hình Demand Forecasting kết hợp dữ liệu giao dịch quá khứ với các dữ liệu Big Data đa dạng bên ngoài (Social Trends, Search Intent, Weather Data) để tăng độ chính xác.", "level": "Vận dụng"}, {"num": 37, "question": "Bạn phụ trách chiến dịch Email Marketing. Qua phân tích Big Data về thời điểm mở email của 50.000 khách hàng, AI phát hiện ra nhóm nhân viên văn phòng hay mở email vào 8h sáng, còn nhóm sinh viên hay mở vào 22h đêm. Bạn nên vận hành kịch bản gửi email như thế nào?", "options": [{"letter": "A", "text": "Gửi đồng loạt cho tất cả khách hàng vào lúc 12h trưa"}, {"letter": "B", "text": "Cấu hình tính năng \"Send Time Optimization\" của phần mềm MA để AI tự động gửi email cho từng người đúng khung giờ họ có xác suất mở cao nhất"}, {"letter": "C", "text": "Bắt khách hàng phải tự cài báo thức mở email"}, {"letter": "D", "text": "Ngừng gửi email cho nhóm sinh viên"}], "answer": "B", "answerText": "Cấu hình tính năng \"Send Time Optimization\" của phần mềm MA để AI tự động gửi email cho từng người đúng khung giờ họ có xác suất mở cao nhất", "explanation": "AI Send-Time Optimization cá nhân hóa thời điểm gửi thư dựa trên lịch sử tương tác quá khứ của từng cá nhân, tối ưu hóa tỷ lệ mở.", "level": "Vận dụng"}, {"num": 38, "question": "Một ứng dụng ngân hàng số muốn ngăn chặn hành vi gian lận thẻ tín dụng. Thuật toán Machine Learning sẽ cảnh báo giao dịch bất thường dựa trên dấu hiệu nào?", "options": [{"letter": "A", "text": "Giao dịch thực hiện vào ban ngày"}, {"letter": "B", "text": "Giao dịch phát sinh tại một quốc gia xa lạ có vị trí địa lý khác biệt chỉ 5 phút sau một giao dịch tại Việt Nam, hoặc giá trị gấp 100 lần bình thường"}, {"letter": "C", "text": "Khách hàng nạp tiền điện thoại 50.000 VNĐ"}, {"letter": "D", "text": "Khách hàng đổi mật khẩu ứng dụng định kỳ"}], "answer": "B", "answerText": "Giao dịch phát sinh tại một quốc gia xa lạ có vị trí địa lý khác biệt chỉ 5 phút sau một giao dịch tại Việt Nam, hoặc giá trị gấp 100 lần bình thường", "explanation": "Thuật toán Anomaly Detection (Phát hiện bất thường) của ML so sánh giao dịch thời gian thực với mẫu hành vi chuẩn của người dùng để ngăn chặn gian lận ngay lập tức.", "level": "Vận dụng"}, {"num": 39, "question": "Để đo lường mức độ hài lòng của khách hàng sau khi xem bộ phim mới trên nền tảng xem phim trực tuyến mà không bắt họ điền bảng khảo sát dài, doanh nghiệp nên thu thập dữ liệu nào?", "options": [{"letter": "A", "text": "Số lượng máy tính đang bật trong thành phố"}, {"letter": "B", "text": "Thời lượng xem (xem hết phim hay tắt giữa chừng), hành vi không bấm dừng, và hành vi chia sẻ link phim lên MXH"}, {"letter": "C", "text": "Tốc độ quay của quạt tản nhiệt máy tính"}, {"letter": "D", "text": "Số lượng tài khoản ngân hàng của người xem"}], "answer": "B", "answerText": "Thời lượng xem (xem hết phim hay tắt giữa chừng), hành vi không bấm dừng, và hành vi chia sẻ link phim lên MXH", "explanation": "Dữ liệu tương tác tự nhiên (Completion rate, Drop-off rate, Share) phản ánh độ hài lòng chuẩn xác hơn khảo sát thủ công.", "level": "Vận dụng"}, {"num": 40, "question": "Khi một trang tin tức sử dụng AI để tự động tạo ra hàng nghìn bài báo tóm tắt tài chính từ dữ liệu chứng khoán mỗi ngày, khâu kiểm soát chất lượng nào bắt buộc phải có?", "options": [{"letter": "A", "text": "Tự động xuất bản ngay lên trang chủ"}, {"letter": "B", "text": "Kiểm tra định kỳ của biên tập viên con người đối với số liệu tài chính để tránh lỗi \"AI ảo tưởng\" (Hallucination)"}, {"letter": "C", "text": "Tắt kết nối Internet của máy chủ"}, {"letter": "D", "text": "Cấm độc giả đọc các bài báo đó"}], "answer": "B", "answerText": "Kiểm tra định kỳ của biên tập viên con người đối với số liệu tài chính để tránh lỗi \"AI ảo tưởng\" (Hallucination)", "explanation": "Tương tự như kiểm soát nội dung AI trong bài giảng, dữ liệu tự động hóa phải có quy trình kiểm duyệt của con người để đảm bảo tính Veracity tuyệt đối. 🔴 PHẦN 4: MỨC ĐỘ VẬN DỤNG CAO (10 CÂU - CĐR 2.2 & 4.1) Mục tiêu: Đánh giá khả năng phân tích case study chuyên sâu (Amazon, Netflix, Spotify), giải quyết thách thức quản trị dữ liệu và đề xuất chiến lược AI/Big Data toàn diện.", "level": "Vận dụng"}, {"num": 41, "question": "Phân tích Case Study Amazon: Chiến lược \"Anticipatory Shipping\" (Giao hàng dự đoán) dựa trên Big Data & AI của Amazon hoạt động theo cơ chế nào?", "options": [{"letter": "A", "text": "Giao ngẫu nhiên hàng hóa đến nhà khách hàng dù họ chưa đặt"}, {"letter": "B", "text": "Thuật toán AI phân tích lịch sử tìm kiếm, danh sách yêu thích và chu kỳ mua để tiến hành luân chuyển hàng hóa về kho bãi gần nhất trước khi khách bấm nút mua"}, {"letter": "C", "text": "Yêu cầu khách hàng đặt cọc trước 1 năm"}, {"letter": "D", "text": "Sử dụng máy bay không người lái giao hàng từ nước ngoài"}], "answer": "B", "answerText": "Thuật toán AI phân tích lịch sử tìm kiếm, danh sách yêu thích và chu kỳ mua để tiến hành luân chuyển hàng hóa về kho bãi gần nhất trước khi khách bấm nút mua", "explanation": "Case Study Amazon trong slide minh họa đỉnh cao của Predictive Analytics: Dự đoán sản phẩm khách sẽ mua để chuyển sẵn hàng về kho địa phương, rút ngắn thời gian giao hàng.", "level": "Vận dụng cao"}, {"num": 42, "question": "Trong Case Study Netflix, việc hệ thống đề xuất đóng góp tới hơn 80% tổng thời lượng xem phim trên nền tảng này đã mang lại giá trị kinh tế chiến lược nào?", "options": [{"letter": "A", "text": "Giảm chi phí sản xuất phim xuống bằng 0"}, {"letter": "B", "text": "Giảm tỷ lệ hủy đăng ký (Churn Rate), tối ưu hóa chi phí bản quyền phim và gia tăng mạnh mẽ giá trị trọn đời khách hàng (CLTV)"}, {"letter": "C", "text": "Tăng giá vé xem phim tại các rạp truyền thống"}, {"letter": "D", "text": "Cho phép người dùng xem phim không cần trả phí"}], "answer": "B", "answerText": "Giảm tỷ lệ hủy đăng ký (Churn Rate), tối ưu hóa chi phí bản quyền phim và gia tăng mạnh mẽ giá trị trọn đời khách hàng (CLTV)", "explanation": "Bài giảng nhấn mạnh giá trị của AI Recommendation Netflix: Giữ chân người dùng ở lại ứng dụng lâu hơn, giảm tỷ lệ rời bỏ và nâng cao hiệu quả khai thác kho phim.", "level": "Vận dụng cao"}, {"num": 43, "question": "Đánh giá rủi ro về mặt \"Thành kiến dữ liệu\" (Data Bias) trong các mô hình Machine Learning tuyển dụng hoặc duyệt tín dụng tiếp thị?", "options": [{"letter": "A", "text": "Mô hình ML luôn đảm bảo công bằng 100%"}, {"letter": "B", "text": "Nếu dữ liệu quá khứ chứa sự thiên vị/định kiến của con người (về giới tính, chủng tộc, vùng miền), thuật toán ML sẽ \"học\" lại định kiến đó và đưa ra quyết định phân biệt đối xử ở quy mô lớn hơn"}, {"letter": "C", "text": "Dữ liệu thiên vị sẽ làm máy tính hỏng màn hình"}, {"letter": "D", "text": "Machine Learning tự động xóa bỏ mọi thiên vị mà không cần con người xử lý"}], "answer": "B", "answerText": "Nếu dữ liệu quá khứ chứa sự thiên vị/định kiến của con người (về giới tính, chủng tộc, vùng miền), thuật toán ML sẽ \"học\" lại định kiến đó và đưa ra quyết định phân biệt đối xử ở quy mô lớn hơn", "explanation": "Thách thức đạo đức AI (AI Ethics): Máy học từ dữ liệu lịch sử. Dữ liệu lịch sử mang thành kiến thì mô hình sẽ đưa ra các quyết định lệch lạc mang tính hệ thống.", "level": "Vận dụng cao"}, {"num": 44, "question": "Giả sử bạn là Giám đốc Dữ liệu (CDO), khi doanh nghiệp gặp tình trạng \"Data Silos\" (dữ liệu nằm phân mảnh ở các phòng ban Kế toán, Marketing, Sales, CSKH và không chia sẻ với nhau), bạn đưa ra kiến trúc hạ tầng nào để giải quyết?", "options": [{"letter": "A", "text": "Bắt các phòng ban tự quản lý dữ liệu trên file Excel cá nhân"}, {"letter": "B", "text": "Xây dựng Data Lake / Data Warehouse tập trung để kết nối và đổ toàn bộ dữ liệu thô và dữ liệu đã xử lý về một \"hồ dữ liệu\" thống nhất cho toàn công ty khai thác"}, {"letter": "C", "text": "Xóa bỏ dữ liệu của phòng Kế toán"}, {"letter": "D", "text": "Cấm các phòng ban sử dụng máy tính"}], "answer": "B", "answerText": "Xây dựng Data Lake / Data Warehouse tập trung để kết nối và đổ toàn bộ dữ liệu thô và dữ liệu đã xử lý về một \"hồ dữ liệu\" thống nhất cho toàn công ty khai thác", "explanation": "Xóa bỏ Data Silos bằng kiến trúc quản trị dữ liệu hiện đại: Triển khai Data Lake / Data Warehouse hợp nhất dữ liệu đa nguồn cho toàn bộ tổ chức.", "level": "Vận dụng cao"}, {"num": 45, "question": "Tại sao việc chỉ tập trung vào Big Data dạng \"Volume\" (kích thước lớn) mà bỏ qua \"Veracity\" (độ tin cậy) lại khiến các chiến dịch cá nhân hóa Marketing thất bại thảm hại?", "options": [{"letter": "A", "text": "Vì dung lượng ổ cứng sẽ bị đầy"}, {"letter": "B", "text": "Thà có ít dữ liệu nhưng \"sạch và chuẩn\" còn hơn có hàng triệu dữ liệu \"rác/lỗi\"; dữ liệu sai sẽ khiến hệ thống AI cá nhân hóa sai thông điệp hàng loạt, làm khách hàng tức giận"}, {"letter": "C", "text": "Vì các nền tảng quảng cáo cấm dùng dữ liệu lớn"}, {"letter": "D", "text": "Vì Veracity chỉ dành cho các công ty phần mềm"}], "answer": "B", "answerText": "Thà có ít dữ liệu nhưng \"sạch và chuẩn\" còn hơn có hàng triệu dữ liệu \"rác/lỗi\"; dữ liệu sai sẽ khiến hệ thống AI cá nhân hóa sai thông điệp hàng loạt, làm khách hàng tức giận", "explanation": "Bài giảng chỉ rõ mối quan hệ 4V: Volume lớn mà Veracity kém sẽ làm gia tăng tốc độ sai lầm ở quy mô lớn (\"Garbage in, Garbage out\").", "level": "Vận dụng cao"}, {"num": 46, "question": "Đề xuất chiến lược khai thác Big Data cho một ngân hàng muốn bán chéo (Cross-sell) sản phẩm thẻ tín dụng cho khách hàng vay mua nhà?", "options": [{"letter": "A", "text": "Gửi email quảng cáo thẻ cho toàn bộ 1 triệu khách hàng của ngân hàng"}, {"letter": "B", "text": "Sử dụng ML phân tích dữ liệu giao dịch + lịch sử trả nợ + hành vi trên ứng dụng Mobile Banking để nhận diện tệp khách hàng có điểm uy tín cao và đang có nhu cầu mua sắm nội thất để kích hoạt tư vấn"}, {"letter": "C", "text": "Gọi điện ngẫu nhiên vào ban đêm"}, {"letter": "D", "text": "Ép buộc khách hàng vay mua nhà phải mở thẻ tín dụng mới được giải ngân"}], "answer": "B", "answerText": "Sử dụng ML phân tích dữ liệu giao dịch + lịch sử trả nợ + hành vi trên ứng dụng Mobile Banking để nhận diện tệp khách hàng có điểm uy tín cao và đang có nhu cầu mua sắm nội thất để kích hoạt tư vấn", "explanation": "Ứng dụng Predictive Cross-selling: Kết hợp phân tích điểm uy tín tín dụng và dấu vết nhu cầu mua sắm nội thất để gợi ý mở thẻ đúng thời điểm với tỷ lệ duyệt cao.", "level": "Vận dụng cao"}, {"num": 47, "question": "Nhược điểm lớn nhất của mô hình \"Hộp đen\" (Black Box) trong các thuật toán AI/Machine Learning phức tạp (Deep Learning) khi giải thích kết quả cho Giám đốc điều hành là gì?", "options": [{"letter": "A", "text": "AI chạy quá chậm"}, {"letter": "B", "text": "AI đưa ra kết quả dự báo nhưng con người rất khó giải thích lý do LOGIC cụ thể tại sao thuật toán lại đưa ra quyết định đó (thiếu tính giải thích được - Explainability)"}, {"letter": "C", "text": "AI tốn quá nhiều điện năng"}, {"letter": "D", "text": "AI không thể lưu trữ kết quả"}], "answer": "B", "answerText": "AI đưa ra kết quả dự báo nhưng con người rất khó giải thích lý do LOGIC cụ thể tại sao thuật toán lại đưa ra quyết định đó (thiếu tính giải thích được - Explainability)", "explanation": "Thách thức Explainable AI (XAI): Các mô hình Deep Learning giống như hộp đen, rất khó giải thích quy trình suy luận đằng sau cho cấp quản lý để phê duyệt ngân sách.", "level": "Vận dụng cao"}, {"num": 48, "question": "Để tuân thủ nguyên tắc \"Privacy by Design\" (Bảo mật riêng tư ngay từ khâu thiết kế) trong hệ thống Big Data Marketing, doanh nghiệp cần áp dụng kỹ thuật xử lý dữ liệu nào?", "options": [{"letter": "A", "text": "Công khai toàn bộ cơ sở dữ liệu lên mạng Internet"}, {"letter": "B", "text": "Kỹ thuật ẩn danh hóa dữ liệu (Anonymization & Pseudonymization) — loại bỏ hoặc mã hóa các thông tin định danh cá nhân (PII) trước khi đưa vào phân tích"}, {"letter": "C", "text": "Lưu trữ dữ liệu trên giấy in"}, {"letter": "D", "text": "Không mã hóa dữ liệu khách hàng"}], "answer": "B", "answerText": "Kỹ thuật ẩn danh hóa dữ liệu (Anonymization & Pseudonymization) — loại bỏ hoặc mã hóa các thông tin định danh cá nhân (PII) trước khi đưa vào phân tích", "explanation": "Anonymization giúp bảo vệ thông tin nhận dạng cá nhân (PII) bằng cách mã hóa tên/SĐT trước khi đưa cho các thuật toán AI/ML phân tích, tuân thủ luật bảo mật.", "level": "Vận dụng cao"}, {"num": 49, "question": "Sự kết hợp giữa Big Data, AI và công nghệ IoT (Internet of Things) tạo ra kịch bản Marketing tương lai nào được mô tả trong bài giảng?", "options": [{"letter": "A", "text": "Tủ lạnh thông minh tự phân tích lượng thực phẩm sắp hết và tự động đặt hàng sữa tươi giao tận nhà qua ứng dụng thương mại điện tử"}, {"letter": "B", "text": "Con người không cần phải ăn uống nữa"}, {"letter": "C", "text": "Đồ gia dụng tự động phát quảng cáo trên màn hình ti vi"}, {"letter": "D", "text": "Tất cả các cửa hàng truyền thống bị phá hủy"}], "answer": "A", "answerText": "Tủ lạnh thông minh tự phân tích lượng thực phẩm sắp hết và tự động đặt hàng sữa tươi giao tận nhà qua ứng dụng thương mại điện tử", "explanation": "Ví dụ về ứng dụng AI + Big Data + IoT trong bài giảng: Thiết bị thông minh thu thập dữ liệu tiêu dùng real-time và tự động kích hoạt giao dịch mua sắm bổ sung mà không cần con người thao tác.", "level": "Vận dụng cao"}, {"num": 50, "question": "Đánh giá tổng thể vai trò của Dữ liệu lớn (Big Data) và AI/Machine Learning trong việc định hình lại tương lai của ngành Marketing?", "options": [{"letter": "A", "text": "Chỉ là trào lưu công nghệ ngắn hạn sẽ sớm bị lãng quên"}, {"letter": "B", "text": "Là nguồn \"nhiên liệu\" (Big Data) và \"động cơ\" (AI/ML) cốt lõi giúp doanh nghiệp xây dựng trải nghiệm cá nhân hóa quy mô lớn, tự động hóa thông minh và ra quyết định chiến lược vượt trội"}, {"letter": "C", "text": "Làm cho các hoạt động tiếp thị trở nên đắt đỏ và kém hiệu quả hơn"}, {"letter": "D", "text": "Chỉ có giá trị đối với các tập đoàn công nghệ tại Mỹ"}], "answer": "B", "answerText": "Là nguồn \"nhiên liệu\" (Big Data) và \"động cơ\" (AI/ML) cốt lõi giúp doanh nghiệp xây dựng trải nghiệm cá nhân hóa quy mô lớn, tự động hóa thông minh và ra quyết định chiến lược vượt trội", "explanation": "Bài giảng kết luận: Big Data được ví như \"dầu mỏ mới\" (nhiên liệu) và AI/ML là \"động cơ\" xử lý, cùng nhau tạo nên năng lực cạnh tranh cốt lõi cho mọi doanh nghiệp trong kỷ nguyên số.", "level": "Vận dụng cao"}]}, {"id": 5, "title": "Xu hướng tương lai của Công nghệ Marketing", "theory": ["VR vs AR trong Experiential Marketing:", "VR (Virtual Reality): Mô phỏng môi trường ảo hoàn toàn.", "AR (Augmented Reality): Phủ các yếu tố kỹ thuật số lên thế giới thực.", "Mô hình \"Try Before You Buy\" giúp giảm sự không chắc chắn khi mua sắm online (IKEA Place, Sephora Virtual Artist, Tesla VR).", "Blockchain trong Marketing: Đặc tính phi tập trung, bất biến, minh bạch và bảo mật. Giúp chống gian lận quảng cáo programmatic, minh bạch ngân sách, truy xuất nguồn gốc sản phẩm và token hóa điểm thưởng Loyalty.", "Marketing Tập trung (Centralized Marketing): Dồn nguồn lực vào phân đoạn thị trường chuyên biệt. Ba chiến lược chính: Thâm nhập thị trường (Market Penetration), Phát triển thị trường (Market Development), và Phát triển sản phẩm (Product Development)."], "qa": [{"num": 1, "question": "VR là gì? AR là gì? Phân biệt VR và AR theo các tiêu chí: Môi trường trải nghiệm; Thiết bị; Cách tương tác; Mức độ đắm chìm; Khả năng ứng dụng trong Marketing.", "answer": ["VR (Thực tế ảo): Thay thế hoàn toàn thế giới thực bằng môi trường ảo 3D.", "AR (Thực tế tăng cường): Phủ nội dung ảo lên không gian thực tế.", "Phân biệt:", "Môi trường: VR là hoàn toàn ảo; AR kết hợp ảo và thực.", "Thiết bị: VR dùng kính chuyên dụng (Oculus, HTC Vive); AR dùng Smartphone/máy tính bảng/kính AR.", "Mức độ đắm chìm: VR đắm chìm tuyệt đối (Immersion); AR đắm chìm một phần.", "Ứng dụng: VR dùng cho sự kiện lớn, lái thử xe ảo; AR dùng rộng rãi cho filter MXH, thử đồ online."]}, {"num": 2, "question": "Marketing trải nghiệm là gì? Tại sao VR/AR có thể trở thành công cụ phù hợp cho Experiential Marketing?", "answer": ["Khái niệm: Phương thức tiếp thị tạo cơ hội cho khách hàng \"sống\" và tương tác trực tiếp với thương hiệu thay vì chỉ xem quảng cáo thụ động.", "Lý do phù hợp: VR/AR kích thích đa giác quan, tạo sự bất ngờ, mang lại cảm giác chân thật và thúc đẩy người dùng sáng tạo nội dung chia sẻ (UGC)."]}, {"num": 3, "question": "Trình bày những lợi ích chính của VR/AR trong Marketing: Tăng engagement và immersion; Cá nhân hóa; Tạo kết nối cảm xúc; Vượt qua giới hạn địa lý; Tạo sự khác biệt và lan truyền; Hỗ trợ conversion.", "answer": ["Tăng thời gian tương tác sâu, cho phép tùy chỉnh sản phẩm ảo theo gu cá nhân, cho phép xem trước địa điểm du lịch/bất động sản từ xa, tạo hiệu ứng lan truyền (viral) qua AR filter và thúc đẩy hành động mua sắm nhanh hơn."]}, {"num": 4, "question": "Phân tích cách VR/AR có thể được ứng dụng trong các giai đoạn của customer journey: Awareness -> Consideration -> Conversion -> Retention. Cho một ví dụ ở mỗi giai đoạn.", "answer": ["Awareness: AR Filter trên TikTok/Instagram tạo trào lưu viral.", "Consideration: Tính năng \"Try Before You Buy\" (đặt thử sofa IKEA ảo vào phòng).", "Conversion: Trải nghiệm VR ngồi buồng lái Tesla giúp chốt đơn tại showroom.", "Retention: Hướng dẫn sử dụng/bảo hành sản phẩm bằng tương tác AR 3D sau mua."]}, {"num": 5, "question": "Phân tích ý tưởng \"Try Before You Buy\" bằng AR. Tại sao công nghệ này có thể giúp giảm sự không chắc chắn của khách hàng khi mua hàng online?", "answer": ["Ý tưởng: Cho phép khách hàng ướm thử sản phẩm ảo (quần áo, mỹ phẩm, nội thất) vào bản thân hoặc không gian sống thực tế trước khi trả tiền.", "Giải thích: Giúp xóa bỏ rào cản lo lắng về kích thước, màu sắc không phù hợp, từ đó tăng niềm tin và giảm tỷ lệ đổi trả hàng online."]}, {"num": 6, "question": "Trình bày các bước cơ bản để doanh nghiệp triển khai một chiến dịch VR/AR Marketing, từ xác định mục tiêu đến đo lường và tối ưu.", "answer": ["Quy trình 6 bước: (1) Xác định mục tiêu rõ ràng -> (2) Thấu hiểu tệp khách hàng -> (3) Lựa chọn công nghệ & nền tảng (WebAR, App, Kính VR) -> (4) Phát triển nội dung tương tác 3D -> (5) Phân phối qua kênh (QR code, Link, Event) -> (6) Đo lường KPI và tối ưu."]}, {"num": 7, "question": "Doanh nghiệp có thể sử dụng những nhóm KPI nào để đánh giá hiệu quả VR/AR Marketing? Phân biệt: Engagement Metrics; Reach & Virality Metrics; Conversion Metrics.", "answer": ["Engagement Metrics: Thời gian trải nghiệm trung bình, số lượt tương tác 3D.", "Reach & Virality Metrics: Số lượt quét QR, số lượt dùng filter, số lượt chia sẻ bài viết.", "Conversion Metrics: Tỷ lệ click chuyển hướng mua hàng, số đơn hàng tạo ra từ trải nghiệm AR."]}, {"num": 8, "question": "Blockchain là gì? Trình bày bốn đặc điểm được nhấn mạnh trong bài: Decentralized, Immutable, Transparent, Security.", "answer": ["Khái niệm: Kho lưu trữ thông tin liên kết với nhau bằng các khối (Block) mã hóa theo thời gian.", "Decentralized (Phi tập trung): Không phụ thuộc vào một máy chủ trung tâm.", "Immutable (Bất biến): Dữ liệu đã ghi không thể sửa đổi hay xóa bỏ.", "Transparent (Minh bạch): Mọi bên tham gia đều có thể kiểm tra lịch sử giao dịch.", "Security (Bảo mật): Mã hóa mật mã học an toàn cao."]}, {"num": 9, "question": "Trình bày các ứng dụng/lợi ích của Blockchain đối với Marketing được đề cập trong bài như: Minh bạch quảng cáo; Chống gian lận; Truy xuất thông tin sản phẩm; Loyalty program; Influencer Marketing; Smart Contract.", "answer": ["Xác minh lượt xem/click quảng cáo thật, minh bạch dòng tiền trung gian, cho phép khách hàng quét mã kiểm tra nguồn gốc xuất xứ sản phẩm, token hóa điểm thưởng khách hàng thân thiết và tự động thanh toán cho nhà xuất bản/Influencer qua Hợp đồng thông minh (Smart Contract) khi đạt chỉ số cam kết."]}, {"num": 10, "question": "Marketing tập trung là gì? Trình bày: Đặc điểm; Đối tượng doanh nghiệp phù hợp; Lợi ích; Rủi ro; Ba chiến lược: Market Penetration, Market Development và Product Development.", "answer": ["Khái niệm: Dồn toàn bộ nguồn lực tiếp thị vào một đoạn thị trường nhỏ hẹp hoặc một nhóm khách hàng chuyên biệt.", "Đối tượng: Doanh nghiệp vừa và nhỏ (SMEs), công ty khởi nghiệp có ngân sách hạn chế.", "Lợi ích: Tối ưu chi phí, dễ đạt vị thế dẫn đầu phân khúc ngách.", "Rủi ro: Chi phí sản xuất quy mô nhỏ cao, rủi ro sụt giảm khi thị trường ngách thay đổi.", "Ba chiến lược:", "Market Penetration (Thâm nhập thị trường): Gia tăng thị phần sản phẩm hiện tại trên thị trường hiện có.", "Market Development (Phát triển thị trường): Đưa sản phẩm hiện tại sang thị trường mới.", "Product Development (Phát triển sản phẩm): Tạo sản phẩm mới/cải tiến cho thị trường hiện tại."]}], "quiz": [{"num": 1, "question": "Công nghệ Thực tế ảo (VR - Virtual Reality) được định nghĩa là gì trong bài giảng?", "options": [{"letter": "A", "text": "Công nghệ chồng ghép hình ảnh 3D lên khung cảnh đời thực thông qua camera"}, {"letter": "B", "text": "Môi trường mô phỏng hoàn toàn bằng máy tính, thay thế hoàn toàn thế giới thực của người dùng bằng một trải nghiệm số."}, {"letter": "C", "text": "Công cụ gửi email tự động theo chuỗi thời gian"}, {"letter": "D", "text": "Phần mềm quản lý cơ sở dữ liệu quan hệ SQL"}], "answer": "B", "answerText": "Môi trường mô phỏng hoàn toàn bằng máy tính, thay thế hoàn toàn thế giới thực của người dùng bằng một trải nghiệm số.", "explanation": "Bài giảng định nghĩa VR là môi trường mô phỏng hoàn toàn bằng máy tính, thay thế thế giới thực để tạo cảm giác \"hiện diện\" hoàn toàn trong môi trường ảo.", "level": "Nhận biết"}, {"num": 2, "question": "Công nghệ Thực tế tăng cường (AR - Augmented Reality) có đặc điểm cốt lõi nào?", "options": [{"letter": "A", "text": "Cô lập người dùng hoàn toàn khỏi thế giới bên ngoài"}, {"letter": "B", "text": "Chồng ghép các đối tượng kỹ thuật số (hình ảnh, video, 3D) lên thế giới thực thông qua camera của thiết bị."}, {"letter": "C", "text": "Yêu cầu trang bị phòng chiếu phim 3D chuyên dụng"}, {"letter": "D", "text": "Chỉ hoạt động khi có kết nối mạng cáp quang nội bộ"}], "answer": "B", "answerText": "Chồng ghép các đối tượng kỹ thuật số (hình ảnh, video, 3D) lên thế giới thực thông qua camera của thiết bị.", "explanation": "AR là công nghệ chồng ghép yếu tố ảo lên môi trường thực qua camera điện thoại hay kính AR, giúp người dùng vẫn quan sát được thế giới thực nhưng được \"tăng cường\" thêm thông tin.", "level": "Nhận biết"}, {"num": 3, "question": "Bốn đặc điểm cốt lõi của công nghệ Blockchain được nhấn mạnh trong bài giảng bao gồm?", "options": [{"letter": "A", "text": "Tập trung - Dễ chỉnh sửa - Mật mã đơn giản - Chi phí rẻ"}, {"letter": "B", "text": "Phi tập trung (Decentralized) - Bất biến (Immutable) - Minh bạch (Transparent) - Bảo mật mã hóa (Security)."}, {"letter": "C", "text": "Tự động hóa - Công khai - Miễn phí - Không cần mạng"}, {"letter": "D", "text": "Tốc độ cao - Dung lượng nhỏ - Ẩn danh hoàn toàn - Không thể kiểm toán"}], "answer": "B", "answerText": "Phi tập trung (Decentralized) - Bất biến (Immutable) - Minh bạch (Transparent) - Bảo mật mã hóa (Security).", "explanation": "Slide bài giảng chỉ rõ 4 đặc tính quan trọng của Blockchain: Phi tập trung, Bất biến (không thể sửa/xóa dữ liệu đã ghi), Minh bạch và Bảo mật cao.", "level": "Nhận biết"}, {"num": 4, "question": "Ý tưởng về công nghệ Blockchain lần đầu tiên xuất hiện vào năm nào và bởi ai?", "options": [{"letter": "A", "text": "Năm 2008 bởi Satoshi Nakamoto"}, {"letter": "B", "text": "Năm 1991 bởi hai nhà khoa học Mỹ Stuart Haber và W. Scott Stornetta."}, {"letter": "C", "text": "Năm 2015 bởi Vitalik Buterin"}, {"letter": "D", "text": "Năm 2000 bởi Tim Berners-Lee"}], "answer": "B", "answerText": "Năm 1991 bởi hai nhà khoa học Mỹ Stuart Haber và W. Scott Stornetta.", "explanation": "Slide bài giảng trích dẫn lịch sử: Ý tưởng về Blockchain xuất hiện từ năm 1991 bởi Stuart Haber và W. Scott Stornetta nhằm đánh dấu thời gian cho văn bản online không thể chỉnh sửa.", "level": "Nhận biết"}, {"num": 5, "question": "Marketing trải nghiệm (Experiential Marketing) tập trung vào mục tiêu cốt lõi nào?", "options": [{"letter": "A", "text": "Giảm giá bán sản phẩm xuống mức thấp nhất thị trường"}, {"letter": "B", "text": "Tạo ra những trải nghiệm đáng nhớ, tương tác và cá nhân hóa để xây dựng mối liên kết cảm xúc giữa khách hàng với thương hiệu."}, {"letter": "C", "text": "Phát tờ rơi tại các ngã tư đường phố"}, {"letter": "D", "text": "Tự động sa thải nhân viên bán hàng trực tiếp"}], "answer": "B", "answerText": "Tạo ra những trải nghiệm đáng nhớ, tương tác và cá nhân hóa để xây dựng mối liên kết cảm xúc giữa khách hàng với thương hiệu.", "explanation": "Experiential Marketing là phương thức tiếp thị tập trung giúp khách hàng \"sống\" cùng thương hiệu qua tương tác thực tế và cá nhân hóa cảm xúc.", "level": "Nhận biết"}, {"num": 6, "question": "Mô hình \"Try Before You Buy\" (Thử trước khi mua) ứng dụng công nghệ AR cho phép khách hàng làm gì?", "options": [{"letter": "A", "text": "Dùng thử sản phẩm thật trong 30 ngày rồi trả lại"}, {"letter": "B", "text": "Thử nghiệm trực quan sản phẩm ảo (trang điểm, mặc quần áo, đặt nội thất) trong không gian thực trước khi quyết định mua."}, {"letter": "C", "text": "Nhận sản phẩm miễn phí không cần thanh toán"}, {"letter": "D", "text": "Đăng ký làm đại lý phân phối sản phẩm"}], "answer": "B", "answerText": "Thử nghiệm trực quan sản phẩm ảo (trang điểm, mặc quần áo, đặt nội thất) trong không gian thực trước khi quyết định mua.", "explanation": "\"Try Before You Buy\" qua AR cho phép người dùng hình dung sản phẩm ảo trên chính khuôn mặt hoặc không gian sống của họ trước khi xuống tiền đặt mua.", "level": "Nhận biết"}, {"num": 7, "question": "Khái niệm \"Marketing tập trung\" (Centralized Marketing) được định nghĩa là gì?", "options": [{"letter": "A", "text": "Việc phân bổ ngân sách đều cho tất cả các kênh truyền thông trên toàn quốc"}, {"letter": "B", "text": "Thực hiện các hành động tiếp thị dồn toàn lực vào một đoạn hay phân đoạn thị trường nhỏ cụ thể (một nhóm KH, một sản phẩm, một khu vực)."}, {"letter": "C", "text": "Việc chuyển toàn bộ hoạt động marketing cho công ty nước ngoài"}, {"letter": "D", "text": "Quảng cáo sản phẩm cho mọi lứa tuổi và giới tính"}], "answer": "B", "answerText": "Thực hiện các hành động tiếp thị dồn toàn lực vào một đoạn hay phân đoạn thị trường nhỏ cụ thể (một nhóm KH, một sản phẩm, một khu vực).", "explanation": "Marketing tập trung là chiến lược dồn toàn bộ nguồn lực vào một ngách thị trường hữu hạn để tạo lợi thế cạnh tranh vượt trội.", "level": "Nhận biết"}, {"num": 8, "question": "Thiết bị nào sau đây là bắt buộc để người dùng trải nghiệm môi trường Thực tế ảo (VR)?", "options": [{"letter": "A", "text": "Chuột không dây"}, {"letter": "B", "text": "Kính đeo VR chuyên dụng (như Meta Quest, HTC Vive, Sony PlayStation VR)."}, {"letter": "C", "text": "Thẻ nhớ MicroSD"}, {"letter": "D", "text": "Tai nghe Bluetooth thông thường"}], "answer": "B", "answerText": "Kính đeo VR chuyên dụng (như Meta Quest, HTC Vive, Sony PlayStation VR).", "explanation": "Trải nghiệm VR đòi hỏi kính VR Headsets chuyên dụng để bao bọc thị giác và tách biệt người dùng khỏi môi trường xung quanh.", "level": "Nhận biết"}, {"num": 9, "question": "Thiết bị phổ biến nhất giúp người dùng tiếp cận các ứng dụng Thực tế tăng cường (AR) hàng ngày là gì?", "options": [{"letter": "A", "text": "Máy tính bàn PC kềnh càng"}, {"letter": "B", "text": "Smartphone (Điện thoại thông minh) hoặc Tablet có camera."}, {"letter": "C", "text": "Đồng hồ đeo tay cơ học"}, {"letter": "D", "text": "Máy chiếu hội trường"}], "answer": "B", "answerText": "Smartphone (Điện thoại thông minh) hoặc Tablet có camera.", "explanation": "AR có tính di động cao và không yêu cầu thiết bị quá phức tạp, phổ biến nhất là chạy trực tiếp qua camera trên Smartphone.", "level": "Nhận biết"}, {"num": 10, "question": "Thuật ngữ \"Smart Contract\" (Hợp đồng thông minh) trong Blockchain có vai trò gì trong tiếp thị?", "options": [{"letter": "A", "text": "Bản hợp đồng giấy được ký bằng bút mực cao cấp"}, {"letter": "B", "text": "Các đoạn mã tự động thực thi điều kiện thanh toán/giao dịch khi các tiêu chí thỏa thuận được xác minh trên chuỗi khối."}, {"letter": "C", "text": "Phần mềm soạn thảo văn bản luật"}, {"letter": "D", "text": "Chương trình tự động gửi email đòi nợ"}], "answer": "B", "answerText": "Các đoạn mã tự động thực thi điều kiện thanh toán/giao dịch khi các tiêu chí thỏa thuận được xác minh trên chuỗi khối.", "explanation": "Smart Contract tự động chi trả tiền quảng cáo hoặc điểm thưởng ngay khi các điều kiện cam kết (lượt xem, hành động) được xác minh minh bạch.", "level": "Nhận biết"}, {"num": 11, "question": "Ba nhóm chỉ số KPI cốt lõi để đo lường hiệu suất một chiến dịch VR/AR Marketing bao gồm?", "options": [{"letter": "A", "text": "Financial Metrics - HR Metrics - Tax Metrics"}, {"letter": "B", "text": "Engagement Metrics (Tương tác) - Reach & Virality Metrics (Lan truyền) - Conversion Metrics (Chuyển đổi)."}, {"letter": "C", "text": "CPU Metrics - RAM Metrics - Disk Metrics"}, {"letter": "D", "text": "Impression Metrics - Offline Metrics - Print Metrics"}], "answer": "B", "answerText": "Engagement Metrics (Tương tác) - Reach & Virality Metrics (Lan truyền) - Conversion Metrics (Chuyển đổi).", "explanation": "Bài giảng chia KPI đo lường VR/AR thành 3 nhóm: Mức độ tương tác (thời gian dùng), Mức độ lan truyền (lượt chia sẻ UGC) và Mức độ chuyển đổi (tỷ lệ click CTA/mua hàng).", "level": "Nhận biết"}, {"num": 12, "question": "Ba chiến lược thực hiện Marketing tập trung được đề cập trong bài giảng gồm?", "options": [{"letter": "A", "text": "Tăng giá - Giảm giá - Giữ nguyên giá"}, {"letter": "B", "text": "Thâm nhập thị trường (Market penetration) - Phát triển thị trường (Market development) - Phát triển sản phẩm (Product development)."}, {"letter": "C", "text": "Bán buôn - Bán lẻ - Nhượng quyền"}, {"letter": "D", "text": "Online - Offline - Hybrid"}], "answer": "B", "answerText": "Thâm nhập thị trường (Market penetration) - Phát triển thị trường (Market development) - Phát triển sản phẩm (Product development).", "explanation": "Slide bài giảng liệt kê 3 phương thức triển khai chiến dịch Marketing tập trung: Thâm nhập thị trường, Phát triển thị trường và Phát triển sản phẩm.", "level": "Nhận biết"}, {"num": 13, "question": "Việc số hóa điểm thưởng thành dạng Token trên nền tảng Blockchain trong Loyalty Program được gọi là gì?", "options": [{"letter": "A", "text": "Token hóa điểm thưởng (Tokenization)."}, {"letter": "B", "text": "In phiếu giảm giá giấy"}, {"letter": "C", "text": "Đổi điểm lấy tiền mặt trực tiếp tại ngân hàng"}, {"letter": "D", "text": "Xóa sổ điểm thưởng định kỳ"}], "answer": "A", "answerText": "Token hóa điểm thưởng (Tokenization).", "explanation": "Blockchain cho phép Token hóa điểm thưởng giúp điểm số minh bạch, tránh gian lận, dễ tích hợp liên minh và không lo bị mất dữ liệu.", "level": "Nhận biết"}, {"num": 14, "question": "Lợi ích cốt lõi của Blockchain trong việc chống gian lận quảng cáo (Ad Fraud) là gì?", "options": [{"letter": "A", "text": "Tự động xóa các bài viết quảng cáo của đối thủ"}, {"letter": "B", "text": "Ghi nhận minh bạch từng lượt hiển thị/click thực sự lên chuỗi khối, ngăn chặn bot traffic và gian lận nhà cấp gian trung gian."}, {"letter": "C", "text": "Cho phép doanh nghiệp chạy quảng cáo miễn phí"}, {"letter": "D", "text": "Tự động tăng gấp đôi ngân sách quảng cáo"}], "answer": "B", "answerText": "Ghi nhận minh bạch từng lượt hiển thị/click thực sự lên chuỗi khối, ngăn chặn bot traffic và gian lận nhà cấp gian trung gian.", "explanation": "Blockchain lưu trữ lịch sử tương tác quảng cáo không thể sửa đổi, giúp xác minh người dùng thật và hạn chế việc các bên gian lận click ảo.", "level": "Nhận biết"}, {"num": 15, "question": "Trong Marketing trải nghiệm, hoạt động \"Kích hoạt thương hiệu\" (Brand Activations) được hiểu là gì?", "options": [{"letter": "A", "text": "Việc đăng ký giấy phép kinh doanh với bộ công thương"}, {"letter": "B", "text": "Hoạt động ra mắt sản phẩm/dịch vụ mới và tạo ra các điểm tương tác trực tiếp giúp người tiêu dùng trải nghiệm sản phẩm."}, {"letter": "C", "text": "Việc sa thải nhân sự cũ để tuyển nhân sự mới"}, {"letter": "D", "text": "Việc đóng cửa gian hàng offline để chuyển sang bán online"}], "answer": "B", "answerText": "Hoạt động ra mắt sản phẩm/dịch vụ mới và tạo ra các điểm tương tác trực tiếp giúp người tiêu dùng trải nghiệm sản phẩm.", "explanation": "Brand Activations giúp \"kích hoạt\" sự chú ý của công chúng bằng cách tạo ra các điểm chạm tương tác trực tiếp khi tung sản phẩm mới. 🟡 PHẦN 2: MỨC ĐỘ THÔNG HIỂU (15 CÂU - CĐR 2.1) Mục tiêu: Đánh giá khả năng phân biệt, so sánh bản chất và giải thích kịch bản vận hành của VR/AR, Blockchain và Marketing tập trung.", "level": "Nhận biết"}, {"num": 16, "question": "Phân biệt sự khác biệt bản chất nhất giữa AR (Thực tế tăng cường) và VR (Thực tế ảo)?", "options": [{"letter": "A", "text": "AR đắt tiền hơn VR"}, {"letter": "B", "text": "AR kết hợp và bổ sung yếu tố ảo vào thế giới thực; VR đưa người dùng vào một không gian ảo hoàn toàn, tách biệt khỏi thế giới thực."}, {"letter": "C", "text": "VR chạy trên smartphone; AR bắt buộc dùng kính nặng"}, {"letter": "D", "text": "Cả hai công nghệ này hoàn toàn giống nhau"}], "answer": "B", "answerText": "AR kết hợp và bổ sung yếu tố ảo vào thế giới thực; VR đưa người dùng vào một không gian ảo hoàn toàn, tách biệt khỏi thế giới thực.", "explanation": "Bảng so sánh chỉ rõ: AR giữ người dùng ở lại môi trường thực và thêm chi tiết ảo; còn VR thay thế 100% môi trường xung quanh bằng không gian mô phỏng.", "level": "Thông hiểu"}, {"num": 17, "question": "Phân biệt điểm khác nhau giữa Event Marketing và Experiential Marketing theo tài liệu bài giảng?", "options": [{"letter": "A", "text": "Event Marketing không tốn chi phí; Experiential Marketing rất đắt"}, {"letter": "B", "text": "Mọi sự kiện tiếp thị (Event) đều được coi là tiếp thị trải nghiệm, nhưng không phải tất cả các hoạt động tiếp thị trải nghiệm tương tác (Experiential) đều là một sự kiện."}, {"letter": "C", "text": "Experiential Marketing chỉ dành cho trẻ em"}, {"letter": "D", "text": "Hai khái niệm này độc lập và không liên quan gì đến nhau"}], "answer": "B", "answerText": "Mọi sự kiện tiếp thị (Event) đều được coi là tiếp thị trải nghiệm, nhưng không phải tất cả các hoạt động tiếp thị trải nghiệm tương tác (Experiential) đều là một sự kiện.", "explanation": "Slide làm rõ: Một tính năng AR filter trên smartphone là tiếp thị trải nghiệm nhưng không cần phải tổ chức sự kiện tập trung.", "level": "Thông hiểu"}, {"num": 18, "question": "Trong hành trình khách hàng (Customer Journey), công nghệ AR thể hiện vai trò vượt trội nhất ở giai đoạn nào?", "options": [{"letter": "A", "text": "Giai đoạn nhận lương hàng tháng"}, {"letter": "B", "text": "Giai đoạn Cân nhắc & Đánh giá (Consideration & Evaluation) nhờ tính năng \"Try Before You Buy\"."}, {"letter": "C", "text": "Giai đoạn thanh toán tiền điện nước"}, {"letter": "D", "text": "Giai đoạn khiếu nại sau 5 năm sử dụng"}], "answer": "B", "answerText": "Giai đoạn Cân nhắc & Đánh giá (Consideration & Evaluation) nhờ tính năng \"Try Before You Buy\".", "explanation": "AR giải quyết phân vân ở giai đoạn Cân nhắc: Khách hàng được dùng thử ảo (ướm thử son, đặt sofa vào phòng) để tự tin chốt đơn.", "level": "Thông hiểu"}, {"num": 19, "question": "Tại sao ứng dụng Blockchain lại giúp doanh nghiệp giải quyết \"tâm lý phòng thủ và nghi hoặc\" của khách hàng về nguồn gốc xuất xứ sản phẩm?", "options": [{"letter": "A", "text": "Vì Blockchain tự động viết các bài review khen sản phẩm"}, {"letter": "B", "text": "Khách hàng dễ dàng tự mình truy xuất minh bạch toàn bộ dữ liệu lịch sử sản xuất, vận chuyển không thể bị chỉnh sửa/giả mạo trên chuỗi khối."}, {"letter": "C", "text": "Vì các công ty Blockchain cam kết đền tiền nếu hàng lỗi"}, {"letter": "D", "text": "Vì Blockchain ẩn đi toàn bộ thông tin nhà sản xuất"}], "answer": "B", "answerText": "Khách hàng dễ dàng tự mình truy xuất minh bạch toàn bộ dữ liệu lịch sử sản xuất, vận chuyển không thể bị chỉnh sửa/giả mạo trên chuỗi khối.", "explanation": "Tính minh bạch và bất biến của Blockchain cho phép quét mã truy xuất nhật ký sản xuất/vận chuyển chuẩn xác, xây dựng niềm tin tuyệt đối.", "level": "Thông hiểu"}, {"num": 20, "question": "Lợi ích của Blockchain đối với quy trình Quản lý sự đồng ý của người dùng (Consent Management) là gì?", "options": [{"letter": "A", "text": "Tự động thu thập dữ liệu mà không cần hỏi người dùng"}, {"letter": "B", "text": "Ghi lại sự đồng ý cho phép sử dụng dữ liệu của người dùng thành một bản ghi bất biến, minh bạch và có thể kiểm toán để tuân thủ pháp luật (GDPR)."}, {"letter": "C", "text": "Xóa bỏ hoàn toàn các quy định pháp lý về bảo mật"}, {"letter": "D", "text": "Cho phép doanh nghiệp bán dữ liệu người dùng tự do"}], "answer": "B", "answerText": "Ghi lại sự đồng ý cho phép sử dụng dữ liệu của người dùng thành một bản ghi bất biến, minh bạch và có thể kiểm toán để tuân thủ pháp luật (GDPR).", "explanation": "Blockchain lưu trữ lịch sử Opt-in/Consent của khách hàng công khai và chống chối bỏ, giúp doanh nghiệp chứng minh tính hợp pháp khi kiểm toán.", "level": "Thông hiểu"}, {"num": 21, "question": "Tại sao chiến lược Marketing tập trung lại đặc biệt phù hợp với các doanh nghiệp vừa và nhỏ (SMEs) hoặc Startup?", "options": [{"letter": "A", "text": "Vì doanh nghiệp nhỏ không thể sử dụng Internet"}, {"letter": "B", "text": "Giúp doanh nghiệp không bị phân tán lực lượng, tối ưu hóa ngân sách hạn chế vào đúng phân khúc ngách để giành vị trí thống lĩnh."}, {"letter": "C", "text": "Vì các tập đoàn lớn cấm doanh nghiệp nhỏ chạy quảng cáo"}, {"letter": "D", "text": "Vì doanh nghiệp nhỏ chỉ bán được 1 sản phẩm"}], "answer": "B", "answerText": "Giúp doanh nghiệp không bị phân tán lực lượng, tối ưu hóa ngân sách hạn chế vào đúng phân khúc ngách để giành vị trí thống lĩnh.", "explanation": "Marketing tập trung giúp nguồn lực nhỏ không bị \"pha loãng\". Bằng cách dồn toàn lực vào ngách mục tiêu, doanh nghiệp nhỏ tạo được thế độc quyền cục bộ.", "level": "Thông hiểu"}, {"num": 22, "question": "Phân tích rủi ro lớn nhất của chiến lược Marketing tập trung mà doanh nghiệp cần dự phòng?", "options": [{"letter": "A", "text": "Chi phí quảng cáo trên Facebook quá rẻ"}, {"letter": "B", "text": "Doanh nghiệp đặt \"tất cả trứng vào một giỏ\" — nếu nhu cầu phân khúc ngách đó bị sụt giảm hoặc suy thoái thì doanh nghiệp sẽ đối mặt với nguy cơ sụp đổ."}, {"letter": "C", "text": "Nhân viên công ty sẽ không có việc làm"}, {"letter": "D", "text": "Doanh nghiệp bắt buộc phải mở rộng ra toàn thế giới"}], "answer": "B", "answerText": "Doanh nghiệp đặt \"tất cả trứng vào một giỏ\" — nếu nhu cầu phân khúc ngách đó bị sụt giảm hoặc suy thoái thì doanh nghiệp sẽ đối mặt với nguy cơ sụp đổ.", "explanation": "Rủi ro của Marketing tập trung nằm ở sự biến động thị trường ngách: Khi thị trường mục tiêu suy giảm hoặc xuất hiện đối thủ quá mạnh, doanh nghiệp khó chuyển hướng kịp.", "level": "Thông hiểu"}, {"num": 23, "question": "Việc các nhãn hàng tạo ra AR Filter trên TikTok/Instagram (như đổi màu tóc, thử kính) kích thích hành vi nào của người dùng để lan tỏa thương hiệu?", "options": [{"letter": "A", "text": "Khách hàng xóa ứng dụng TikTok"}, {"letter": "B", "text": "Khách hàng tự quay video trải nghiệm và chia sẻ lên trang cá nhân (Nội dung do người dùng tự tạo - UGC) giúp thương hiệu lan truyền tự nhiên."}, {"letter": "C", "text": "Khách hàng nhắn tin khiếu nại chất lượng filter"}, {"letter": "D", "text": "Khách hàng lập tức đến cửa hàng mua tất cả các sản phẩm"}], "answer": "B", "answerText": "Khách hàng tự quay video trải nghiệm và chia sẻ lên trang cá nhân (Nội dung do người dùng tự tạo - UGC) giúp thương hiệu lan truyền tự nhiên.", "explanation": "Social AR Filters mang tính giải trí cao, khuyến khích người dùng sáng tạo UGC và chia sẻ với bạn bè, tạo hiệu ứng lan truyền (Virality) mạnh mẽ.", "level": "Thông hiểu"}, {"num": 24, "question": "Cơ chế tự động chi trả tiền cho các Nhà xuất bản (Publishers) thông qua Smart Contracts giúp giảm thiểu rủi ro nào trong Marketing?", "options": [{"letter": "A", "text": "Rủi ro máy tính bị hết pin"}, {"letter": "B", "text": "Rủi ro nợ nần, chậm thanh toán, xung đột chi phí và sự gian lận lệch số liệu giữa Advertiser và Publisher."}, {"letter": "C", "text": "Rủi ro bị lộ mật khẩu ngân hàng"}, {"letter": "D", "text": "Rủi ro không tìm được người viết bài"}],
