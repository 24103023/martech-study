<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MarTech Study Hub — Ôn tập Công nghệ Marketing</title>
<meta name="description" content="Web ôn tập 5 chương môn Công nghệ Marketing: lý thuyết, câu hỏi giảng viên và 250 câu trắc nghiệm có giải thích.">
<style>
:root{
  --bg:#f5f7fb; --surface:#ffffff; --surface2:#f0f4ff; --text:#172033;
  --muted:#667085; --line:#e5e9f2; --primary:#5b5bd6; --primary2:#7c3aed;
  --green:#15803d; --greenbg:#ecfdf3; --red:#c62828; --redbg:#fff1f2;
  --amber:#b45309; --shadow:0 12px 32px rgba(31,41,55,.08);
  --radius:18px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
  "Segoe UI", Roboto, Arial, sans-serif; background:var(--bg); color:var(--text);
}
button{font:inherit}
.app{min-height:100vh}
.topbar{
  position:sticky; top:0; z-index:30; background:rgba(255,255,255,.92);
  backdrop-filter:blur(14px); border-bottom:1px solid var(--line);
}
.topbar-inner{max-width:1220px; margin:auto; padding:14px 20px; display:flex; gap:18px; align-items:center}
.brand{display:flex; align-items:center; gap:10px; min-width:max-content}
.logo{
  width:38px; height:38px; display:grid; place-items:center; border-radius:12px;
  background:linear-gradient(135deg,var(--primary),var(--primary2)); color:#fff; font-weight:900;
}
.brand-title{font-weight:850; letter-spacing:-.02em}
.brand-sub{font-size:12px;color:var(--muted)}
.chapter-nav{display:flex; gap:8px; overflow:auto; scrollbar-width:none; flex:1}
.chapter-nav::-webkit-scrollbar{display:none}
.chapter-btn{
  border:1px solid var(--line); background:#fff; padding:9px 13px; border-radius:999px;
  color:var(--muted); cursor:pointer; white-space:nowrap; font-weight:700;
}
.chapter-btn:hover{border-color:#c7c9ff;color:var(--primary)}
.chapter-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}
.progress-mini{min-width:135px;text-align:right;font-size:12px;color:var(--muted)}
.progress-track{height:7px;background:#e9ecf3;border-radius:999px;overflow:hidden;margin-top:5px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));width:0%;transition:.25s}
.hero{
  max-width:1220px; margin:26px auto 0; padding:0 20px;
}
.hero-card{
  padding:28px; border-radius:26px; color:#fff; position:relative; overflow:hidden;
  background:linear-gradient(135deg,#3f3fbb,#6d28d9 58%,#9333ea); box-shadow:var(--shadow)
}
.hero-card:after{
  content:""; position:absolute; width:280px;height:280px;border-radius:50%;
  right:-80px;top:-130px;background:rgba(255,255,255,.10)
}
.hero-eyebrow{font-size:13px;font-weight:800;opacity:.85;text-transform:uppercase;letter-spacing:.12em}
.hero h1{margin:8px 0 9px;font-size:clamp(25px,4vw,40px);line-height:1.12;letter-spacing:-.035em;max-width:850px}
.hero p{margin:0;opacity:.88;max-width:790px;line-height:1.65}
.hero-stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.stat-chip{padding:8px 11px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);border-radius:999px;font-size:13px;font-weight:700}
.main{max-width:1220px;margin:20px auto 70px;padding:0 20px;display:grid;grid-template-columns:260px 1fr;gap:20px}
.sidebar{position:sticky;top:82px;align-self:start}
.side-card,.content-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.side-card{padding:14px}
.section-btn{
  width:100%;border:0;background:transparent;text-align:left;cursor:pointer;padding:13px 14px;border-radius:13px;
  display:flex;gap:11px;align-items:center;color:var(--muted);font-weight:750;margin:2px 0
}
.section-btn:hover{background:var(--surface2);color:var(--primary)}
.section-btn.active{background:#efefff;color:var(--primary)}
.section-icon{width:30px;height:30px;border-radius:9px;background:#f4f5f7;display:grid;place-items:center}
.side-note{font-size:12px;color:var(--muted);padding:12px 10px 4px;line-height:1.5}
.content-card{padding:24px;min-height:620px}
.content-head{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
.kicker{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--primary);font-weight:850}
.content-head h2{margin:5px 0 6px;font-size:26px;letter-spacing:-.025em}
.content-head p{margin:0;color:var(--muted);line-height:1.55}
.badge{padding:7px 10px;border-radius:999px;background:#f2f4f7;color:#475467;font-size:12px;font-weight:800;white-space:nowrap}
.theory-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.theory-item{border:1px solid var(--line);border-radius:15px;padding:16px;background:#fff;line-height:1.62}
.theory-item strong{color:#3730a3}
.theory-item.full{grid-column:1/-1}
.qa-list{display:grid;gap:12px}
.qa-item{border:1px solid var(--line);border-radius:15px;overflow:hidden}
.qa-q{width:100%;border:0;background:#fff;text-align:left;padding:16px 17px;cursor:pointer;display:flex;gap:12px;justify-content:space-between;align-items:flex-start;color:var(--text)}
.qa-q:hover{background:#fafbff}
.qnum{font-weight:850;color:var(--primary);min-width:55px}
.qtext{font-weight:750;line-height:1.5;flex:1}
.chev{transition:.2s;color:var(--muted)}
.qa-item.open .chev{transform:rotate(180deg)}
.qa-a{display:none;background:#fafbff;border-top:1px solid var(--line);padding:15px 18px 17px 72px}
.qa-item.open .qa-a{display:block}
.answer-line{margin:0 0 9px;line-height:1.62;color:#344054}
.answer-line:last-child{margin-bottom:0}
.quiz-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.quiz-meter{flex:1;min-width:200px}
.quiz-meter-top{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
.quiz-card{border:1px solid var(--line);border-radius:18px;padding:21px}
.quiz-meta{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:13px}
.level{font-size:12px;font-weight:850;padding:6px 9px;border-radius:999px}
.level.nb{background:#ecfdf3;color:#087443}.level.th{background:#eef4ff;color:#3538cd}
.level.vd{background:#fff7ed;color:#b54708}.level.vdc{background:#fff1f3;color:#c01048}
.quiz-question{font-size:19px;font-weight:800;line-height:1.52;margin-bottom:17px}
.options{display:grid;gap:10px}
.option{
  border:1.5px solid var(--line);background:#fff;border-radius:13px;padding:13px 14px;cursor:pointer;
  display:flex;gap:12px;align-items:flex-start;text-align:left;color:var(--text);transition:.15s;width:100%
}
.option:hover:not(:disabled){border-color:#aaaaf5;background:#fafaff;transform:translateY(-1px)}
.option:disabled{cursor:default}
.letter{flex:0 0 29px;height:29px;border-radius:9px;background:#f2f4f7;display:grid;place-items:center;font-weight:850;color:#475467}
.option.correct{border-color:#86d3a0;background:var(--greenbg)}
.option.correct .letter{background:#15803d;color:#fff}
.option.wrong{border-color:#f5a3ad;background:var(--redbg)}
.option.wrong .letter{background:#c62828;color:#fff}
.feedback{margin-top:15px;border-radius:14px;padding:15px 16px;display:none;line-height:1.6}
.feedback.show{display:block}
.feedback.good{background:var(--greenbg);border:1px solid #b7e4c7;color:#135c2b}
.feedback.bad{background:var(--redbg);border:1px solid #fecdd3;color:#8f1d28}
.feedback-title{font-weight:900;margin-bottom:4px}
.quiz-actions{display:flex;justify-content:space-between;gap:10px;margin-top:17px}
.btn{
  border:1px solid var(--line);background:#fff;color:#344054;padding:10px 14px;border-radius:11px;
  font-weight:800;cursor:pointer
}
.btn:hover{background:#f8f9fc}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{filter:brightness(.96)}
.btn.danger{color:#b42318}
.score-box{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.score-num{font-weight:900;color:var(--text)}
.quiz-jump{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:17px}
.jump{
  border:1px solid var(--line);background:#fff;height:33px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:800;color:#667085
}
.jump.current{outline:2px solid #8b8bf0;border-color:transparent}
.jump.done-good{background:#ecfdf3;color:#15803d;border-color:#b7e4c7}
.jump.done-bad{background:#fff1f2;color:#c62828;border-color:#fecdd3}
.footer-nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.empty{padding:40px;text-align:center;color:var(--muted)}
.toast{
  position:fixed;right:20px;bottom:20px;background:#111827;color:#fff;padding:11px 14px;border-radius:12px;
  box-shadow:var(--shadow);font-size:13px;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s;z-index:50
}
.toast.show{opacity:1;transform:none}
@media(max-width:880px){
  .main{grid-template-columns:1fr}.sidebar{position:static}.side-card{display:flex;gap:6px;overflow:auto;padding:8px}
  .section-btn{min-width:max-content;width:auto}.side-note{display:none}.progress-mini{display:none}
  .theory-grid{grid-template-columns:1fr}.theory-item.full{grid-column:auto}
}
@media(max-width:600px){
  .topbar-inner{padding:10px 12px}.brand-sub{display:none}.hero{padding:0 12px;margin-top:14px}.hero-card{padding:20px;border-radius:20px}
  .main{padding:0 12px;margin-top:12px}.content-card{padding:15px;min-height:0}.content-head{display:block}.badge{display:inline-block;margin-top:8px}
  .qa-a{padding-left:16px}.quiz-card{padding:15px}.quiz-question{font-size:17px}.quiz-jump{grid-template-columns:repeat(5,1fr)}
  .chapter-btn{padding:8px 11px}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="logo">M</div>
        <div><div class="brand-title">MarTech Study Hub</div><div class="brand-sub">Công nghệ Marketing</div></div>
      </div>
      <nav class="chapter-nav" id="chapterNav" aria-label="Chọn chương"></nav>
      <div class="progress-mini">
        <span id="overallText">Tiến độ 0%</span>
        <div class="progress-track"><div class="progress-fill" id="overallFill"></div></div>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="hero-card">
      <div class="hero-eyebrow">Ôn tập theo đúng tài liệu</div>
      <h1 id="heroTitle">Chương 1</h1>
      <p id="heroDesc"></p>
      <div class="hero-stats">
        <div class="stat-chip">📘 Lý thuyết trọng tâm</div>
        <div class="stat-chip">🧠 10 câu hỏi giảng viên</div>
        <div class="stat-chip">✅ 50 câu trắc nghiệm</div>
        <div class="stat-chip">💾 Tự lưu tiến độ</div>
      </div>
    </div>
  </section>

  <main class="main">
    <aside class="sidebar">
      <div class="side-card">
        <button class="section-btn active" data-section="theory"><span class="section-icon">📘</span>Lý thuyết</button>
        <button class="section-btn" data-section="qa"><span class="section-icon">🧠</span>Câu hỏi GV</button>
        <button class="section-btn" data-section="quiz"><span class="section-icon">✅</span>Trắc nghiệm</button>
        <div class="side-note">Học theo thứ tự từng phần. Trắc nghiệm sẽ hiện đúng/sai và giải thích ngay sau khi chọn.</div>
      </div>
    </aside>

    <section class="content-card" id="content"></section>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
const DATA = {"chapters": [{"id": 1, "title": "Giới thiệu về Công nghệ Marketing (MarTech)", "theory": ["Khái niệm MarTech: Công nghệ Marketing là sự kết hợp giữa tiếp thị và công nghệ kỹ thuật số. Đây là các phần mềm, công cụ hỗ trợ marketer lập kế hoạch, thực thi, quản lý và đo lường chiến dịch.", "Ba đặc điểm cốt lõi:", "Dữ liệu làm trung tâm (Data-centric): Thu thập và phân tích hành vi, sở thích khách hàng.", "Tính tự động hóa cao (Automation): Rút ngắn thời gian xử lý dữ liệu và chăm sóc khách hàng.", "Tích hợp đa nền tảng (Omnichannel integration): Đồng bộ dữ liệu bán hàng, kho bãi từ Website, Fanpage, Shopee, Lazada....", "Phân biệt bộ ba khái niệm:", "MarTech: Tập trung quản lý toàn bộ quy trình tiếp thị và mối quan hệ khách hàng.", "Digital Marketing: Các hoạt động tiếp thị diễn ra trên môi trường kỹ thuật số/Internet.", "AdTech: Tập trung vào các công cụ mua bán không gian quảng cáo và phân phối quảng cáo hiển thị.", "Ứng dụng AI/Machine Learning: Phân thành 4 nhóm chính: Tìm kiếm thông tin, Sáng tạo nội dung, Xác định khách hàng mục tiêu và Tối ưu quảng cáo/cá nhân hóa."], "qa": [{"num": 1, "question": "Công nghệ Marketing (MarTech) là gì? Trình bày ngắn gọn mục đích của việc ứng dụng công nghệ trong hoạt động marketing.", "answer": ["Khái niệm: MarTech là thuật ngữ kết hợp giữa Marketing và Technology, chỉ các công cụ, phần mềm và nền tảng kỹ thuật số được sử dụng để lập kế hoạch, thực hiện, quản lý và đo lường các chiến dịch tiếp thị.", "Mục đích: Giúp tự động hóa các quy trình, tối ưu hóa chi phí, phân tích dữ liệu hành vi khách hàng và cá nhân hóa trải nghiệm người dùng ở quy mô lớn."]}, {"num": 2, "question": "Phân biệt Marketing Technology (MarTech) và Digital Marketing. Hãy đưa ra một ví dụ đơn giản để minh họa cho sự khác nhau giữa hai khái niệm.", "answer": ["Phân biệt: Digital Marketing là các hoạt động tiếp thị thực hiện trên internet (đăng video, chạy ads...). MarTech là tập hợp công cụ, phần mềm hỗ trợ và thực thi quá trình đó.", "Ví dụ: Đăng video nhảy lên TikTok và chạy quảng cáo thu hút view là Digital Marketing. Dùng AI phân tích giờ vàng đăng bài, phần mềm tự động phân loại tệp xem video lâu nhất rồi gửi email kèm mã giảm giá hàng loạt là MarTech."]}, {"num": 3, "question": "Phân biệt MarTech và Advertising Technology (AdTech). Theo bạn, điểm khác biệt quan trọng nhất giữa hai khái niệm này là gì?", "answer": ["Phân biệt: MarTech tập trung quản lý mối quan hệ khách hàng, nội dung, nuôi dưỡng leads và trải nghiệm dài hạn. AdTech tập trung vào việc mua bán không gian quảng cáo trực tuyến và phân phối quảng cáo hiệu quả.", "Điểm khác biệt quan trọng nhất: AdTech thiên về thu hút/tái tiếp cận bên ngoài ở giai đoạn đầu phễu; MarTech thiên về quản lý dữ liệu nội bộ và chăm sóc/tương tác khách hàng xuyên suốt hành trình."]}, {"num": 4, "question": "Trình bày ba đặc điểm chính của Công nghệ Marketing: Sử dụng dữ liệu làm trung tâm, Tính tự động hóa cao, Tích hợp đa nền tảng. Với mỗi đặc điểm, hãy đưa ra một ví dụ minh họa.", "answer": ["Sử dụng dữ liệu làm trung tâm: Thu thập, phân tích hành vi để thấu hiểu khách hàng. Ví dụ: Amazon gợi ý sản phẩm dựa trên lịch sử mua hàng; Spotify tạo danh sách nghe nhạc Discover Weekly.", "Tính tự động hóa cao: Rút ngắn thời gian thu thập, xử lý và chăm sóc khách hàng tự động. Ví dụ: Tự động gửi email chúc mừng sinh nhật kèm voucher.", "Tích hợp đa nền tảng: Đồng bộ dữ liệu đơn hàng, tồn kho và khách hàng từ nhiều kênh. Ví dụ: Haravan hoặc Sapo đồng bộ dữ liệu giữa cửa hàng offline, Website, Facebook, Shopee, Lazada."]}, {"num": 5, "question": "Công nghệ có thể được ứng dụng vào những hoạt động marketing nào? Hãy lựa chọn ba hoạt động và giải thích ngắn gọn cách công nghệ hỗ trợ marketer trong từng hoạt động.", "answer": ["1. Marketing tự động hóa (Marketing Automation): Tự động gửi chuỗi email chăm sóc khách hàng dựa trên hành vi điền form.", "2. Quản lý quan hệ khách hàng (CRM): Lưu trữ lịch sử tương tác, phân khúc đối tượng và cung cấp góc nhìn 360 độ về khách hàng.", "3. Đo lường tiếp thị (Marketing Analytics): Cung cấp báo cáo chính xác về ROMI, tỷ lệ chuyển đổi và hiệu suất chiến dịch theo thời gian thực."]}, {"num": 6, "question": "Phân tích vai trò của Công nghệ Marketing trong việc giúp doanh nghiệp: Tiếp cận khách hàng; Tối ưu chi phí marketing; Đo lường hiệu quả chiến dịch; Cải thiện trải nghiệm khách hàng.", "answer": ["Tiếp cận khách hàng: Định vị đúng đối tượng mục tiêu qua phân tích dữ liệu hành vi.", "Tối ưu chi phí: Phân bổ ngân sách theo thời gian thực, loại bỏ tác vụ thủ công.", "Đo lường hiệu quả: Cung cấp các chỉ số đo lường chính xác như ROMI, CPA, conversion rate.", "Cải thiện trải nghiệm: Tích hợp đa kênh liền mạch và cá nhân hóa nội dung phù hợp với từng sở thích riêng biệt."]}, {"num": 7, "question": "AI và Machine Learning đang hỗ trợ marketer trong những công việc nào? Hãy trình bày theo bốn nhóm: tìm kiếm thông tin, sáng tạo nội dung, xác định khách hàng mục tiêu và quảng cáo.", "answer": ["Tìm kiếm thông tin: Tìm kiếm văn bản pháp lý, nghiên cứu thông tin thị trường nhanh chóng.", "Sáng tạo nội dung: Tạo nội dung văn bản, hình ảnh nhanh, hỗ trợ thử nghiệm A/B hàng loạt.", "Xác định KH mục tiêu: Phân tích \"dấu vết kỹ thuật số\" (click, scroll, time-on-site) để tự động phát hiện các nhóm khách hàng tiềm năng.", "Quảng cáo: Tối ưu hóa giá thầu, nhắm mục tiêu theo thời gian thực và cá nhân hóa thông điệp quảng cáo."]}, {"num": 8, "question": "AI có thể sử dụng dữ liệu hành vi của khách hàng như lượt click, tìm kiếm, xem video hoặc lịch sử mua hàng như thế nào để hỗ trợ doanh nghiệp xác định khách hàng mục tiêu?", "answer": ["AI tổng hợp các \"dấu vết kỹ thuật số\" này để hình thành chân dung khách hàng chi tiết. Thay vì marketer phải tự lọc tiêu chí nhân khẩu học thủ công, thuật toán AI sẽ \"nhìn\" toàn bộ dữ liệu đại quạt để tự động phát hiện ra các nhóm người dùng có mẫu hành vi tương đồng."]}, {"num": 9, "question": "Trình bày những cách AI có thể cải thiện Customer Experience. Hãy lựa chọn ít nhất ba trong các hoạt động: cá nhân hóa, khuyến nghị, chatbot, phân tích cảm xúc, tự động hóa hành trình khách hàng hoặc tối ưu tìm kiếm.", "answer": ["1. Cá nhân hóa & Khuyến nghị: Đề xuất đúng sản phẩm/dịch vụ dựa trên lịch sử xem/mua.", "2. Hỗ trợ tự động qua Chatbot: Phản hồi thắc mắc khách hàng ngay lập tức 24/7.", "3. Phân tích cảm xúc: Đánh giá tone giọng/từ ngữ tiêu cực của khách hàng để đưa ra câu trả lời đồng cảm thích hợp."]}, {"num": 10, "question": "Theo bạn, khi AI và tự động hóa ngày càng được tích hợp sâu vào MarTech, vai trò của marketer sẽ thay đổi như thế nào? Công nghệ có thể thay thế hoàn toàn marketer hay không? Giải thích ngắn gọn quan điểm của bạn.", "answer": ["Thay đổi vai trò: AI đóng vai trò là \"trợ lý kỹ thuật số\" giải phóng marketer khỏi các tác vụ lặp đi lặp lại. Marketer sẽ chuyển sang tập trung vào định hướng chiến lược, thiết kế trải nghiệm và quản trị dữ liệu.", "Không thể thay thế hoàn toàn: Công nghệ thiếu cảm xúc, sự thấu hiểu đồng cảm sâu sắc, khả năng tư duy sáng tạo độc đáo và trực giác chiến lược của con người."]}], "quiz": [{"num": 1, "question": "Thuật ngữ \"MarTech\" được ghép từ hai từ tiếng Anh nào?", "options": [{"letter": "A", "text": "Market & Techwear"}, {"letter": "B", "text": "Marketing & Technology"}, {"letter": "C", "text": "Marketplace & Technology"}, {"letter": "D", "text": "Marketing & Technician"}], "answer": "B", "answerText": "Marketing & Technology", "explanation": "Theo slide bài giảng Chương 1, Martech là sự kết hợp giữa các từ tiếp thị (Marketing) và công nghệ (Technology).", "level": "Nhận biết"}, {"num": 2, "question": "Khái niệm nào sau đây phản ánh chính xác nhất về Công nghệ Marketing (MarTech)?", "options": [{"letter": "A", "text": "Là việc đăng bài viết và chạy quảng cáo hiển thị trên nền tảng mạng xã hội TikTok"}, {"letter": "B", "text": "Là tập hợp các phần mềm, công cụ và công nghệ kỹ thuật số dùng để lập kế hoạch, thực hiện, quản lý và đo lường các chiến dịch tiếp thị"}, {"letter": "C", "text": "Là các thiết bị phần cứng được sản xuất chuyên dụng trong phòng nghiên cứu thị trường"}, {"letter": "D", "text": "Là hoạt động bán hàng trực tiếp tại cửa hàng offline thông qua máy tính tiền POS"}], "answer": "B", "answerText": "Là tập hợp các phần mềm, công cụ và công nghệ kỹ thuật số dùng để lập kế hoạch, thực hiện, quản lý và đo lường các chiến dịch tiếp thị", "explanation": "MarTech được định nghĩa chuẩn xác là chỉ các công cụ, phần mềm, và công nghệ kỹ thuật số mà Marketer sử dụng để lập kế hoạch, thực hiện, quản lý và đo lường các chiến dịch Marketing nhằm đạt mục tiêu kinh doanh.", "level": "Nhận biết"}, {"num": 3, "question": "Theo Philip Kotler, Marketing được định nghĩa là gì?", "options": [{"letter": "A", "text": "Nghệ thuật bán được nhiều hàng hóa nhất bằng mọi giá"}, {"letter": "B", "text": "Hoạt động đăng bài quảng cáo trên mạng xã hội để thu hút người xem"}, {"letter": "C", "text": "Nghệ thuật tạo ra giá trị, truyền thông và phân phối những giá trị đó nhằm thỏa mãn nhu cầu của khách hàng mục tiêu để đem lại lợi nhuận tối ưu"}, {"letter": "D", "text": "Quá trình tự động hóa toàn bộ công việc của nhân viên bán hàng"}], "answer": "C", "answerText": "Nghệ thuật tạo ra giá trị, truyền thông và phân phối những giá trị đó nhằm thỏa mãn nhu cầu của khách hàng mục tiêu để đem lại lợi nhuận tối ưu", "explanation": "Slide bài giảng trích dẫn định nghĩa kinh điển của Philip Kotler: \"Marketing là nghệ thuật tạo ra giá trị, truyền thông và phân phối những giá trị đó nhằm thỏa mãn nhu cầu của khách hàng mục tiêu để đem lại lợi nhuận tối ưu cho doanh nghiệp\"4.", "level": "Nhận biết"}, {"num": 4, "question": "Ba đặc điểm cốt lõi của Công nghệ Marketing (MarTech) bao gồm những yếu tố nào?", "options": [{"letter": "A", "text": "Sử dụng dữ liệu làm trung tâm - Tính tự động hóa cao - Tích hợp đa nền tảng"}, {"letter": "B", "text": "Giá rẻ - Dễ sử dụng - Không cần con người"}, {"letter": "C", "text": "Quảng cáo truyền hình - Phát tờ rơi - Tổ chức sự kiện"}, {"letter": "D", "text": "Tập trung vào sản phẩm - Định giá cố định - Bán hàng trực tiếp"}], "answer": "A", "answerText": "Sử dụng dữ liệu làm trung tâm - Tính tự động hóa cao - Tích hợp đa nền tảng", "explanation": "Bài giảng nêu rõ 3 đặc điểm chính của MarTech: (1) Sử dụng dữ liệu làm trung tâm, (2) Tính tự động hóa cao, và (3) Tích hợp đa nền tảng.", "level": "Nhận biết"}, {"num": 5, "question": "Yếu tố nào đóng vai trò là \"trung tâm\" giúp các nhà tiếp thị thu thập, phân tích để hiểu rõ hành vi và sở thích của khách hàng trong MarTech?", "options": [{"letter": "A", "text": "Hình ảnh quảng cáo"}, {"letter": "B", "text": "Dữ liệu (Data)"}, {"letter": "C", "text": "Kính thực tế ảo"}, {"letter": "D", "text": "Nội dung văn bản"}], "answer": "B", "answerText": "Dữ liệu (Data)", "explanation": "Đặc điểm đầu tiên của MarTech là \"Sử dụng dữ liệu làm trung tâm\", dữ liệu cho phép nhà tiếp thị thu thập, phân tích và hiểu rõ hơn về hành vi, sở thích và xu hướng của khách hàng.", "level": "Nhận biết"}, {"num": 6, "question": "Khái niệm \"Digital Marketing\" được hiểu là gì theo tài liệu bài giảng?", "options": [{"letter": "A", "text": "Tập hợp các phần mềm và hệ thống CRM quản lý dữ liệu nội bộ"}, {"letter": "B", "text": "Các hoạt động marketing diễn ra thông qua internet và các phương tiện điện tử"}, {"letter": "C", "text": "Công cụ chuyên dùng để mua bán không gian quảng cáo tự động"}, {"letter": "D", "text": "Việc sản xuất các thiết bị điện tử gia dụng"}], "answer": "B", "answerText": "Các hoạt động marketing diễn ra thông qua internet và các phương tiện điện tử", "explanation": "Phân biệt trong bài giảng khẳng định Digital Marketing chính là các hoạt động tiếp thị/marketing diễn ra thông qua môi trường internet và các phương tiện điện tử.", "level": "Nhận biết"}, {"num": 7, "question": "Thuật ngữ \"AdTech\" là viết tắt của khái niệm nào?", "options": [{"letter": "A", "text": "Advance Technology"}, {"letter": "B", "text": "Advertising Technology"}, {"letter": "C", "text": "Admin Technology"}, {"letter": "D", "text": "Advisor Technology"}], "answer": "B", "answerText": "Advertising Technology", "explanation": "AdTech là viết tắt của Advertising Technology (Công nghệ quảng cáo), bao gồm các công cụ, phần mềm giúp chạy quảng cáo trên Internet.", "level": "Nhận biết"}, {"num": 8, "question": "Nhóm ứng dụng nào sau đây KHÔNG thuộc 4 nhóm ứng dụng chính của AI và Machine Learning trong MarTech được trình bày ở Chương 1?", "options": [{"letter": "A", "text": "Tìm kiếm thông tin"}, {"letter": "B", "text": "Sáng tạo nội dung"}, {"letter": "C", "text": "Xác định khách hàng mục tiêu và Quảng cáo"}, {"letter": "D", "text": "Quản trị sản xuất vật lý tại nhà máy"}], "answer": "D", "answerText": "Quản trị sản xuất vật lý tại nhà máy", "explanation": "Bài giảng Chương 1 phân chia ứng dụng của AI/ML thành 4 nhóm chính: (1) Tìm kiếm thông tin, (2) Sáng tạo nội dung, (3) Xác định KH mục tiêu, và (4) Quảng cáo.", "level": "Nhận biết"}, {"num": 9, "question": "Theo khảo sát từ Experian và Boston Consulting Group (BCG), email được AI cá nhân hóa có tỷ lệ mở cao hơn bao nhiêu % so với email gửi đại trà?", "options": [{"letter": "A", "text": "10%"}, {"letter": "B", "text": "15%"}, {"letter": "C", "text": "29%12"}, {"letter": "D", "text": "50%"}], "answer": "C", "answerText": "29%12", "explanation": "Nghiên cứu từ Experian trích dẫn trong slide cho thấy email được AI cá nhân hóa có tỷ lệ mở cao hơn 29% và tỷ lệ nhấp chuột (CTR) cao hơn 41% so với email gửi đại trà.", "level": "Nhận biết"}, {"num": 10, "question": "Trải nghiệm khách hàng (Customer Experience - CX) được định nghĩa là gì?", "options": [{"letter": "A", "text": "Việc khách hàng thanh toán tiền mặt tại quầy thu ngân"}, {"letter": "B", "text": "Toàn bộ cảm nhận và ấn tượng của khách hàng trong suốt quá trình tương tác với một thương hiệu"}, {"letter": "C", "text": "Số lượt click vào bài viết quảng cáo trên Facebook"}, {"letter": "D", "text": "Tốc độ giao hàng của đơn vị vận chuyển"}], "answer": "B", "answerText": "Toàn bộ cảm nhận và ấn tượng của khách hàng trong suốt quá trình tương tác với một thương hiệu", "explanation": "Trải nghiệm khách hàng (CX) là toàn bộ cảm nhận và ấn tượng của khách hàng trong suốt quá trình tương tác với một thương hiệu (gồm chất lượng, sự tiện lợi, phản hồi, thái độ phục vụ...).", "level": "Nhận biết"}, {"num": 11, "question": "Theo chuyên gia Darrell Alfonso (2022), AI và các AI agents đóng vai trò gì trong MarTech Stack?", "options": [{"letter": "A", "text": "Thay thế 100% Giám đốc Marketing"}, {"letter": "B", "text": "Đóng vai trò như \"trợ lý kỹ thuật số\", tự động hóa các tác vụ lặp đi lặp lại đằng sau hậu trường"}, {"letter": "C", "text": "Là phần mềm độc lập không liên quan đến dữ liệu"}, {"letter": "D", "text": "Là công cụ chỉ dùng để chỉnh sửa ảnh"}], "answer": "B", "answerText": "Đóng vai trò như \"trợ lý kỹ thuật số\", tự động hóa các tác vụ lặp đi lặp lại đằng sau hậu trường", "explanation": "Darrell Alfonso nhấn mạnh: AI – đặc biệt là các AI agents – sẽ đóng vai trò như \"trợ lý kỹ thuật số\", tự động hóa tác vụ lặp đi lặp lại và hỗ trợ marketer \"vô hình\" đằng sau hậu trường.", "level": "Nhận biết"}, {"num": 12, "question": "Quy trình marketing nào sau đây CÓ THỂ ứng dụng công nghệ MarTech theo bài giảng?", "options": [{"letter": "A", "text": "Marketing tự động hóa (Marketing Automation)"}, {"letter": "B", "text": "Quản lý quan hệ khách hàng (CRM) và Quản lý nội dung (CMS)"}, {"letter": "C", "text": "Đo lường marketing và Email marketing"}, {"letter": "D", "text": "Tất cả các quy trình trên"}], "answer": "D", "answerText": "Tất cả các quy trình trên", "explanation": "Slide liệt kê các quy trình ứng dụng MarTech gồm: Marketing automation, CRM, CMS, Đo lường marketing và Email marketing.", "level": "Nhận biết"}, {"num": 13, "question": "Hành trình khách hàng (Customer Journey) tiêu chuẩn bao gồm 5 giai đoạn nào xếp theo đúng thứ tự?", "options": [{"letter": "A", "text": "Mua hàng -> Nhận biết -> Cân nhắc -> Quay lại -> Ủng hộ"}, {"letter": "B", "text": "Nhận biết (Awareness) -> Cân nhắc (Consideration) -> Mua hàng (Purchase) -> Quay lại (Retention) -> Ủng hộ (Advocacy)"}, {"letter": "C", "text": "Cân nhắc -> Nhận biết -> Ủng hộ -> Mua hàng -> Quay lại"}, {"letter": "D", "text": "Nhận biết -> Mua hàng -> Cân nhắc -> Ủng hộ -> Quay lại"}], "answer": "B", "answerText": "Nhận biết (Awareness) -> Cân nhắc (Consideration) -> Mua hàng (Purchase) -> Quay lại (Retention) -> Ủng hộ (Advocacy)", "explanation": "Sơ đồ hành trình khách hàng trong bài giảng thể hiện rõ 5 mốc tiến trình: Nhận biết -> Cân nhắc -> Mua hàng -> Quay lại -> Ủng hộ.", "level": "Nhận biết"}, {"num": 14, "question": "Chỉ số ROMI trong vai trò đo lường của MarTech là viết tắt của thuật ngữ nào?", "options": [{"letter": "A", "text": "Return on Marketing Investment"}, {"letter": "B", "text": "Rate of Marketing Interest"}, {"letter": "C", "text": "Real Online Marketing Index"}, {"letter": "D", "text": "Reach of Marketing Impression"}], "answer": "A", "answerText": "Return on Marketing Investment", "explanation": "ROMI (Lợi nhuận trên chi phí đầu tư Marketing) là thước đo quan trọng được MarTech cung cấp báo cáo chi tiết.", "level": "Nhận biết"}, {"num": 15, "question": "Theo bài giảng, công nghệ MarTech hỗ trợ tối ưu hóa chi phí quảng cáo thông qua khả năng nào?", "options": [{"letter": "A", "text": "In tờ rơi số lượng lớn giá rẻ"}, {"letter": "B", "text": "Tối ưu hóa ngân sách theo thời gian thực (real-time) trên các nền tảng quảng cáo số"}, {"letter": "C", "text": "Tự động cắt giảm lương của nhân viên marketing"}, {"letter": "D", "text": "Miễn phí tiền quảng cáo trên Google và Facebook"}], "answer": "B", "answerText": "Tối ưu hóa ngân sách theo thời gian thực (real-time) trên các nền tảng quảng cáo số", "explanation": "Vai trò của MarTech trong tối ưu chi phí là ứng dụng các nền tảng quảng cáo số với khả năng tự động tối ưu ngân sách theo thời gian thực. 🟡 PHẦN 2: MỨC ĐỘ THÔNG HIỂU (15 CÂU - CĐR 2.1) Mục tiêu: Đánh giá khả năng phân biệt, giải thích bản chất các công cụ và cơ chế hoạt động của MarTech.", "level": "Nhận biết"}, {"num": 16, "question": "Điểm khác biệt bản chất nhất giữa MarTech và Digital Marketing là gì?", "options": [{"letter": "A", "text": "MarTech là các hoạt động tiếp thị, còn Digital Marketing là phần mềm"}, {"letter": "B", "text": "Digital Marketing là tập hợp hoạt động/chiến thuật tiếp thị trên môi trường số; MarTech là tập hợp công cụ/phần mềm hỗ trợ thực thi quy trình đó"}, {"letter": "C", "text": "Digital Marketing chỉ dùng cho doanh nghiệp lớn, MarTech chỉ dùng cho cá nhân"}, {"letter": "D", "text": "Không có điểm khác biệt, hai khái niệm hoàn toàn trùng khớp"}], "answer": "B", "answerText": "Digital Marketing là tập hợp hoạt động/chiến thuật tiếp thị trên môi trường số; MarTech là tập hợp công cụ/phần mềm hỗ trợ thực thi quy trình đó", "explanation": "Bài giảng đối chiếu: Digital Marketing = Các hoạt động marketing diễn ra thông qua internet; MarTech = Tập hợp công cụ, phần mềm công nghệ hỗ trợ quá trình marketing đó.", "level": "Thông hiểu"}, {"num": 17, "question": "Phân biệt sự khác nhau trọng tâm giữa AdTech (Advertising Technology) và MarTech (Marketing Technology)?", "options": [{"letter": "A", "text": "AdTech tập quan lý dữ liệu nội bộ CRM; MarTech dùng mua bán quảng cáo ngoài"}, {"letter": "B", "text": "AdTech tập trung vào mua bán không gian quảng cáo và thu hút KH ở đầu phễu; MarTech tập trung quản lý dữ liệu, nuôi dưỡng và chăm sóc mối quan hệ KH dài hạn"}, {"letter": "C", "text": "AdTech không sử dụng internet; MarTech bắt buộc sử dụng internet"}, {"letter": "D", "text": "AdTech do bộ phận kế toán quản lý; MarTech do IT quản lý"}], "answer": "B", "answerText": "AdTech tập trung vào mua bán không gian quảng cáo và thu hút KH ở đầu phễu; MarTech tập trung quản lý dữ liệu, nuôi dưỡng và chăm sóc mối quan hệ KH dài hạn", "explanation": "AdTech tập trung vào các chiến thuật quảng cáo và nền tảng khởi tạo nhu cầu (bên ngoài); MarTech đi sâu phân tích thói quen, nhu cầu qua dữ liệu để giữ chân và tạo gắn kết lâu dài.", "level": "Thông hiểu"}, {"num": 18, "question": "Việc Amazon đề xuất sản phẩm phù hợp dựa trên lịch sử mua hàng hoặc Spotify tạo danh sách \"Discover Weekly\" minh họa cho đặc điểm nào của MarTech?", "options": [{"letter": "A", "text": "Tính tự động hóa cao"}, {"letter": "B", "text": "Sử dụng dữ liệu làm trung tâm (Data-centric)"}, {"letter": "C", "text": "Tích hợp đa nền tảng"}, {"letter": "D", "text": "Tiết kiệm nhân sự thủ công"}], "answer": "B", "answerText": "Sử dụng dữ liệu làm trung tâm (Data-centric)", "explanation": "Đây là 2 ví dụ điển hình trong slide bài giảng minh họa cho đặc điểm \"Sử dụng dữ liệu làm trung tâm\": dùng dữ liệu lịch sử nghe nhạc/mua sắm để phân tích sở thích và cá nhân hóa.", "level": "Thông hiểu"}, {"num": 19, "question": "Nền tảng Haravan hoặc Sapo đồng bộ dữ liệu đơn hàng, tồn kho và khách hàng từ Cửa hàng offline, Website, Facebook, Shopee, Lazada về một hệ thống duy nhất là ví dụ về đặc điểm nào?", "options": [{"letter": "A", "text": "Sử dụng dữ liệu làm trung tâm"}, {"letter": "B", "text": "Tính tự động hóa cao"}, {"letter": "C", "text": "Tích hợp đa nền tảng (Omnichannel integration)"}, {"letter": "D", "text": "Đo lường quảng cáo AdTech"}], "answer": "C", "answerText": "Tích hợp đa nền tảng (Omnichannel integration)", "explanation": "Slide trích dẫn Haravan và Sapo là ví dụ minh họa cho đặc điểm \"Tích hợp đa nền tảng\" giúp tăng khả năng kết nối và đồng bộ dữ liệu trên nhiều kênh.", "level": "Thông hiểu"}, {"num": 20, "question": "Tại sao công cụ Chatbot trên Messenger tư vấn sản phẩm và tự động đặt lịch hẹn cho nhà hàng lại thể hiện đặc điểm \"Tính tự động hóa cao\"?", "options": [{"letter": "A", "text": "Vì chatbot tự viết ra sản phẩm mới"}, {"letter": "B", "text": "Vì nó giúp rút ngắn quy trình thu thập thông tin, xử lý dữ liệu và chăm sóc KH mà không cần nhân viên hỗ trợ thủ công 24/767"}, {"letter": "C", "text": "Vì nó thay thế hoàn toàn mạng internet"}, {"letter": "D", "text": "Vì nó tự động tăng giá món ăn theo giờ"}], "answer": "B", "answerText": "Vì nó giúp rút ngắn quy trình thu thập thông tin, xử lý dữ liệu và chăm sóc KH mà không cần nhân viên hỗ trợ thủ công 24/767", "explanation": "Đặc điểm \"Tính tự động hóa cao\" giúp rút ngắn quy trình xử lý dữ liệu, chăm sóc KH tự động và giảm tải công việc thủ công cho nhân viên.", "level": "Thông hiểu"}, {"num": 21, "question": "Thuật ngữ \"Dấu vết kỹ thuật số\" (Digital footprint) của khách hàng mà AI thu thập để định hình chân dung KH bao gồm những dữ liệu nào?", "options": [{"letter": "A", "text": "Lượt click, lịch sử tìm kiếm, lượt xem video, thao tác cuộn màn hình và thời gian ở lại trang"}, {"letter": "B", "text": "Số căn cước công dân và sổ hộ khẩu"}, {"letter": "C", "text": "Chiều cao, cân nặng và nhóm máu"}, {"letter": "D", "text": "Tất cả các tài sản vật chất khách hàng sở hữu"}], "answer": "A", "answerText": "Lượt click, lịch sử tìm kiếm, lượt xem video, thao tác cuộn màn hình và thời gian ở lại trang", "explanation": "Bài giảng nêu rõ: Mỗi lượt click, tìm kiếm, xem video, cuộn màn hình trên website hay thời gian ở lại trang cụ thể đều là những \"dấu vết kỹ thuật số\" để AI tổng hợp thành chân dung KH.", "level": "Thông hiểu"}, {"num": 22, "question": "Phân tích ưu điểm nổi bật của AI trong nhóm công việc \"Sáng tạo nội dung\"?", "options": [{"letter": "A", "text": "Tạo nội dung nhanh, chi phí rẻ, sản xuất số lượng lớn và dễ dàng thử nghiệm A/B hàng loạt"}, {"letter": "B", "text": "Đảm bảo nội dung luôn có cảm xúc chân thật 100%"}, {"letter": "C", "text": "Không bao giờ mắc lỗi sai sót dữ liệu"}, {"letter": "D", "text": "Thay thế hoàn toàn tư duy chiến lược của con người"}], "answer": "A", "answerText": "Tạo nội dung nhanh, chi phí rẻ, sản xuất số lượng lớn và dễ dàng thử nghiệm A/B hàng loạt", "explanation": "Slide bài giảng chỉ rõ ưu điểm của AI trong sáng tạo nội dung: Tạo nhanh, rẻ, số lượng lớn, cá nhân hóa nội dung và hỗ trợ thử nghiệm A/B hàng loạt.", "level": "Thông hiểu"}, {"num": 23, "question": "Đâu là rào cản/thách thức lớn nhất khi doanh nghiệp lạm dụng AI để tạo nội dung tiếp thị mà thiếu sự kiểm duyệt của con người?", "options": [{"letter": "A", "text": "Tốc độ tạo bài quá chậm"}, {"letter": "B", "text": "Tốn kém quá nhiều ngân sách"}, {"letter": "C", "text": "Chất lượng không đồng đều, rủi ro đạo văn, nội dung thiếu cảm xúc và dễ sai lệch nếu dữ liệu đầu vào lỗi"}, {"letter": "D", "text": "Máy tính sẽ bị hỏng hóc phần cứng"}], "answer": "C", "answerText": "Chất lượng không đồng đều, rủi ro đạo văn, nội dung thiếu cảm xúc và dễ sai lệch nếu dữ liệu đầu vào lỗi", "explanation": "Slide nêu rõ các thách thức của AI content: Chất lượng không đồng đều, rủi ro đạo văn, thiếu cảm xúc và dữ liệu đầu vào sai dẫn đến nội dung sai.", "level": "Thông hiểu"}, {"num": 24, "question": "Điểm vượt trội của AI so với việc marketer tự lọc tiêu chí thủ công khi \"Xác định khách hàng mục tiêu\" là gì?", "options": [{"letter": "A", "text": "AI chỉ chọn khách hàng giàu có"}, {"letter": "B", "text": "AI có thể \"nhìn\" toàn bộ dữ liệu đại quạt để tự động phát hiện các nhóm khách hàng có mẫu hành vi tương đồng mà con người khó nhận thấy"}, {"letter": "C", "text": "AI tự động gọi điện thuyết phục khách hàng"}, {"letter": "D", "text": "AI không cần bất kỳ dữ liệu nào vẫn tìm được khách hàng"}], "answer": "B", "answerText": "AI có thể \"nhìn\" toàn bộ dữ liệu đại quạt để tự động phát hiện các nhóm khách hàng có mẫu hành vi tương đồng mà con người khó nhận thấy", "explanation": "Thay vì marketer phải tự nghĩ tiêu chí lọc thủ công (tuổi, giới tính...), AI có thể quét toàn bộ dữ liệu để phát hiện các nhóm khách hàng có hành vi, thói quen tương đồng ngầm.", "level": "Thông hiểu"}, {"num": 25, "question": "Trong chiến dịch \"A.I Ketchup\" của Heinz, thương hiệu đã ứng dụng AI vào nhóm hoạt động nào để kích thích sự chú ý của công chúng?", "options": [{"letter": "A", "text": "Tự động hóa gửi email chăm sóc"}, {"letter": "B", "text": "Sử dụng nh, cá nhân hóa real-time và hỗ trợ đa điểm chạm dựa trên AI/Data", "explanation": "Trải nghiệm khách hàng ngày nay được nâng cấp nhờ AI với các ứng dụng: Cá nhân hóa, khuyến nghị, hỗ trợ tự động, phân tích cảm xúc và tự động hóa hành trình.", "level": "Thông hiểu"}, {"num": 28, "question": "Trong mô hình 4P của Marketing (Product, Price, Place, Promotion), MarTech can thiệp vào những yếu tố nào?", "options": [{"letter": "A", "text": "Chỉ can thiệp vào Promotion"}, {"letter": "B", "text": "Chỉ can thiệp vào Price"}, {"letter": "C", "text": "Tác động và hỗ trợ cả 4 yếu tố (Product: phân tích nhu cầu; Price: giá linh hoạt; Place: kênh số; Promotion: tự động hóa quảng cáo)"}, {"letter": "D", "text": "Không can thiệp vào yếu tố nào"}], "answer": "C", "answerText": "Tác động và hỗ trợ cả 4 yếu tố (Product: phân tích nhu cầu; Price: giá linh hoạt; Place: kênh số; Promotion: tự động hóa quảng cáo)", "explanation": "MarTech ứng dụng vào toàn bộ mô hình 4P: tối ưu sản phẩm số, định giá linh hoạt bằng AI, phân phối đa kênh và quảng cáo cá nhân hóa.", "level": "Thông hiểu"}, {"num": 29, "question": "Vai trò của báo cáo đo lường trong MarTech giúp ích gì cho nhà quản lý?", "options": [{"letter": "A", "text": "Cung cấp báo cáo chính xác về ROMI, tỷ lệ chuyển đổi và hiệu suất chiến dịch theo thời gian thực để ra quyết định dựa trên dữ liệu"}, {"letter": "B", "text": "Thay thế hoàn toàn báo cáo tài chính thuế"}, {"letter": "C", "text": "Tự động sa thải nhân viên không đạt KPI"}, {"letter": "D", "text": "Đảm bảo 100% chiến dịch luôn có lãi mà không cần theo dõi"}], "answer": "A", "answerText": "Cung cấp báo cáo chính xác về ROMI, tỷ lệ chuyển đổi và hiệu suất chiến dịch theo thời gian thực để ra quyết định dựa trên dữ liệu", "explanation": "MarTech giúp cung cấp báo cáo chi tiết về chỉ số ROMI, tỷ lệ chuyển đổi và hiệu suất chiến dịch, hỗ trợ đo lường chính xác.", "level": "Thông hiểu"}, {"num": 30, "question": "Khi AI và tự động hóa phát triển mạnh mẽ, vị trí của Marketer con người sẽ dịch chuyển theo hướng nào?", "options": [{"letter": "A", "text": "Bị máy móc thay thế hoàn toàn 100%"}, {"letter": "B", "text": "Chuyển từ các tác vụ thủ công lặp đi lặp lại sang tập trung vào tư duy chiến lược, sáng tạo độc đáo, thấu hiểu cảm xúc và quản trị dữ liệu"}, {"letter": "C", "text": "Chuyển sang làm công việc lập trình phần cứng"}, {"letter": "D", "text": "Không có bất kỳ sự thay đổi nào"}], "answer": "B", "answerText": "Chuyển từ các tác vụ thủ công lặp đi lặp lại sang tập trung vào tư duy chiến lược, sáng tạo độc đáo, thấu hiểu cảm xúc và quản trị dữ liệu", "explanation": "AI đóng vai trò trợ lý tự động hóa tác vụ lặp lại, giải phóng con người để tập trung vào sáng tạo, thấu hiểu khách hàng và quyết định chiến lược. 🟠 PHẦN 3: MỨC ĐỘ VẬN DỤNG (10 CÂU - CĐR 2.1 & 2.2) Mục tiêu: Đánh giá khả năng áp dụng công cụ, tính toán chỉ số và xử lý kịch bản tình huống thực tế.", "level": "Thông hiểu"}, {"num": 31, "question": "Một chủ shop thời trang thực hiện các công việc: (1) Quay video mẫu mặc áo hoodie đăng lên TikTok; (2) Chạy quảng cáo TikTok Ads tăng view; (3) Dùng AI phân tích khung giờ có lượt xem cao nhất; (4) Dùng phần mềm tự động phân loại tệp xem trên 15 giây và gửi email tặng voucher 20%. Hoạt động nào thuộc phạm vi MarTech?", "options": [{"letter": "A", "text": "Hoạt động (1) và (2)"}, {"letter": "B", "text": "Hoạt động (3) và (4)"}, {"letter": "C", "text": "Tất cả 4 hoạt động"}, {"letter": "D", "text": "Không có hoạt động nào"}], "answer": "B", "answerText": "Hoạt động (3) và (4)", "explanation": "Bài giảng lấy đúng ví dụ này: Đăng video TikTok và chạy ads tăng view là Digital Marketing / AdTech; dùng AI phân tích dữ liệu giờ vàng, lọc tệp khách hàng sâu và tự động gửi email voucher hàng loạt là MarTech.", "level": "Vận dụng"}, {"num": 32, "question": "Doanh nghiệp bạn muốn xây dựng kịch bản tự động chăm sóc khách hàng: Khi khách hàng điền form nhận Ebook trên Landing Page -> Hệ thống tự lưu vào danh sách -> Tự gửi email cảm ơn kèm link tải -> Sau 3 ngày tự gửi email giới thiệu khóa học. Bạn cần kết nối nhóm công cụ MarTech nào?", "options": [{"letter": "A", "text": "CMS (Landing page) + CRM + Email Marketing / Marketing Automation"}, {"letter": "B", "text": "Kính thực tế ảo VR + Blockchain"}, {"letter": "C", "text": "Photoshop + Canva"}, {"letter": "D", "text": "Phần mềm kế toán Excel"}], "answer": "A", "answerText": "CMS (Landing page) + CRM + Email Marketing / Marketing Automation", "explanation": "Quy trình quản lý và nuôi dưỡng Lead đòi hỏi sự kết nối giữa CMS (thu thập form), CRM (lưu trữ thông tin) và Marketing Automation/Email Marketing (kích hoạt gửi chuỗi email tự động).", "level": "Vận dụng"}, {"num": 33, "question": "Nếu một chuỗi siêu thị điện máy muốn đồng bộ dữ liệu tồn kho, thông tin đơn hàng và thông tin khách hàng khi bán hàng song song tại Showroom offline và các sàn Shopee, Lazada, TikTok Shop, giải pháp MarTech nào là phù hợp nhất?", "options": [{"letter": "A", "text": "Nền tảng quản lý bán hàng tích hợp đa kênh (như Sapo, Haravan)"}, {"letter": "B", "text": "Phần mềm tạo ảnh AI DALL-E"}, {"letter": "C", "text": "Công cụ tìm kiếm Google Search"}, {"letter": "D", "text": "Chạy quảng cáo Bumper Ads 6 giây"}], "answer": "A", "answerText": "Nền tảng quản lý bán hàng tích hợp đa kênh (như Sapo, Haravan)", "explanation": "Slide minh họa Haravan/Sapo là nền tảng quản lý bán hàng đa kênh giúp đồng bộ dữ liệu đơn hàng, tồn kho và khách hàng từ offline đến online trên một hệ thống duy nhất.", "level": "Vận dụng"}, {"num": 34, "question": "Để tăng tỷ lệ mở email tiếp thị thêm 29% và tăng tỷ lệ nhấp (CTR) thêm 41% cho chiến dịch khuyến mãi mùa du lịch, giải pháp ứng dụng công nghệ nào nên được ưu tiên áp dụng?", "options": [{"letter": "A", "text": "Gửi 1 mẫu email giống hệt nhau cho toàn bộ danh sách 50.000 khách hàng"}, {"letter": "B", "text": "Tích hợp AI để phân tích lịch sử mua sắm/hành vi và tự động cá nhân hóa nội dung email cho từng nhóm khách hàng"}, {"letter": "C", "text": "Gửi email liên tục 10 lần mỗi ngày"}, {"letter": "D", "text": "Mua danh sách email không rõ nguồn gốc trên mạng"}], "answer": "B", "answerText": "Tích hợp AI để phân tích lịch sử mua sắm/hành vi và tự động cá nhân hóa nội dung email cho từng nhóm khách hàng", "explanation": "Dựa trên số liệu nghiên cứu của Experian trong bài giảng, email được AI cá nhân hóa nội dung dựa trên hành vi sẽ tăng 29% tỷ lệ mở và 41% CTR.", "level": "Vận dụng"}, {"num": 35, "question": "Một trung tâm ngoại ngữ chạy quảng cáo Facebook Ads nhưng nhận thấy chi phí nhấp chuột (CPC) cao mà tỷ lệ điền form thấp. Họ nên dùng công cụ AI nào để cải thiện nội dung quảng cáo nhanh chóng nhằm thử nghiệm A/B?", "options": [{"letter": "A", "text": "Dùng AI sáng tạo nội dung (Generative AI) để tạo hàng loạt biến thể thông điệp và hình ảnh cá nhân hóa để test phiên bản tối ưu"}, {"letter": "B", "text": "Dùng Chatbot tự động xóa bình luận của khách hàng"}, {"letter": "C", "text": "Ngừng toàn bộ hoạt động marketing"}, {"letter": "D", "text": "Tự viết tay 100 bài viết giống nhau"}], "answer": "A", "answerText": "Dùng AI sáng tạo nội dung (Generative AI) để tạo hàng loạt biến thể thông điệp và hình ảnh cá nhân hóa để test phiên bản tối ưu", "explanation": "Ưu điểm của AI trong sáng tạo nội dung là cho phép tạo bài nhanh, giá rẻ và hỗ trợ thử nghiệm A/B Testing hàng loạt để tìm ra quảng cáo hiệu quả nhất.", "level": "Vận dụng"}, {"num": 36, "question": "Doanh nghiệp phát hiện ra rằng nhân viên chăm sóc khách hàng mất quá nhiều thời gian để trả lời các câu hỏi lặp đi lặp lại như: \"Shop ở đâu?\", \"Giá sản phẩm bao nhiêu?\", \"Chính sách đổi trả thế nào?\". Giải pháp MarTech tự động hóa nào giải quyết triệt để vấn đề này?", "options": [{"letter": "A", "text": "Đặt quy trình gửi email thủ công"}, {"letter": "B", "text": "Triển khai Chatbot tự động (Button-based hoặc Keyword-based) trên Messenger/Website để tư vấn 24/77"}, {"letter": "C", "text": "Tắt tính năng nhắn tin của khách hàng"}, {"letter": "D", "text": "Thuê thêm 50 nhân viên trực ca đêm"}], "answer": "B", "answerText": "Triển khai Chatbot tự động (Button-based hoặc Keyword-based) trên Messenger/Website để tư vấn 24/77", "explanation": "Slide bài giảng đưa ví dụ các doanh nghiệp dùng Chatbot tự động tư vấn và giải đáp câu hỏi lặp lại, giúp giảm tải công việc và phản hồi tức thì 24/77.", "level": "Vận dụng"}, {"num": 37, "question": "Khi phân tích báo cáo chiến dịch tiếp thị số, Marketer nhận thấy lượt hiển thị (Impressions) là 100.000 lượt và số lượt nhấp (Clicks) là 5.000 lượt. Tỷ lệ CTR (Click-Through Rate) của chiến dịch là bao nhiêu?", "options": [{"letter": "A", "text": "2%"}, {"letter": "B", "text": "5%34"}, {"letter": "C", "text": "10%"}, {"letter": "D", "text": "20%"}], "answer": "B", "answerText": "5%34", "explanation": "Công thức tính CTR trong bài giảng: CTR = (Clicks / Impressions) × 100% = (5.000 / 100.000) × 100% = 5%34.", "level": "Vận dụng"}, {"num": 38, "question": "Một thương hiệu giày thể thao muốn phát hiện các nhóm khách hàng ngầm có thói quen chạy bộ vào buổi sáng sớm mà không cần hỏi khảo sát trực tiếp. Thương hiệu nên ứng dụng AI như thế nào?", "options": [{"letter": "A", "text": "Yêu cầu khách hàng gửi ảnh chụp đồng hồ báo thức"}, {"letter": "B", "text": "Cho AI phân tích \"dấu vết kỹ thuật số\" (thời gian truy cập app, dữ liệu định vị GPS, thời điểm tương tác bài viết) để tự động phân nhóm KH"}, {"letter": "C", "text": "Đoán ngẫu nhiên trên hệ thống"}, {"letter": "D", "text": "Chỉ phân loại theo độ tuổi và giới tính"}], "answer": "B", "answerText": "Cho AI phân tích \"dấu vết kỹ thuật số\" (thời gian truy cập app, dữ liệu định vị GPS, thời điểm tương tác bài viết) để tự động phân nhóm KH", "explanation": "AI có khả năng tổng hợp các vết hành vi (thời gian ở lại trang, thời điểm tương tác) để tự động nhận diện các nhóm đối tượng có thói quen tương đồng.", "level": "Vận dụng"}, {"num": 39, "question": "Để đo lường hiệu quả thực sự của một chiến dịch MarTech về mặt doanh thu thay vì chỉ nhìn vào số lượt Click ảo, Marketer cần theo dõi chỉ số nào sau đây?", "options": [{"letter": "A", "text": "Impressions"}, {"letter": "B", "text": "Tỷ lệ chuyển đổi (Conversion Rate) và ROMI (Return on Marketing Investment)"}, {"letter": "C", "text": "Tốc độ tải trang web"}, {"letter": "D", "text": "Số lượng bài viết đã đăng"}], "answer": "B", "answerText": "Tỷ lệ chuyển đổi (Conversion Rate) và ROMI (Return on Marketing Investment)", "explanation": "Báo cáo MarTech tập trung đo lường chính xác các thước đo hiệu suất kinh doanh cốt lõi như Tỷ lệ chuyển đổi và Lợi nhuận đầu tư tiếp thị ROMI.", "level": "Vận dụng"}, {"num": 40, "question": "Khi kết hợp AdTech và MarTech trong một chiến dịch, công cụ nào đóng vai trò \"thu hút khách hàng mới ở đầu phễu\" và công cụ nào đóng vai trò \"nuôi dưỡng giữ chân ở cuối phễu\"?", "options": [{"letter": "A", "text": "MarTech ở đầu phễu; AdTech ở cuối phễu"}, {"letter": "B", "text": "AdTech ở đầu phễu (chạy Ads tiếp cận); MarTech ở cuối phễu (CRM, Email nuôi dưỡng)"}, {"letter": "C", "text": "Cả hai đều chỉ dùng ở đầu phễu"}, {"letter": "D", "text": "Cả hai đều chỉ dùng ở cuối phễu"}], "answer": "B", "answerText": "AdTech ở đầu phễu (chạy Ads tiếp cận); MarTech ở cuối phễu (CRM, Email nuôi dưỡng)", "explanation": "AdTech giúp khởi tạo nhu cầu, thu hút khách hàng mới qua nền tảng quảng cáo; MarTech giúp quản lý dữ liệu, gửi email tự động nuôi dưỡng và chốt đơn. 🔴 PHẦN 4: MỨC ĐỘ VẬN DỤNG CAO (10 CÂU - CĐR 2.2 & 4.1) Mục tiêu: Đánh giá khả năng phân tích case study, đề xuất chiến lược tổng thể và giải quyết các bài toán MarTech phức tạp.", "level": "Vận dụng"}, {"num": 41, "question": "Phân tích Case Study Coca-Cola chiến dịch \"Từ cái tên, mình kết nối\" (2025): Việc thương hiệu in hơn 130 tên riêng trên lon, kết hợp Kiosk \"Tạo tên bạn thích\" tại 100 điểm trường học/siêu thị và khuyến khích Gen Z check-in chia sẻ lên TikTok thể hiện chiến lược MarTech xuất sắc nào?", "options": [{"letter": "A", "text": "Tiếp thị truyền thống cắt giảm ngân sách"}, {"letter": "B", "text": "Chiến lược cá nhân hóa bao bì kết hợp tương tác đa điểm chạm (Omnichannel) kích hoạt nội dung do người dùng tự tạo (UGC)"}, {"letter": "C", "text": "Bán hàng trực tiếp không qua trung gian"}, {"letter": "D", "text": "Tự động hóa sa thải đại lý phân phối"}], "answer": "B", "answerText": "Chiến lược cá nhân hóa bao bì kết hợp tương tác đa điểm chạm (Omnichannel) kích hoạt nội dung do người dùng tự tạo (UGC)", "explanation": "Case study Coca-Cola cho thấy sự kết hợp giữa cá nhân hóa (in tên), tương tác đa điểm chạm (kiosk offline -> chia sẻ TikTok online) nhằm tạo trải nghiệm đa tầng cho khách hàng mục tiêu Gen Z.", "level": "Vận dụng cao"}, {"num": 42, "question": "Trong chiến dịch Coca-Cola (2025), tại sao Gen Z (15-25 tuổi) lại được lựa chọn là nhóm khách hàng mục tiêu cốt lõi để thúc đẩy lan tỏa chiến dịch MarTech cá nhân hóa?", "options": [{"letter": "A", "text": "Vì Gen Z có thói quen dùng TikTok, ưa thích trải nghiệm cá nhân hóa, thích bắt trend và đóng vai trò làm lực lượng đẩy lan tỏa mạnh mẽ"}, {"letter": "B", "text": "Vì Gen Z không sử dụng điện thoại thông minh"}, {"letter": "C", "text": "Vì Gen Z chỉ mua hàng tại các chợ truyền thống"}, {"letter": "D", "text": "Vì Gen Z không quan tâm đến các dấu ấn cá nhân"}], "answer": "A", "answerText": "Vì Gen Z có thói quen dùng TikTok, ưa thích trải nghiệm cá nhân hóa, thích bắt trend và đóng vai trò làm lực lượng đẩy lan tỏa mạnh mẽ", "explanation": "Slide phân tích Gen Z là nhóm cốt lõi vì có thói quen dùng TikTok/Reels, thích cá nhân hóa, bắt trend, làm content review và đòi hỏi cao về trải nghiệm thương hiệu.", "level": "Vận dụng cao"}, {"num": 43, "question": "Đánh giá dự báo hành vi tương lai của khách hàng trong chiến dịch cá nhân hóa như Coca-Cola: Hành vi \"Khai phá offline -> Chia sẻ online -> Quay lại tiếp tục trải nghiệm\" được gọi là gì?", "options": [{"letter": "A", "text": "Tương tác đơn kênh đơn lẻ"}, {"letter": "B", "text": "Tương tác đa điểm chạm (Omnichannel) tạo trải nghiệm đa tầng"}, {"letter": "C", "text": "Quảng cáo truyền hình thụ động"}, {"letter": "D", "text": "Spam email hàng loạt"}], "answer": "B", "answerText": "Tương tác đa điểm chạm (Omnichannel) tạo trải nghiệm đa tầng", "explanation": "Bài giảng kết luận về tương tác đa điểm chạm: Người tiêu dùng tham gia kiosk offline tại trường học/siêu thị, đăng lên TikTok/Instagram online, rồi quay lại tiếp tục trải nghiệm mua sắm.", "level": "Vận dụng cao"}, {"num": 44, "question": "Một công ty E-commerce gặp tình trạng: Ngân sách quảng cáo AdTech tăng 50% nhưng doanh thu không tăng tương ứng do tỷ lệ khách hàng quay lại mua lần 2 rất thấp. Với vai trò tư vấn, bạn đề xuất chiến lược MarTech nào để khắc phục?", "options": [{"letter": "A", "text": "Tiếp tục tăng 100% ngân sách quảng cáo AdTech"}, {"letter": "B", "text": "Dồn nguồn lực triển khai hệ thống MarTech (CRM + Marketing Automation + Email cá nhân hóa) để nuôi dưỡng và tăng giá trị trọn đời (CLTV) của tệp KH cũ"}, {"letter": "C", "text": "Đóng cửa website và chỉ bán tại cửa hàng"}, {"letter": "D", "text": "Giảm giá sản phẩm xuống dưới giá vốn"}], "answer": "B", "answerText": "Dồn nguồn lực triển khai hệ thống MarTech (CRM + Marketing Automation + Email cá nhân hóa) để nuôi dưỡng và tăng giá trị trọn đời (CLTV) của tệp KH cũ", "explanation": "Khi AdTech kéo được khách mới nhưng tỷ lệ giữ chân thấp, doanh nghiệp bắt buộc phải dùng MarTech (CRM và Automation) để nuôi dưỡng, cá nhân hóa chăm sóc nhằm tăng tỷ lệ mua lặp lại và tối ưu CLTV.", "level": "Vận dụng cao"}, {"num": 45, "question": "Tại sao việc ứng dụng AI sáng tạo nội dung (Generative AI) mặc dù giúp sản xuất bài viết hàng loạt nhưng KHÔNG THỂ thay thế vai trò xây dựng chiến lược của Marketer con người?", "options": [{"letter": "A", "text": "Vì AI không thể gõ được tiếng Việt"}, {"letter": "B", "text": "Vì AI thiếu sự thấu hiểu đồng cảm sâu sắc về mặt cảm xúc, thiếu tư duy chiến lược độc đáo và dễ tạo ra thông điệp sai lệch nếu không có con người định hướng"}, {"letter": "C", "text": "Vì AI đắt tiền hơn chi phí thuê nhân sự"}, {"letter": "D", "text": "Vì các nền tảng mạng xã hội cấm hoàn toàn bài viết từ AI"}], "answer": "B", "answerText": "Vì AI thiếu sự thấu hiểu đồng cảm sâu sắc về mặt cảm xúc, thiếu tư tư chiến lược độc đáo và dễ tạo ra thông điệp sai lệch nếu không có con người định hướng", "explanation": "Bài giảng khẳng định AI chỉ là công cụ hỗ trợ \"trợ lý vô hình\", con người vẫn giữ vai trò quyết định trong việc sáng tạo cảm xúc, thấu hiểu insight sâu sắc và ra quyết định chiến lược.", "level": "Vận dụng cao"}, {"num": 46, "question": "Đề xuất giải pháp khắc phục nhược điểm \"Chất lượng không đồng đều và rủi ro dữ liệu sai\" khi sử dụng AI trong MarTech sáng tạo nội dung?", "options": [{"letter": "A", "text": "Cấm toàn bộ nhân viên sử dụng AI"}, {"letter": "B", "text": "Thiết lập quy trình: AI tạo bản thảo ban đầu -> Marketer kiểm duyệt, biên tập cảm xúc và xác minh độ chính xác của dữ liệu trước khi xuất bản"}, {"letter": "C", "text": "Cho AI tự động xuất bản trực tiếp lên mạng xã hội"}, {"letter": "D", "text": "Chỉ dùng AI để dịch thuật từ tiếng Anh"}], "answer": "B", "answerText": "Thiết lập quy trình: AI tạo bản thảo ban đầu -> Marketer kiểm duyệt, biên tập cảm xúc và xác minh độ chính xác của dữ liệu trước khi xuất bản", "explanation": "Thách thức của AI là rủi ro dữ liệu sai và thiếu cảm xúc, do đó giải pháp tối ưu là dùng AI như trợ lý tạo nháp, sau đó con người thực hiện kiểm duyệt, tinh chỉnh nội dung chuẩn xác.", "level": "Vận dụng cao"}, {"num": 47, "question": "Để một hệ thống MarTech Stack hoạt động hiệu quả trong doanh nghiệp, điều kiện tiên quyết về mặt dữ liệu giữa các phần mềm (CRM, CMS, AdTech, Email) là gì?", "options": [{"letter": "A", "text": "Mỗi phần mềm tự lưu trữ dữ liệu riêng biệt không kết nối"}, {"letter": "B", "text": "Dữ liệu phải được kết nối, chia sẻ và đồng bộ liền mạch giữa các công cụ để tạo thành dòng chảy thông tin thống nhất 360 độ"}, {"letter": "C", "text": "Xóa bỏ toàn bộ dữ liệu cũ hàng tuần"}, {"letter": "D", "text": "Chỉ nhập dữ liệu bằng tay vào cuối năm"}], "answer": "B", "answerText": "Dữ liệu phải được kết nối, chia sẻ và đồng bộ liền mạch giữa các công cụ để tạo thành dòng chảy thông tin thống nhất 360 độ", "explanation": "Giá trị của MarTech Stack nằm ở sự kết nối liền mạch: Dữ liệu từ AdTech/CMS chuyển vào CRM, kích hoạt Marketing Automation để tạo ra hành trình trải nghiệm nhất quán.", "level": "Vận dụng cao"}, {"num": 48, "question": "Giả sử bạn là Giám đốc Marketing (CMO), khi hội đồng quản trị hỏi: \"Tại sao chúng ta phải đầu tư ngân sách lớn cho hệ thống MarTech?\", luận điểm nào sau đây có sức thuyết phục cao nhất?", "options": [{"letter": "A", "text": "Vì các đối thủ đều mua nên chúng ta phải mua theo"}, {"letter": "B", "text": "MarTech giúp tự động hóa vận hành, tối ưu chi phí quảng cáo real-time, cá nhân hóa trải nghiệm quy mô lớn và cung cấp báo cáo ROMI chính xác để tăng trưởng doanh thu bền vững"}, {"letter": "C", "text": "Vì dùng MarTech sẽ không bao giờ phải chạy quảng cáo nữa"}, {"letter": "D", "text": "Vì MarTech giúp công ty không cần làm sản phẩm chất lượng nữa"}], "answer": "B", "answerText": "MarTech giúp tự động hóa vận hành, tối ưu chi phí quảng cáo real-time, cá nhân hóa trải nghiệm quy mô lớn và cung cấp báo cáo ROMI chính xác để tăng trưởng doanh thu bền vững", "explanation": "Luận điểm tổng hợp đầy đủ các giá trị chiến lược của MarTech đã được chứng minh trong bài giảng: Năng suất tự động hóa, cá nhân hóa sâu sắc, ra quyết định dựa trên dữ liệu và tối ưu ROI.", "level": "Vận dụng cao"}, {"num": 49, "question": "Một thương hiệu chuỗi nhà hàng nhận thấy khách hàng Gen Z thường xuyên quét mã QR tại bàn để xem menu nhưng tỷ lệ đánh giá phản hồi rất thấp. Đề xuất giải pháp MarTech ứng dụng AI để cải thiện?", "options": [{"letter": "A", "text": "Tắt mã QR và dùng menu giấy"}, {"letter": "B", "text": "Tích hợp Chatbot AI cá nhân hóa ngay trên trang menu số, tự động gợi ý món theo thời tiết/sở thích và tặng ngay mã giảm giá món tráng miệng nếu khách gửi phản hồi"}, {"letter": "C", "text": "Nhân viên đứng tạo áp lực yêu cầu khách đánh giá"}, {"letter": "D", "text": "Gửi thư tay đến nhà từng khách hàng sau 1 tháng"}], "answer": "B", "answerText": "Tích hợp Chatbot AI cá nhân hóa ngay trên trang menu số, tự động gợi ý món theo thời tiết/sở thích và tặng ngay mã giảm giá món tráng miệng nếu khách gửi phản hồi", "explanation": "Giải pháp phối hợp giữa Chatbot tự động, gợi ý cá nhân hóa và kích thích ưu đãi thời gian thực ngay trên điểm chạm số sẽ tối ưu hóa trải nghiệm và thu thập dữ liệu khách hàng hiệu quả.", "level": "Vận dụng cao"}, {"num": 50, "question": "Đánh giá tổng thể vai trò của Công nghệ Marketing (MarTech) đối với sự phát triển lâu dài của doanh nghiệp trong kỷ nguyên số?", "options": [{"letter": "A", "text": "MarTech chỉ là công cụ hỗ trợ ngắn hạn cho các chiến dịch giảm giá"}, {"letter": "B", "text": "MarTech là một chiến lược kinh doanh cốt lõi giúp doanh nghiệp xây dựng năng lực cạnh tranh bằng dữ liệu, tối ưu hóa quy trình và tạo dựng mối quan hệ bền chặt với khách hàng"}, {"letter": "C", "text": "MarTech sẽ làm giảm hoàn toàn vai trò của sáng tạo nghệ thuật"}, {"letter": "D", "text": "MarTech chỉ phù hợp với các công ty công nghệ phần mềm"}], "answer": "B", "answerText": "MarTech là một chiến lược kinh doanh cốt lõi giúp doanh nghiệp xây dựng năng lực cạnh tranh bằng dữ liệu, tối ưu hóa quy trình và tạo dựng mối quan hệ bền chặt với khách hàng", "explanation": "Kết luận trong slide khẳng định: Marketing Stack / MarTech không chỉ là một khoản đầu tư công nghệ đơn thuần, mà là một chiến lược kinh doanh cốt lõi giúp doanh nghiệp giải quyết thách thức và tăng trưởng.", "level": "Vận dụng cao"}]}, {"id": 2, "title": "MarTech Stack & Các Công cụ Cốt lõi", "theory": ["Marketing Stack: Là một hệ thống tập hợp các công nghệ kỹ thuật số nhằm giải quyết các thách thức của doanh nghiệp, kết nối toàn bộ hành trình khách hàng từ thu hút, nuôi dưỡng, chuyển đổi đến giữ chân.", "Các thành phần cốt lõi trong Stack:", "AdTech: Tiếp cận khách hàng mới, chạy quảng cáo và nhắm mục tiêu.", "CMS (Content Management System): Quản lý, khởi tạo và xuất bản nội dung.", "CRM (Customer Relationship Management): Quản lý dữ liệu và mối quan hệ khách hàng 360 độ.", "Email Marketing: Kênh tiếp thị trực tiếp, kết nối dữ liệu từ CMS và CRM để nuôi dưỡng leads.", "Phân loại CRM:", "Operational CRM (CRM Vận hành): Tự động hóa tiếp thị, bán hàng và dịch vụ khách hàng.", "Analytical CRM (CRM Phân tích): Khai thác dữ liệu, phân tích hành vi và dự báo.", "Collaborative CRM (CRM Tương tác): Quản lý điểm chạm đa kênh và chia sẻ dữ liệu nội bộ giữa Marketing - Sales - Service."], "qa": [{"num": 1, "question": "Marketing Stack là gì? Giải thích tại sao Marketing Stack không nên được hiểu đơn giản là việc doanh nghiệp sử dụng nhiều công cụ marketing khác nhau.", "answer": ["Khái niệm: Marketing Stack là hệ thống các công nghệ kỹ thuật số tích hợp dùng để quản lý và tối ưu hóa các hoạt động tiếp thị xuyên suốt hành trình khách hàng.", "Giải thích: Marketing Stack không chỉ là sự gom góp đơn thuần các công cụ rời rạc, mà là một hệ sinh thái có sự kết nối và dòng chảy dữ liệu liền mạch giữa các công cụ để phục vụ một chiến lược kinh doanh thống nhất."]}, {"num": 2, "question": "Trình bày vai trò của các nhóm công cụ sau trong một Marketing Stack: AdTech, CMS, CRM, Email Marketing. Theo bạn, tại sao các công cụ này cần được kết nối với nhau?", "answer": ["AdTech: Thu hút khách hàng mới và tái tiếp thị qua các nền tảng quảng cáo.", "CMS: Tạo, quản lý và xuất bản nội dung số trên website/landing page.", "CRM: Nền tảng dữ liệu cốt lõi lưu trữ thông tin khách hàng 360 độ.", "Email Marketing: Kênh giao tiếp trực tiếp và tự động nuôi dưỡng tệp đăng ký.", "Lý do cần kết nối: Để dữ liệu chảy liên tục — thông tin từ AdTech/CMS thu được sẽ đổ về CRM phân loại, sau đó kích hoạt Email Marketing gửi đúng thông điệp cá nhân hóa."]}, {"num": 3, "question": "Hãy mô tả một quy trình quản lý và nuôi dưỡng khách hàng tiềm năng bằng Marketing Stack, từ lúc khách hàng điền thông tin trên website cho đến khi thông tin được chuyển cho bộ phận Sales.", "answer": ["Quy trình 5 bước: (1) Khách hàng điền thông tin vào form đăng ký trên Landing Page (CMS) -> (2) Thông tin tự động ghi nhận vào hệ thống CRM -> (3) Hệ thống Marketing Automation phân khúc và chấm điểm (Lead Scoring) dựa trên hành vi tương tác -> (4) Kích hoạt chuỗi Email Marketing tự động chăm sóc -> (5) Khi điểm Lead vượt ngưỡng quy định (\"lead đủ ấm\"), CRM tự động thông báo và chuyển giao thông tin sang bộ phận Sales chốt đơn."]}, {"num": 4, "question": "AdTech là gì? Trình bày bốn vai trò chính của AdTech: Targeting, Automation, Measurement, Personalization.", "answer": ["Khái niệm: AdTech là hệ thống công cụ/phần mềm hỗ trợ mua bán, phân phối và quản lý quảng cáo kỹ thuật số.", "Targeting: Tiếp cận đúng đối tượng dựa trên nhân khẩu học, sở thích, hành vi.", "Automation: Đấu giá và phân phối quảng cáo tự động trong mili giây (Programmatic).", "Measurement: Đo lường chi tiết hiệu quả chiến dịch qua các chỉ số.", "Personalization: Hiển thị nội dung quảng cáo \"đúng gu\" từng cá nhân nhờ AI."]}, {"num": 5, "question": "Trình bày ý nghĩa của các chỉ số sau trong đánh giá quảng cáo: Impressions, Clicks, CTR, Conversions, CPA, ROAS. Theo bạn, tại sao không nên đánh giá một chiến dịch quảng cáo chỉ dựa trên số lượt click?", "answer": ["Impressions: Số lượt quảng cáo hiển thị.", "Clicks: Số lượt nhấp vào quảng cáo.", "CTR: Tỷ lệ nhấp chuột (Clicks / Impressions).", "Conversions: Số lượt hoàn thành hành động mục tiêu (mua hàng, điền form).", "CPA: Chi phí cho mỗi lượt chuyển đổi.", "ROAS: Lợi nhuận thu được trên chi phí quảng cáo.", "Lý do không chỉ dựa vào Clicks: Lượt click chỉ phản ánh mức độ tò mò ban đầu, không đảm bảo khách hàng mua hàng (nguy cơ click ảo, bot, hoặc landing page không chất lượng dẫn đến rớt đơn)."]}, {"num": 6, "question": "CMS là gì? Trình bày vai trò của CMS đối với marketer và giải thích chức năng của ba thành phần: CMS Core, Themes/Templates, Plugins/Extensions.", "answer": ["Khái niệm: CMS là hệ thống quản lý nội dung số cho phép tạo, chỉnh sửa và đăng tải nội dung web mà không cần biết lập trình.", "Vai trò: Trao quyền tự chủ cho marketer, tăng tốc độ triển khai và tập trung vào nội dung.", "CMS Core: Phần lõi xử lý quản lý cơ sở dữ liệu và lưu trữ nội dung.", "Themes/Templates: Giao diện hiển thị trực quan của website.", "Plugins/Extensions: Tiện ích mở rộng thêm tính năng (SEO, bảo mật, form)."]}, {"num": 7, "question": "Một nội dung marketing hiệu quả cần xem xét những thành phần nào? Hãy trình bày ngắn gọn các yếu tố: Thông tin - Mục đích - Khán giả - Kênh phân phối - Hình thức.", "answer": ["Thông tin: Ý tưởng và thông điệp cốt lõi truyền tải.", "Mục đích: Mục tiêu rõ ràng (tăng doanh thu, giáo dục, SEO, nhận diện).", "Khán giả: Phân tích đối tượng tiếp nhận (nhân khẩu học, niềm tin, lối sống).", "Kênh phân phối: Nơi phát hành nội dung (Website, Facebook, TikTok).", "Hình thức: Định dạng thể hiện (bài viết, video, infographic, hình ảnh)."]}, {"num": 8, "question": "CRM là gì? Phân biệt ba loại CRM: Operational CRM, Analytical CRM, Collaborative CRM. Hãy đưa ra một ví dụ đơn giản cho mỗi loại.", "answer": ["Khái niệm: CRM là chiến lược và phần mềm quản lý toàn bộ tương tác và mối quan hệ với khách hàng.", "Operational CRM: Tự động hóa các quy trình bán hàng, marketing và CSKH. VD: Phần mềm tự gửi email báo giá khi khách hàng yêu cầu.", "Analytical CRM: Phân tích dữ liệu để hiểu chân dung và xu hướng khách hàng. VD: Khai thác lịch sử mua để dự báo dòng sản phẩm bán chạy.", "Collaborative CRM: Đồng bộ thông tin giữa các phòng ban (Sales, Marketing, Service). VD: Nhân viên CSKH xem được lịch sử email tiếp thị mà Marketing đã gửi cho khách hàng."]}, {"num": 9, "question": "Trình bày những lợi ích và thách thức chính khi triển khai CRM. Theo bạn, tại sao việc mua một phần mềm CRM tốt chưa chắc đảm bảo dự án CRM thành công?", "answer": ["Lợi ích: Cải thiện CX, tăng doanh số/lợi nhuận, tạo góc nhìn 360 độ về khách hàng.", "Thách thức: Chi phí đầu tư cao, khó khăn tích hợp hệ thống cũ, rào cản thích ứng của nhân sự.", "Giải thích: CRM là một triết lý kinh doanh chứ không chỉ là phần mềm. Nếu quy trình doanh nghiệp yếu, dữ liệu đầu vào \"rác\" hoặc nhân viên không được đào tạo và tuân thủ sử dụng thì phần mềm dù đắt tiền cũng thất bại."]}, {"num": 10, "question": "Email Marketing là gì? Trình bày: Vai trò của Email Marketing trong Marketing Stack; Một số hình thức Email Marketing phổ biến; Lợi ích của Email Marketing; Mối quan hệ giữa Email Marketing với CRM, CMS và Marketing Automation.", "answer": ["Khái niệm: Chiến lược gửi thư điện tử trực tiếp đến nhóm đối tượng mục tiêu nhằm đạt mục tiêu kinh doanh.", "Vai trò trong Stack: Trung tâm kết nối nhận và cung cấp dữ liệu dòng chảy liền mạch.", "Hình thức phổ biến: Email chào mừng, Email bán hàng, Email tin tức (Newsletter).", "Lợi ích: Hỗ trợ phễu marketing, tối ưu chi phí, thống kê đo lường chi tiết, đúng đối tượng.", "Mối quan hệ: Lấy danh sách phân khúc từ CRM, dẫn người dùng về trang đích trên CMS, và được vận hành tự động theo kịch bản bởi Marketing Automation."]}], "quiz": [{"num": 1, "question": "Theo Martino Saracino (2023), \"Marketing Tech Stack\" được định nghĩa là gì?", "options": [{"letter": "A", "text": "Một phần mềm đơn lẻ dùng để chỉnh sửa video ngắn"}, {"letter": "B", "text": "Một hệ thống sử dụng các công nghệ kỹ thuật số hiện đại để giải quyết các thách thức mà các giám đốc marketing phải đối mặt"}, {"letter": "C", "text": "Một trang web thương mại điện tử chuyên bán thiết bị phần cứng"}, {"letter": "D", "text": "Tập hợp các hợp đồng quảng cáo truyền hình truyền thống"}], "answer": "B", "answerText": "Một hệ thống sử dụng các công nghệ kỹ thuật số hiện đại để giải quyết các thách thức mà các giám đốc marketing phải đối mặt", "explanation": "Trích dẫn slide bài giảng Chương 2.1: Saracino (2023) định nghĩa Marketing tech stack là hệ thống sử dụng các công nghệ kỹ thuật số hiện đại nhằm giải quyết các thách thức như hiệu quả thấp trong quy trình, thông điệp không nhất quán và thiếu minh bạch về đóng góp của marketing vào doanh thu.", "level": "Nhận biết"}, {"num": 2, "question": "Marketing Stack hỗ trợ các công nghệ cho những giai đoạn nào trong quy trình marketing?", "options": [{"letter": "A", "text": "Chỉ hỗ trợ giai đoạn bán hàng trực tiếp tại quầy"}, {"letter": "B", "text": "Thu hút khách hàng tiềm năng, nuôi dưỡng, chuyển đổi thành khách hàng, đến giữ chân và xây dựng mối quan hệ lâu dài"}, {"letter": "C", "text": "Chỉ phục vụ việc đăng bài tuyển dụng nhân sự"}, {"letter": "D", "text": "Chỉ kiểm soát việc sản xuất hàng hóa trong kho"}], "answer": "B", "answerText": "Thu hút khách hàng tiềm năng, nuôi dưỡng, chuyển đổi thành khách hàng, đến giữ chân và xây dựng mối quan hệ lâu dài", "explanation": "Bài giảng nêu rõ Marketing stack bao gồm các công nghệ hỗ trợ cho tất cả các giai đoạn: thu hút leads, nuôi dưỡng, chuyển đổi, đến giữ chân và tạo gắn kết lâu dài.", "level": "Nhận biết"}, {"num": 3, "question": "Những đối tượng nào trong doanh nghiệp tương tác và sử dụng dữ liệu từ Marketing Stack?", "options": [{"letter": "A", "text": "Chỉ duy nhất lập trình viên IT"}, {"letter": "B", "text": "Đội ngũ Marketing, bộ phận Vận hành Marketing (MOPs), Sales và Chăm sóc khách hàng (Customer Service)"}, {"letter": "C", "text": "Chỉ có phòng kế toán"}, {"letter": "D", "text": "Ban bảo vệ và bộ phận thu mua vật tư"}], "answer": "B", "answerText": "Đội ngũ Marketing, bộ phận Vận hành Marketing (MOPs), Sales và Chăm sóc khách hàng (Customer Service)", "explanation": "Bài giảng liệt kê các bên tham gia sử dụng Marketing Stack gồm: Đội ngũ Marketing, Marketing Operations (MOPs), cùng các phòng ban liên quan như Sales và Customer Service.", "level": "Nhận biết"}, {"num": 4, "question": "Khái niệm \"AdTech\" (Advertising Technology) được hiểu là gì?", "options": [{"letter": "A", "text": "Phần mềm soạn thảo văn bản dành cho nhân viên văn phòng"}, {"letter": "B", "text": "Các công cụ, phần mềm, hệ thống giúp chúng ta chạy, quản lý, phân phối, nhắm mục tiêu và đo lường các chiến dịch quảng cáo kỹ thuật số"}, {"letter": "C", "text": "Công cụ lưu trữ sổ sách kế toán thuế"}, {"letter": "D", "text": "Thiết bị quay phim quảng cáo chuyên dụng"}], "answer": "B", "answerText": "Các công cụ, phần mềm, hệ thống giúp chúng ta chạy, quản lý, phân phối, nhắm mục tiêu và đo lường các chiến dịch quảng cáo kỹ thuật số", "explanation": "Slide bài giảng Chương 2.2 định nghĩa AdTech là các công cụ, phần mềm, hệ thống giúp marketer lập kế hoạch, triển khai, đo lường và tối ưu hóa các chiến dịch quảng cáo trên Internet.", "level": "Nhận biết"}, {"num": 5, "question": "Bốn vai trò chính của AdTech được nhấn mạnh trong bài giảng bao gồm những yếu tố nào?", "options": [{"letter": "A", "text": "In ấn - Phát tờ rơi - Tổ chức sự kiện - Tài trợ"}, {"letter": "B", "text": "Tiếp cận đúng người (Targeting) - Tự động hóa (Automation) - Đo lường chi tiết (Measurement) - Cá nhân hóa (Personalization)"}, {"letter": "C", "text": "Thu thuế - Kế toán - Kiểm toán - Báo cáo tài chính"}, {"letter": "D", "text": "Lập trình core - Thiết kế chip - Lắp ráp máy tính - Bảo hành"}], "answer": "B", "answerText": "Tiếp cận đúng người (Targeting) - Tự động hóa (Automation) - Đo lường chi tiết (Measurement) - Cá nhân hóa (Personalization)", "explanation": "Slide Chương 2.2 nêu rõ 4 vai trò chính của AdTech là: Targeting, Automation, Measurement và Personalization.", "level": "Nhận biết"}, {"num": 6, "question": "Trong AdTech, chỉ số CTR (Click-Through Rate) được tính bằng công thức nào?", "options": [{"letter": "A", "text": "CTR = Impressions / Clicks"}, {"letter": "B", "text": "CTR = (Clicks / Impressions) × 100%"}, {"letter": "C", "text": "CTR = Conversions / CPA"}, {"letter": "D", "text": "CTR = ROAS × Chi phí quảng cáo"}], "answer": "B", "answerText": "CTR = (Clicks / Impressions) × 100%", "explanation": "Theo slide bài giảng, CTR (Click-Through Rate) là tỷ lệ nhấp chuột, được tính bằng công thức: CTR = (Clicks / Impressions) × 100%7.", "level": "Nhận biết"}, {"num": 7, "question": "Định dạng Bumper Ads trên nền tảng YouTube Ads có đặc điểm cốt lõi nào?", "options": [{"letter": "A", "text": "Video dài 30 phút có thể bỏ qua"}, {"letter": "B", "text": "Video ngắn 6 giây, người xem không thể bỏ qua (non-skippable), dùng để tăng nhận diện thương hiệu nhanh chóng"}, {"letter": "C", "text": "Bài viết hiển thị dạng văn bản trên trang chủ"}, {"letter": "D", "text": "Quảng cáo tự động gửi vào email khách hàng"}], "answer": "B", "answerText": "Video ngắn 6 giây, người xem không thể bỏ qua (non-skippable), dùng để tăng nhận diện thương hiệu nhanh chóng", "explanation": "Slide phân loại YouTube Ads định nghĩa Bumper Ads là dạng video ngắn 6 giây, không thể bỏ qua, giúp tăng nhận diện thương hiệu nhanh chóng.", "level": "Nhận biết"}, {"num": 8, "question": "Hệ thống quản lý nội dung (CMS - Content Management System) được ví như công cụ nào để Marketer dễ hình dung?", "options": [{"letter": "A", "text": "Trình phát nhạc Spotify"}, {"letter": "B", "text": "Một ứng dụng soạn thảo văn bản (như Microsoft Word) nhưng dành cho việc quản lý và đăng tải nội dung trên website"}, {"letter": "C", "text": "Máy tính bỏ túi Casio"}, {"letter": "D", "text": "Phần mềm diệt virus máy tính"}], "answer": "B", "answerText": "Một ứng dụng soạn thảo văn bản (như Microsoft Word) nhưng dành cho việc quản lý và đăng tải nội dung trên website", "explanation": "Slide Chương 2.3 ví CMS như một ứng dụng soạn thảo văn bản (như Microsoft Word) dành cho website, giúp Marketers gõ chữ, chèn ảnh, định dạng mà không cần kiến thức lập trình.", "level": "Nhận biết"}, {"num": 9, "question": "Cấu trúc nền tảng của một hệ thống CMS cơ bản bao gồm 3 thành phần chính nào?", "options": [{"letter": "A", "text": "Bàn phím - Màn hình - Chuột máy tính"}, {"letter": "B", "text": "Cơ sở dữ liệu (Database) - Lõi CMS (Core CMS Files) - Giao diện (Themes/Templates) & Tiện ích (Plugins/Extensions)"}, {"letter": "C", "text": "Ngân hàng - Kho hàng - Đơn vị vận chuyển"}, {"letter": "D", "text": "Facebook - Instagram - TikTok"}], "answer": "B", "answerText": "Cơ sở dữ liệu (Database) - Lõi CMS (Core CMS Files) - Giao diện (Themes/Templates) & Tiện ích (Plugins/Extensions)", "explanation": "Slide bài giảng Chương 2.3 liệt kê 3 thành phần chính hợp thành CMS: Database, Core CMS Files, cùng Themes/Templates & Plugins/Extensions.", "level": "Nhận biết"}, {"num": 10, "question": "Mục tiêu cốt lõi của hệ thống Quản trị quan hệ khách hàng (CRM) là gì?", "options": [{"letter": "A", "text": "Tự động sa thải nhân viên không đạt doanh số"}, {"letter": "B", "text": "Nâng cao sự hài lòng, lòng trung thành và giá trị trọn đời của khách hàng (Customer Lifetime Value - CLTV)"}, {"letter": "C", "text": "Giảm giá bán sản phẩm xuống thấp nhất thị trường"}, {"letter": "D", "text": "Thay thế hoàn toàn bộ phận IT của doanh nghiệp"}], "answer": "B", "answerText": "Nâng cao sự hài lòng, lòng trung thành và giá trị trọn đời của khách hàng (Customer Lifetime Value - CLTV)", "explanation": "Slide Chương 2.4 khẳng định CRM là chiến lược toàn diện có mục tiêu cốt lõi: nâng cao sự hài lòng, lòng trung thành và CLTV.", "level": "Nhận biết"}, {"num": 11, "question": "Ba loại dữ liệu khách hàng cốt lõi được lưu trữ và quản lý trong hệ thống CRM bao gồm?", "options": [{"letter": "A", "text": "Dữ liệu tài chính quốc gia - Dữ liệu thời tiết - Dữ liệu giao thông"}, {"letter": "B", "text": "Dữ liệu nhân khẩu học - Dữ liệu tương tác - Dữ liệu hành vi"}, {"letter": "C", "text": "Dữ liệu mã nguồn - Dữ liệu phần cứng - Dữ liệu mạng Internet"}, {"letter": "D", "text": "Dữ liệu nhà cung cấp - Dữ liệu đối thủ - Dữ liệu vận tải"}], "answer": "B", "answerText": "Dữ liệu nhân khẩu học - Dữ liệu tương tác - Dữ liệu hành vi", "explanation": "Bài giảng nêu rõ 3 loại dữ liệu khách hàng trong CRM: Dữ liệu nhân khẩu học (tên, tuổi...), Dữ liệu tương tác (lịch sử mua, email đã mở, cuộc gọi...), và Dữ liệu hành vi (sở thích, thói quen).", "level": "Nhận biết"}, {"num": 12, "question": "Hệ thống CRM được phân loại phổ biến thành 3 nhóm chức năng nào?", "options": [{"letter": "A", "text": "Marketing CRM - Sales CRM - Service CRM"}, {"letter": "B", "text": "Operational CRM (Vận hành) - Analytical CRM (Phân tích) - Collaborative CRM (Tương tác/Cộng tác)"}, {"letter": "C", "text": "Online CRM - Offline CRM - Hybrid CRM"}, {"letter": "D", "text": "Free CRM - Paid CRM - Enterprise CRM"}], "answer": "B", "answerText": "Operational CRM (Vận hành) - Analytical CRM (Phân tích) - Collaborative CRM (Tương tác/Cộng tác)", "explanation": "Bài giảng phân loại CRM thành 3 loại chính: Operational CRM, Analytical CRM, và Collaborative CRM.", "level": "Nhận biết"}, {"num": 13, "question": "Bộ ba nhà cung cấp giải pháp phần mềm CRM hàng đầu thế giới được đề cập trong bài giảng bao gồm những tên tuổi nào?", "options": [{"letter": "A", "text": "Google - Facebook - Apple"}, {"letter": "B", "text": "Salesforce - HubSpot - Microsoft Dynamics 365"}, {"letter": "C", "text": "Shopee - Lazada - Tiki"}, {"letter": "D", "text": "Canva - Photoshop - Illustrator"}], "answer": "B", "answerText": "Salesforce - HubSpot - Microsoft Dynamics 365", "explanation": "Slide Chương 2.4 liệt kê 3 nhà cung cấp CRM hàng đầu: Salesforce (dẫn đầu thị trường đám mây), HubSpot (All-in-one thân thiện), và Microsoft Dynamics 365 (tích hợp hệ sinh thái Microsoft).", "level": "Nhận biết"}, {"num": 14, "question": "Theo Simms Jenkins (2009), Email Marketing được định nghĩa như thế nào?", "options": [{"letter": "A", "text": "Là việc gửi tin nhắn rác ngẫu nhiên đến mọi tài khoản điện tử"}, {"letter": "B", "text": "Nền tảng truyền thông độc đáo, kết hợp giữa nghệ thuật và khoa học, mang lại giá trị cho hộp thư đến của người đăng ký"}, {"letter": "C", "text": "Công cụ chuyên dùng để lưu trữ file tài liệu nặng"}, {"letter": "D", "text": "Hình thức gọi điện thoại tư vấn trực tiếp"}], "answer": "B", "answerText": "Nền tảng truyền thông độc đáo, kết hợp giữa nghệ thuật và khoa học, mang lại giá trị cho hộp thư đến của người đăng ký", "explanation": "Slide Chương 2.5 trích dẫn câu nói của Simms Jenkins (2009): \"Marketing qua email là một nền tảng truyền thông độc đáo, kết hợp giữa nghệ thuật và khoa học, đồng thời mang lại giá trị cho hộp thư đến của người đăng ký\"19.", "level": "Nhận biết"}, {"num": 15, "question": "Vai trò cốt lõi của Email Marketing trong sơ đồ Marketing Stack được xác định là gì?", "options": [{"letter": "A", "text": "Là kênh quảng cáo hiển thị ngoài"}, {"letter": "B", "text": "Trung tâm kết nối (kết nối dữ liệu hai chiều với CRM, CMS và Marketing Automation)"}, {"letter": "C", "text": "Công cụ thiết kế giao diện website"}, {"letter": "D", "text": "Nền tảng lưu trữ cơ sở dữ liệu thô"}], "answer": "B", "answerText": "Trung tâm kết nối (kết nối dữ liệu hai chiều với CRM, CMS và Marketing Automation)", "explanation": "Slide khẳng định Email Marketing đóng vai trò là \"Trung tâm kết nối\" trong Marketing Stack, nhận dữ liệu từ CRM/CMS và cung cấp dữ liệu ngược lại tạo thành dòng chảy thông tin liền mạch. 🟡 PHẦN 2: MỨC ĐỘ THÔNG HIỂU (15 CÂU - CĐR 2.1) Mục tiêu: Đánh giá khả năng phân biệt, so sánh bản chất và giải thích luồng chảy dữ liệu giữa các công cụ trong Marketing Stack.", "level": "Nhận biết"}, {"num": 16, "question": "Điểm khác biệt bản chất nhất về trọng tâm hoạt động giữa AdTech và MarTech là gì?", "options": [{"letter": "A", "text": "AdTech chỉ dùng cho email; MarTech chỉ dùng cho website"}, {"letter": "B", "text": "AdTech tập trung vào việc MUA không gian quảng cáo và thu hút KH tiềm năng ở kênh trả phí; MarTech tập trung vào việc QUẢN LÝ mối quan hệ KH, nuôi dưỡng và duy trì các kênh thuộc sở hữu doanh nghiệp"}, {"letter": "C", "text": "AdTech không cần dữ liệu; MarTech bắt buộc cần dữ liệu"}, {"letter": "D", "text": "AdTech miễn phí; MarTech tốn chi phí rất cao"}], "answer": "B", "answerText": "AdTech tập trung vào vi
