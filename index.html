ệc MUA không gian quảng cáo và thu hút KH tiềm năng ở kênh trả phí; MarTech tập trung vào việc QUẢN LÝ mối quan hệ KH, nuôi dưỡng và duy trì các kênh thuộc sở hữu doanh nghiệp", "explanation": "Slide phân biệt nêu rõ: AdTech tập trung vào mua không gian quảng cáo và phân phối quảng cáo trên kênh trả phí; MarTech bao gồm công cụ quản lý hoạt động marketing thuộc sở hữu của doanh nghiệp (CRM, Email, CMS...).", "level": "Thông hiểu"}, {"num": 17, "question": "Tại sao Marketing Stack KHÔNG NÊN được hiểu đơn giản là việc doanh nghiệp mua thật nhiều phần mềm marketing khác nhau?", "options": [{"letter": "A", "text": "Vì mua nhiều phần mềm sẽ làm máy tính bị chậm"}, {"letter": "B", "text": "Vì nếu các phần mềm hoạt động rời rạc, không được tích hợp và kết nối dữ liệu liền mạch thì sẽ gây ra lãng phí, dữ liệu bị phân mảnh và thông điệp không nhất quán"}, {"letter": "C", "text": "Vì các công ty phần mềm cấm sử dụng nhiều ứng dụng cùng lúc"}, {"letter": "D", "text": "Vì doanh nghiệp chỉ cần 1 công cụ Excel là đủ xử lý mọi việc"}], "answer": "B", "answerText": "Vì nếu các phần mềm hoạt động rời rạc, không được tích hợp và kết nối dữ liệu liền mạch thì sẽ gây ra lãng phí, dữ liệu bị phân mảnh và thông điệp không nhất quán", "explanation": "Đặt vấn đề trong bài giảng chỉ ra rằng Marketing Stack là một hệ sinh thái tích hợp. Nếu chỉ mua nhiều công cụ rời rạc mà không kết nối dòng chảy dữ liệu thì doanh nghiệp sẽ đối mặt với sự kém hiệu quả và thông điệp thiếu nhất quán.", "level": "Thông hiểu"}, {"num": 18, "question": "Cơ chế \"Đấu giá tự động trong mili giây\" (Programmatic Bidding) của AdTech mang lại lợi ích gì cho tính tự động hóa quảng cáo?", "options": [{"letter": "A", "text": "Tự động tạo bài viết chuẩn SEO"}, {"letter": "B", "text": "Tự động đưa ra quyết định mua không gian quảng cáo và hiển thị banner phù hợp ngay khi người dùng tải trang web mà không cần con người can thiệp thủ công"}, {"letter": "C", "text": "Tự động gửi hóa đơn cho cơ quan thuế"}, {"letter": "D", "text": "Tự động giảm giá sản phẩm trên kệ siêu thị"}], "answer": "B", "answerText": "Tự động đưa ra quyết định mua không gian quảng cáo và hiển thị banner phù hợp ngay khi người dùng tải trang web mà không cần con người can thiệp thủ công", "explanation": "Mục \"Automation\" của AdTech nêu rõ: Đấu giá tự động trong mili giây (Programmatic) cho phép hệ thống tự động quyết định mua bán không gian và phân phối quảng cáo tức thì.", "level": "Thông hiểu"}, {"num": 19, "question": "Phân biệt sự khác nhau giữa CMS Mã nguồn mở (Open-Source CMS) và CMS Thương mại (Proprietary/Commercial CMS)?", "options": [{"letter": "A", "text": "CMS Mã nguồn mở phải trả phí bản quyền đắt đỏ; CMS Thương mại được miễn phí hoàn toàn"}, {"letter": "B", "text": "CMS Mã nguồn mở công khai mã nguồn miễn phí, tùy biến cao bởi cộng đồng; CMS Thương mại do công ty sở hữu, người dùng trả phí thuê bao/license và nhận hỗ trợ kỹ thuật chuyên nghiệp"}, {"letter": "C", "text": "CMS Mã nguồn mở không tạo được trang web; CMS Thương mại tạo được trang web"}, {"letter": "D", "text": "Không có điểm khác biệt nào"}], "answer": "B", "answerText": "CMS Mã nguồn mở công khai mã nguồn miễn phí, tùy biến cao bởi cộng đồng; CMS Thương mại do công ty sở hữu, người dùng trả phí thuê bao/license và nhận hỗ trợ kỹ thuật chuyên nghiệp", "explanation": "Slide Chương 2.3 phân biệt: Open-Source CMS (như WordPress) có mã nguồn công khai, miễn phí phần mềm cốt lõi, tùy biến sâu; Commercial CMS (như Kentico, Sitecore) bắt buộc mua license, do nhà cung cấp quản lý và hỗ trợ trực tiếp.", "level": "Thông hiểu"}, {"num": 20, "question": "Trong hệ thống CMS, sự khác biệt về vai trò giữa \"Themes/Templates\" và \"Plugins/Extensions\" là gì?", "options": [{"letter": "A", "text": "Themes quyết định tính năng bán hàng; Plugins quyết định màu sắc"}, {"letter": "B", "text": "Themes quyết định vẻ ngoài và bố cục hiển thị (giao diện) của website; Plugins là các phần mềm nhỏ giúp mở rộng và bổ sung tính năng mới cho website"}, {"letter": "C", "text": "Themes dùng để lưu trữ dữ liệu; Plugins dùng để kết nối tên miền"}, {"letter": "D", "text": "Cả hai khái niệm này là một"}], "answer": "B", "answerText": "Themes quyết định vẻ ngoài và bố cục hiển thị (giao diện) của website; Plugins là các phần mềm nhỏ giúp mở rộng và bổ sung tính năng mới cho website", "explanation": "Slide định nghĩa: Themes/Templates quyết định vẻ ngoài và bố cục (màu sắc, font chữ); Plugins/Extensions là phần mềm bổ sung tính năng (như SEO, form liên hệ, giỏ hàng) mà lõi CMS chưa có.", "level": "Thông hiểu"}, {"num": 21, "question": "So sánh trọng tâm mục tiêu giữa Operational CRM (CRM Vận hành) và Analytical CRM (CRM Phân tích)?", "options": [{"letter": "A", "text": "Operational CRM dùng để báo cáo thuế; Analytical CRM dùng để gửi SMS"}, {"letter": "B", "text": "Operational CRM tập trung tự động hóa các quy trình tương tác trực tiếp với KH (Sales, Marketing, Service); Analytical CRM tập trung thu thập, khai phá dữ liệu (Data Mining) để rút ra Insight và dự báo"}, {"letter": "C", "text": "Operational CRM chỉ dành cho cấp quản lý; Analytical CRM dành cho nhân viên bán hàng"}, {"letter": "D", "text": "Cả hai loại CRM này có chức năng giống hệt nhau"}], "answer": "B", "answerText": "Operational CRM tập trung tự động hóa các quy trình tương tác trực tiếp với KH (Sales, Marketing, Service); Analytical CRM tập trung thu thập, khai phá dữ liệu (Data Mining) để rút ra Insight và dự báo", "explanation": "Bảng so sánh 3 loại CRM thể hiện: Operational CRM tập trung vào vận hành quy trình giao tiếp; Analytical CRM tập trung vào phân tích dữ liệu, báo cáo và dự báo hành vi.", "level": "Thông hiểu"}, {"num": 22, "question": "Vai trò chính của Collaborative CRM (CRM Tương tác/Cộng tác) là gì trong tổ chức?", "options": [{"letter": "A", "text": "Thay thế bộ phận nhân sự tuyển dụng"}, {"letter": "B", "text": "Cải thiện sự phối hợp và chia sẻ thông tin khách hàng thống nhất giữa các bộ phận (Marketing, Sales, Customer Service)"}, {"letter": "C", "text": "Tự động chạy quảng cáo Google Ads"}, {"letter": "D", "text": "Quản lý việc đóng gói hàng hóa trong kho"}], "answer": "B", "answerText": "Cải thiện sự phối hợp và chia sẻ thông tin khách hàng thống nhất giữa các bộ phận (Marketing, Sales, Customer Service)", "explanation": "Slide nêu rõ Collaborative CRM tập trung vào việc chia sẻ thông tin và giao tiếp, giúp quản lý tương tác đa kênh và đồng bộ dữ liệu khách hàng giữa tất cả các phòng ban.", "level": "Thông hiểu"}, {"num": 23, "question": "Mối quan hệ tương tác hai chiều giữa Email Marketing và hệ thống CRM diễn ra như thế nào?", "options": [{"letter": "A", "text": "CRM gửi email trực tiếp, Email Marketing chỉ dùng để xem báo cáo"}, {"letter": "B", "text": "CRM cung cấp dữ liệu phân khúc KH chi tiết cho Email Marketing; ngược lại, Email Marketing ghi nhận các chỉ số tương tác (mở, click) làm giàu lại hồ sơ CRM"}, {"letter": "C", "text": "Hai công cụ này không thể kết nối dữ liệu với nhau"}, {"letter": "D", "text": "Email Marketing thay thế hoàn toàn cơ sở dữ liệu của CRM"}], "answer": "B", "answerText": "CRM cung cấp dữ liệu phân khúc KH chi tiết cho Email Marketing; ngược lại, Email Marketing ghi nhận các chỉ số tương tác (mở, click) làm giàu lại hồ sơ CRM", "explanation": "Slide Chương 2.5 mô tả mối quan hệ: CRM cung cấp dữ liệu KH chi tiết để cá nhân hóa email; các chỉ số tương tác email lại được ghi nhận ngược vào hồ sơ KH trong CRM.", "level": "Thông hiểu"}, {"num": 24, "question": "Sự phối hợp giữa Email Marketing và hệ thống quản lý nội dung CMS thể hiện ở điểm nào?", "options": [{"letter": "A", "text": "Email Marketing chứa toàn bộ mã nguồn của CMS"}, {"letter": "B", "text": "Email dẫn dắt người dùng về trang đích (Landing page/Blog) trên CMS, và form đăng ký trên CMS thu thập thông tin để đổ về danh sách Email"}, {"letter": "C", "text": "CMS tự động xóa các email bị trả về"}, {"letter": "D", "text": "Hai hệ thống này hoạt động hoàn toàn độc lập"}], "answer": "B", "answerText": "Email dẫn dắt người dùng về trang đích (Landing page/Blog) trên CMS, và form đăng ký trên CMS thu thập thông tin để đổ về danh sách Email", "explanation": "Bài giảng nêu mối quan hệ Email - CMS: Email dẫn dắt người dùng đến trang bài viết/sản phẩm trên CMS; các form trên CMS thu thập lead bổ sung vào danh sách email.", "level": "Thông hiểu"}, {"num": 25, "question": "Kỹ thuật nhắm mục tiêu Lookalike (Đối tượng tương tự) trong AdTech hoạt động dựa trên cơ chế nào?", "options": [{"letter": "A", "text": "Nhắm mục tiêu ngẫu nhiên vào tất cả người dùng internet"}, {"letter": "B", "text": "Sử dụng Machine Learning để phân tích đặc điểm của một \"tệp đối tượng nguồn\" (danh sách KH mua hàng) và tìm kiếm những người dùng mới có hành vi tương tự"}, {"letter": "C", "text": "Chỉ hiển thị quảng cáo cho người thân của nhân viên công ty"}, {"letter": "D", "text": "Quét số điện thoại từ các trang mạng xã hội"}], "answer": "B", "answerText": "Sử dụng Machine Learning để phân tích đặc điểm của một \"tệp đối tượng nguồn\" (danh sách KH mua hàng) và tìm kiếm những người dùng mới có hành vi tương tự", "explanation": "Slide AdTech giải thích Lookalike Targeting cho phép hệ thống dùng ML tìm kiếm người dùng mới có đặc điểm và hành vi giống với đối tượng nguồn (khách hàng hiện tại).", "level": "Thông hiểu"}, {"num": 26, "question": "Chức năng \"Lên lịch đăng bài\" (Scheduling) trong CMS mang lại lợi ích gì cho kế hoạch xuất bản nội dung của Marketer?", "options": [{"letter": "A", "text": "Tự động viết bài mới mà không cần duyệt nội dung"}, {"letter": "B", "text": "Cho phép đặt giờ cho bài viết tự động xuất bản vào thời điểm tối ưu trong tương lai, giúp duy trì lịch đăng bài đều đặn"}, {"letter": "C", "text": "Tự động gửi bài viết đến đối thủ cạnh tranh"}, {"letter": "D", "text": "Xóa các bài viết cũ đã đăng quá 1 năm"}], "answer": "B", "answerText": "Cho phép đặt giờ cho bài viết tự động xuất bản vào thời điểm tối ưu trong tương lai, giúp duy trì lịch đăng bài đều đặn", "explanation": "Chức năng xuất bản của CMS gồm Đăng ngay và Hẹn giờ đăng (Scheduling) giúp đặt lịch nội dung tự động xuất bản vào thời điểm cụ thể, duy trì sự đều đặn.", "level": "Thông hiểu"}, {"num": 27, "question": "Trong CRM, thuật ngữ \"Lead Scoring\" (Đánh giá/Chấm điểm khách hàng tiềm năng) được hiểu là gì?", "options": [{"letter": "A", "text": "Tính tổng số tiền khách hàng đã thanh toán"}, {"letter": "B", "text": "Gán điểm số cho từng lead dựa trên mức độ tương tác và thuộc tính nhân khẩu học để xác định lead nào đã đủ \"chín\" để chuyển cho Sales"}, {"letter": "C", "text": "Đánh giá thái độ phục vụ của nhân viên bán hàng"}, {"letter": "D", "text": "Xếp hạng mức độ uy tín của nhà cung cấp phần mềm"}], "answer": "B", "answerText": "Gán điểm số cho từng lead dựa trên mức độ tương tác và thuộc tính nhân khẩu học để xác định lead nào đã đủ \"chín\" để chuyển cho Sales", "explanation": "Lead Scoring trong Marketing Automation/CRM giúp tự động chấm điểm lead dựa trên hành vi tương tác, hỗ trợ phân loại lead tiềm năng cao cho đội ngũ Sales.", "level": "Thông hiểu"}, {"num": 28, "question": "Lợi ích hàng đầu của việc tích hợp công cụ SEO Advanced Plugins vào hệ thống CMS là gì?", "options": [{"letter": "A", "text": "Tự động trả tiền cho Google để lên top 1"}, {"letter": "B", "text": "Hỗ trợ tối ưu hóa các yếu tố kỹ thuật và nội dung (meta title, description, sitemap) giúp website xếp hạng tốt hơn trên công cụ tìm kiếm"}, {"letter": "C", "text": "Tự động chặn tất cả truy cập từ đối thủ"}, {"letter": "D", "text": "Thay thế hoàn toàn người viết nội dung"}], "answer": "B", "answerText": "Hỗ trợ tối ưu hóa các yếu tố kỹ thuật và nội dung (meta title, description, sitemap) giúp website xếp hạng tốt hơn trên công cụ tìm kiếm", "explanation": "Slide CMS chỉ ra rằng các plugin SEO cung cấp công cụ giúp tối ưu hóa website, cải thiện thứ hạng tìm kiếm và tăng lưu lượng truy cập tự nhiên.", "level": "Thông hiểu"}, {"num": 29, "question": "Tại sao chỉ số đo lường hiệu suất Email Marketing lại có tính chất \"tức thì và minh bạch\"?", "options": [{"letter": "A", "text": "Vì marketer phải đợi 6 tháng mới có báo cáo"}, {"letter": "B", "text": "Vì phần mềm Email Marketing thống kê chi tiết tỷ lệ chuyển vào inbox, tỷ lệ mở, tỷ lệ click theo thời gian thực ngay sau khi gửi"}, {"letter": "C", "text": "Vì hệ thống tự động đoán kết quả mà không cần gửi email"}, {"letter": "D", "text": "Vì dữ liệu email được bảo mật không ai xem được"}], "answer": "B", "answerText": "Vì phần mềm Email Marketing thống kê chi tiết tỷ lệ chuyển vào inbox, tỷ lệ mở, tỷ lệ click theo thời gian thực ngay sau khi gửi", "explanation": "Lợi ích của Email Marketing là khả năng thống kê chi tiết ngay lập tức về các chỉ số: tỷ lệ inbox, tỷ lệ mở (Open Rate), tỷ lệ nhấp (CTR) và chuyển đổi.", "level": "Thông hiểu"}, {"num": 30, "question": "Khái niệm \"Góc nhìn 360 độ về khách hàng\" (360-degree customer view) trong CRM có ý nghĩa gì?", "options": [{"letter": "A", "text": "Cho phép xem ảnh chụp 3D phòng khách của khách hàng"}, {"letter": "B", "text": "Tập trung toàn bộ dữ liệu lịch sử tương tác, giao dịch, hành vi và hỗ trợ của khách hàng tại một nơi duy nhất cho mọi phòng ban truy cập"}, {"letter": "C", "text": "Việc nhân viên xoay màn hình máy tính 360 độ khi tư vấn"}, {"letter": "D", "text": "Cho phép theo dõi vị trí camera giao thông của khách hàng"}], "answer": "B", "answerText": "Tập trung toàn bộ dữ liệu lịch sử tương tác, giao dịch, hành vi và hỗ trợ của khách hàng tại một nơi duy nhất cho mọi phòng ban truy cập", "explanation": "Bài giảng nhấn mạnh CRM tạo góc nhìn 360 độ bằng cách tập trung tất cả dữ liệu tương tác tại một nơi, giúp Marketing, Sales và Service hiểu toàn diện về KH. 🟠 PHẦN 3: MỨC ĐỘ VẬN DỤNG (10 CÂU - CĐR 2.1 & 2.2) Mục tiêu: Đánh giá khả năng áp dụng công thức tính toán, thiết lập quy trình nuôi dưỡng lead và lựa chọn giải pháp kịch bản thực tế.", "level": "Thông hiểu"}, {"num": 31, "question": "Một chiến dịch quảng cáo AdTech hiển thị 200.000 lượt (Impressions), thu về 8.000 lượt nhấp (Clicks) và tạo ra 400 đơn hàng (Conversions). Tổng chi phí quảng cáo là 40.000.000 VNĐ. Hãy tính chỉ số CTR và CPA của chiến dịch này?", "options": [{"letter": "A", "text": "CTR = 4%; CPA = 100.000 VNĐ"}, {"letter": "B", "text": "CTR = 2.5%; CPA = 500.000 VNĐ"}, {"letter": "C", "text": "CTR = 5%; CPA = 200.000 VNĐ"}, {"letter": "D", "text": "CTR = 8%; CPA = 50.000 VNĐ"}], "answer": "A", "answerText": "CTR = 4%; CPA = 100.000 VNĐ", "explanation": "Tính toán áp dụng công thức trong bài giảng: CTR = (Clicks / Impressions) × 100% = (8.000 / 200.000) × 100% = 4%7. 7.", "level": "Vận dụng"}, {"num": 32, "question": "Hãy sắp xếp đúng thứ tự 5 bước trong quy trình \"Quản lý & Nuôi dưỡng Khách hàng tiềm năng\" bằng Marketing Stack được trình bày trong bài giảng:", "options": [{"letter": "A", "text": "(2) -> (4) -> (5) -> (3) -> (1)"}, {"letter": "B", "text": "(1) -> (2) -> (3) -> (4) -> (5)"}, {"letter": "C", "text": "(4) -> (2) -> (3) -> (5) -> (1)"}, {"letter": "D", "text": "(2) -> (3) -> (4) -> (1) -> (5)"}], "answer": "A", "answerText": "(2) -> (4) -> (5) -> (3) -> (1)", "explanation": "Bài giảng Chương 2.1 trình bày quy trình chuẩn: Thu thập lead từ website/landing page (CMS) -> Ghi nhận vào CRM -> Tự động phân khúc & chấm điểm lead -> Gửi chuỗi email chăm sóc tự động -> Chuyển lead đủ \"ấm\" cho Sales.", "level": "Vận dụng"}, {"num": 33, "question": "Một startup thương mại điện tử nhỏ muốn bán áo thun online, ngân sách hạn chế và không có lập trình viên IT. Giải pháp CMS nào là tối ưu nhất để mở gian hàng nhanh chóng?", "options": [{"letter": "A", "text": "Tự xây dựng CMS mã nguồn mở phức tạp từ đầu"}, {"letter": "B", "text": "Sử dụng SaaS/Cloud-Based CMS như Shopify hoặc Wix (trả phí hàng tháng, nhà cung cấp lo toàn bộ kỹ thuật/hosting)"}, {"letter": "C", "text": "Mua bản quyền CMS Thương mại đắt tiền dành cho tập đoàn"}, {"letter": "D", "text": "Chỉ bán hàng qua tin nhắn SMS truyền thống"}], "answer": "B", "answerText": "Sử dụng SaaS/Cloud-Based CMS như Shopify hoặc Wix (trả phí hàng tháng, nhà cung cấp lo toàn bộ kỹ thuật/hosting)", "explanation": "Bảng so sánh các loại CMS chỉ rõ: SaaS/Cloud-Based CMS (như Shopify) quản lý hoàn toàn về kỹ thuật/hosting, rất phù hợp cho doanh nghiệp nhỏ bắt đầu ngay mà không cần dev.", "level": "Vận dụng"}, {"num": 34, "question": "Chuỗi cửa hàng pizza muốn chạy quảng cáo AdTech hiển thị khuyến mãi \"Giảm 30% trưa nay\" chỉ cho những người dùng smartphone nằm trong bán kính 2km quanh các chi nhánh. Kỹ thuật nhắm mục tiêu nào của AdTech nên được áp dụng?", "options": [{"letter": "A", "text": "Lookalike Targeting"}, {"letter": "B", "text": "Geotargeting / Location-based Targeting (Nhắm mục tiêu theo vị trí địa lý)"}, {"letter": "C", "text": "Behavioral Targeting diện rộng"}, {"letter": "D", "text": "Search Ads theo từ khóa toàn quốc"}], "answer": "B", "answerText": "Geotargeting / Location-based Targeting (Nhắm mục tiêu theo vị trí địa lý)", "explanation": "Slide AdTech giải thích Geotargeting cho phép nhắm mục tiêu quảng cáo đến người dùng trong một khu vực địa lý cụ thể hoặc trong bán kính quanh một địa điểm vật lý (cửa hàng).", "level": "Vận dụng"}, {"num": 35, "question": "Bạn quản lý một website bán máy ảnh. Nhận thấy có 5.000 khách truy cập đã xem trang sản phẩm \"Sony A7IV\" và thêm vào giỏ hàng nhưng không bấm thanh toán. Kịch bản Retargeting AdTech nào hiệu quả nhất?", "options": [{"letter": "A", "text": "Quảng cáo sản phẩm máy giặt cho tệp khách này"}, {"letter": "B", "text": "Chạy Dynamic Product Ads hiển thị đúng chiếc máy ảnh Sony A7IV kèm thông điệp nhắc nhở hoặc voucher giảm 5% cho giỏ hàng bị bỏ quên"}, {"letter": "C", "text": "Xóa tài khoản của các khách hàng này"}, {"letter": "D", "text": "Gửi thư bưu điện đến địa chỉ nhà khách hàng"}], "answer": "B", "answerText": "Chạy Dynamic Product Ads hiển thị đúng chiếc máy ảnh Sony A7IV kèm thông điệp nhắc nhở hoặc voucher giảm 5% cho giỏ hàng bị bỏ quên", "explanation": "Slide AdTech và Retargeting hướng dẫn kịch bản Retargeting đối với tệp bỏ giỏ hàng: Hiển thị đúng sản phẩm đã xem (Dynamic Product Ads) kết hợp ưu đãi nhỏ để thúc đẩy hoàn tất thanh toán.", "level": "Vận dụng"}, {"num": 36, "question": "Một doanh nghiệp B2B muốn triển khai chiến dịch Email Marketing gửi Ebook chuyên ngành. Để xây dựng danh sách email chất lượng cao đúng chuẩn bài giảng, họ nên làm gì?", "options": [{"letter": "A", "text": "Mua danh sách 100.000 email trôi nổi trên mạng"}, {"letter": "B", "text": "Đặt Form đăng ký nhận Ebook trên Landing Page website để khách hàng tự nguyện để lại thông tin (Opt-in)"}, {"letter": "C", "text": "Lấy ngẫu nhiên email từ danh bạ điện thoại cá nhân"}, {"letter": "D", "text": "Quét tự động email của tất cả người dùng trên Facebook"}], "answer": "B", "answerText": "Đặt Form đăng ký nhận Ebook trên Landing Page website để khách hàng tự nguyện để lại thông tin (Opt-in)", "explanation": "Bài giảng chỉ rõ bước 1 của xây dựng Email chiến dịch: Thu thập danh sách chất lượng qua form đăng ký trên website khi người dùng đồng ý/quan tâm (Opt-in) để đảm bảo tỷ lệ chuyển đổi.", "level": "Vận dụng"}, {"num": 37, "question": "Nhằm giảm bớt khối lượng công việc cho tổng đài CSKH vào giờ cao điểm, giải pháp tự động hóa CRM nào cho phép khách hàng tự tìm câu trả lời cho các vấn đề thường gặp?", "options": [{"letter": "A", "text": "Hệ thống tri thức tự phục vụ (Self-Service Knowledge Base & FAQs)"}, {"letter": "B", "text": "Khóa tính năng hỗ trợ của khách hàng"}, {"letter": "C", "text": "Tự động chuyển cuộc gọi sang máy bận"}, {"letter": "D", "text": "Yêu cầu khách hàng đến trực tiếp trụ sở"}], "answer": "A", "answerText": "Hệ thống tri thức tự phục vụ (Self-Service Knowledge Base & FAQs)", "explanation": "Slide CRM dịch vụ KH trình bày tính năng \"Self-Service\": Khách hàng có thể tự tìm câu trả lời thông qua Knowledge Base, FAQs mà không cần gặp nhân viên hỗ trợ.", "level": "Vận dụng"}, {"num": 38, "question": "Trong giai đoạn \"Chuẩn bị & Lập kế hoạch\" khi triển khai dự án CRM, công việc nào sau đây là quan trọng nhất?", "options": [{"letter": "A", "text": "Mua ngay phần mềm đắt nhất thị trường"}, {"letter": "B", "text": "Xác định mục tiêu rõ ràng (ví dụ: tăng 15% leads, giảm 20% thời gian phản hồi) và đánh giá quy trình hiện tại"}, {"letter": "C", "text": "Sa thải bộ phận chăm sóc khách hàng cũ"}, {"letter": "D", "text": "Ép buộc nhân viên tự học phần mềm trong 1 ngày"}], "answer": "B", "answerText": "Xác định mục tiêu rõ ràng (ví dụ: tăng 15% leads, giảm 20% thời gian phản hồi) và đánh giá quy trình hiện tại", "explanation": "Slide Quy trình triển khai CRM quy định bước 1 (Lập kế hoạch): Xác định mục tiêu rõ ràng, đánh giá nhu cầu/quy trình hiện tại và phân tích các bên liên quan.", "level": "Vận dụng"}, {"num": 39, "question": "Để đánh giá hiệu quả của đội ngũ Marketing thông qua báo cáo CRM, nhà quản lý cần tập trung theo dõi các chỉ số KPI nào?", "options": [{"letter": "A", "text": "Số lượng máy tính bàn của phòng marketing"}, {"letter": "B", "text": "Chi phí trên mỗi khách hàng tiềm năng (CPL - Cost Per Lead), số lượng Lead tạo ra và ROI chiến dịch"}, {"letter": "C", "text": "Số lần nhân viên đi làm muộn"}, {"letter": "D", "text": "Tốc độ gõ phím của nhân viên nội dung"}], "answer": "B", "answerText": "Chi phí trên mỗi khách hàng tiềm năng (CPL - Cost Per Lead), số lượng Lead tạo ra và ROI chiến dịch", "explanation": "Slide Báo cáo hiệu suất Marketing trong CRM liệt kê các chỉ số cốt lõi: ROI chiến dịch, số lượng Lead được tạo ra, tỷ lệ mở/click email và CPL.", "level": "Vận dụng"}, {"num": 40, "question": "Khi thực hiện chiến dịch Email Chào mừng (Welcome Email) cho khách hàng mới đăng ký tài khoản, kịch bản gửi nào phù hợp nhất với Marketing Automation?", "options": [{"letter": "A", "text": "Đợi 1 tháng sau mới gửi email chào mừng"}, {"letter": "B", "text": "Kích hoạt tự động gửi ngay lập tức email chào mừng kèm thông tin hướng dẫn sử dụng và mã giảm giá mua đơn đầu tiên"}, {"letter": "C", "text": "Gửi liên tục 50 email trong vòng 1 giờ"}, {"letter": "D", "text": "Bắt khách hàng phải gửi email trước cho công ty"}], "answer": "B", "answerText": "Kích hoạt tự động gửi ngay lập tức email chào mừng kèm thông tin hướng dẫn sử dụng và mã giảm giá mua đơn đầu tiên", "explanation": "Slide bài giảng hướng dẫn sử dụng email tự động: khi có hành động kích hoạt (đăng ký), hệ thống Marketing Automation tự động gửi email chào mừng tức thì để thu hút người dùng. 🔴 PHẦN 4: MỨC ĐỘ VẬN DỤNG CAO (10 CÂU - CĐR 2.2 & 4.1) Mục tiêu: Đánh giá khả năng phân tích case study thực tế, giải quyết rào cản triển khai và đề xuất chiến lược tối ưu toàn diện.", "level": "Vận dụng"}, {"num": 41, "question": "Case Study Starbucks: Để quản lý hơn 38.000 cửa hàng toàn cầu và hàng chục triệu thành viên Starbucks Rewards, thương hiệu này đã triển khai nền tảng AI nào năm 2019 để cá nhân hóa ưu đãi và dự báo nhu cầu?", "options": [{"letter": "A", "text": "Deep Brew AI"}, {"letter": "B", "text": "ChatGPT Enterprise"}, {"letter": "C", "text": "Google Gemini"}, {"letter": "D", "text": "Midjourney"}], "answer": "A", "answerText": "Deep Brew AI", "explanation": "Bài giảng trích dẫn Case Study Starbucks: Năm 2019, Starbucks đầu tư nền tảng AI \"Deep Brew\" để phân tích dữ liệu ứng dụng Starbucks Rewards, cá nhân hóa menu/ưu đãi và dự báo nhu cầu nguyên vật liệu.", "level": "Vận dụng cao"}, {"num": 42, "question": "Phân tích kết quả thu được từ việc triển khai AI Deep Brew của Starbucks trong báo cáo bài giảng?", "options": [{"letter": "A", "text": "Doanh số giảm 10% do khách hàng bỏ app"}, {"letter": "B", "text": "Tăng 15% mức độ tương tác KH, tăng 30% ROI từ khoản đầu tư AI/Data, và doanh số cửa hàng cũ tăng 6%"}, {"letter": "C", "text": "Chi phí nhân sự tăng gấp đôi"}, {"letter": "D", "text": "Tỷ lệ đổi trả hàng tăng vọt"}], "answer": "B", "answerText": "Tăng 15% mức độ tương tác KH, tăng 30% ROI từ khoản đầu tư AI/Data, và doanh số cửa hàng cũ tăng 6%", "explanation": "Slide báo cáo hiệu quả của Starbucks ghi nhận: Mức độ tương tác tăng 15%, ROI từ đầu tư AI/Data đạt 30%, và doanh số cùng cửa hàng (same-store sales) tăng 6%5758.", "level": "Vận dụng cao"}, {"num": 43, "question": "Tại sao việc doanh nghiệp mua một phần mềm CRM đắt tiền (như Salesforce) chưa chắc đảm bảo dự án CRM sẽ thành công?", "options": [{"letter": "A", "text": "Vì phần mềm Salesforce không có tính năng lưu trữ dữ liệu"}, {"letter": "B", "text": "Vì CRM đòi hỏi sự thay đổi về văn hóa doanh nghiệp, quy trình chuẩn hóa, dữ liệu sạch và sự cam kết sử dụng của nhân sự; phần mềm chỉ là công cụ hỗ trợ"}, {"letter": "C", "text": "Vì các nền tảng CRM lớn cấm doanh nghiệp bán hàng"}, {"letter": "D", "text": "Vì CRM chỉ dùng được trên máy tính hệ điều hành Linux"}], "answer": "B", "answerText": "Vì CRM đòi hỏi sự thay đổi về văn hóa doanh nghiệp, quy trình chuẩn hóa, dữ liệu sạch và sự cam kết sử dụng của nhân sự; phần mềm chỉ là công cụ hỗ trợ", "explanation": "Bài giảng chỉ rõ các thách thức thất bại CRM: Ngại thay đổi văn hóa, dữ liệu rác (Dirty data), thiếu đào tạo và kỳ vọng không thực tế. CRM là triết lý kinh doanh chứ không chỉ là phần mềm.", "level": "Vận dụng cao"}, {"num": 44, "question": "Tại sao không nên đánh giá hiệu quả của một chiến dịch quảng cáo AdTech CHỈ dựa vào chỉ số số lượt nhấp chuột (Clicks)?", "options": [{"letter": "A", "text": "Vì số lượt click luôn bằng 0"}, {"letter": "B", "text": "Vì lượt click chỉ phản ánh sự tò mò ban đầu, có rào cản click ảo/bot fraud; quan trọng là tỷ lệ chuyển đổi (Conversions), chi phí CPA và lợi nhuận ROAS thực tế"}, {"letter": "C", "text": "Vì click chuột làm hỏng bàn phím"}, {"letter": "D", "text": "Vì các nền tảng quảng cáo không cho phép đếm lượt click"}], "answer": "B", "answerText": "Vì lượt click chỉ phản ánh sự tò mò ban đầu, có rào cản click ảo/bot fraud; quan trọng là tỷ lệ chuyển đổi (Conversions), chi phí CPA và lợi nhuận ROAS thực tế", "explanation": "Thảo luận bài giảng AdTech lưu ý: Nhiều click chưa chắc tạo ra doanh thu nếu landing page kém hoặc gặp thủ đoạn gian lận click (bot click). Đánh giá phải dựa trên Conversions, CPA và ROAS.", "level": "Vận dụng cao"}, {"num": 45, "question": "Để giải quyết thách thức \"Dữ liệu không sạch\" (Dirty Data - trùng lặp, thiếu sót, sai lệch) khi hợp nhất dữ liệu từ nhiều nguồn vào CRM, doanh nghiệp cần làm gì?", "options": [{"letter": "A", "text": "Xóa toàn bộ cơ sở dữ liệu và thu thập lại từ đầu"}, {"letter": "B", "text": "Thực hiện chuẩn hóa, làm sạch dữ liệu (Data Cleansing), loại bỏ trùng lặp và quy định quy trình nhập dữ liệu chuẩn trước khi đưa vào CRM"}, {"letter": "C", "text": "Kệ dữ liệu rác và tiếp tục vận hành"}, {"letter": "D", "text": "Thuê AI tự động xóa bớt 50% số điện thoại"}], "answer": "B", "answerText": "Thực hiện chuẩn hóa, làm sạch dữ liệu (Data Cleansing), loại bỏ trùng lặp và quy định quy trình nhập dữ liệu chuẩn trước khi đưa vào CRM", "explanation": "Thách thức CRM nêu rõ tình trạng Dirty Data; giải pháp là xây dựng quy trình quản trị dữ liệu, làm sạch và tích hợp chuẩn hóa để đảm bảo chất lượng dữ liệu đầu vào.", "level": "Vận dụng cao"}, {"num": 46, "question": "Trong 5 xu hướng CRM năm 2024 được trích dẫn trong bài giảng, xu hướng \"Social CRM lên ngôi\" được thúc đẩy bởi thực tế nào?", "options": [{"letter": "A", "text": "100% người dùng bỏ sử dụng email"}, {"letter": "B", "text": "78% người tiêu dùng mua hàng từ các thương hiệu mà họ tương tác trên mạng xã hội"}, {"letter": "C", "text": "Mạng xã hội hoàn toàn miễn phí cho doanh nghiệp"}, {"letter": "D", "text": "Luật pháp bắt buộc mọi doanh nghiệp phải dùng Social CRM"}], "answer": "B", "answerText": "78% người tiêu dùng mua hàng từ các thương hiệu mà họ tương tác trên mạng xã hội", "explanation": "Slide 5 xu hướng CRM 2024 trích dẫn số liệu: 78% người tiêu dùng mua hàng từ thương hiệu họ tương tác trên social media, làm cho Social CRM trở thành xu hướng lên ngôi.", "level": "Vận dụng cao"}, {"num": 47, "question": "Đề xuất chiến lược phối hợp giữa AdTech và MarTech cho một thương hiệu bán lẻ thời trang nhằm tối ưu hóa Customer Lifetime Value (CLTV)?", "options": [{"letter": "A", "text": "Chỉ chạy AdTech tìm khách mới rồi bỏ rơi khách cũ"}, {"letter": "B", "text": "Dùng AdTech (Google/Meta Ads) thu hút khách mới ở đầu phễu -> Thu thập dữ liệu vào CRM -> Dùng Email Automation & CMS nuôi dưỡng, cá nhân hóa ưu đãi giữ chân ở cuối phễu"}, {"letter": "C", "text": "Không dùng cả AdTech lẫn MarTech"}, {"letter": "D", "text": "Chỉ gửi Email spam cho khách hàng chưa biết thương hiệu"}], "answer": "B", "answerText": "Dùng AdTech (Google/Meta Ads) thu hút khách mới ở đầu phễu -> Thu thập dữ liệu vào CRM -> Dùng Email Automation & CMS nuôi dưỡng, cá nhân hóa ưu đãi giữ chân ở cuối phễu", "explanation": "Bài giảng kết luận sự tích hợp AdTech & MarTech: AdTech thu hút đầu phễu; MarTech (CRM, Email, CMS) quản lý dữ liệu, nuôi dưỡng và giữ chân khách hàng lâu dài để tối ưu CLTV.", "level": "Vận dụng cao"}, {"num": 48, "question": "Nhược điểm \"Vendor Lock-in\" (bị khóa/phụ thuộc vào nhà cung cấp) thường xuất hiện ở loại CMS nào và doanh nghiệp cần lưu ý gì khi lựa chọn?", "options": [{"letter": "A", "text": "CMS Mã nguồn mở (Open-Source)"}, {"letter": "B", "text": "CMS Thương mại (Proprietary/Commercial CMS) và Cloud/SaaS CMS; doanh nghiệp cần đánh giá khả năng trích xuất dữ liệu (Data Export) trước khi cam kết"}, {"letter": "C", "text": "Không xuất hiện ở bất kỳ loại CMS nào"}, {"letter": "D", "text": "Chỉ xuất hiện khi dùng file Excel"}], "answer": "B", "answerText": "CMS Thương mại (Proprietary/Commercial CMS) và Cloud/SaaS CMS; doanh nghiệp cần đánh giá khả năng trích xuất dữ liệu (Data Export) trước khi cam kết", "explanation": "Nhược điểm của CMS Thương mại được bài giảng nêu rõ là khả năng linh hoạt kém hơn mã nguồn mở và dễ bị \"khóa\" vào nhà cung cấp, khiến việc chuyển đổi nền tảng sau này rất tốn kém.", "level": "Vận dụng cao"}, {"num": 49, "question": "Để hạn chế tình trạng Email tiếp thị bị các bộ lọc (Gmail, Outlook) chuyển vào hòm thư rác (Spam Folder), giải pháp KỸ THUẬT VẬN HÀNH nào nên được thực hiện?", "options": [{"letter": "A", "text": "Viết tiêu đề bằng toàn bộ chữ IN HOA và chứa nhiều dấu chấm cảm (!!!)"}, {"letter": "B", "text": "Gửi email từ tên miền uy tín đã xác thực (SPF, DKIM), phân tệp danh sách rõ ràng và chỉ gửi nội dung cá nhân hóa cho người đăng ký đồng ý (Opt-in)"}, {"letter": "C", "text": "Gửi 100.000 email cùng một lúc từ địa chỉ Gmail cá nhân"}, {"letter": "D", "text": "Chèn 20 hình ảnh dung lượng lớn vào email mà không có văn bản"}], "answer": "B", "answerText": "Gửi email từ tên miền uy tín đã xác thực (SPF, DKIM), phân tệp danh sách rõ ràng và chỉ gửi nội dung cá nhân hóa cho người đăng ký đồng ý (Opt-in)", "explanation": "Bài giảng phân tích hạn chế email bị spam và hướng dẫn tối ưu: Xây dựng danh sách chất lượng (Opt-in), phân khúc rõ ràng và tối ưu kỹ thuật gửi từ nguồn uy tín để tránh bị coi là thư rác.", "level": "Vận dụng cao"}, {"num": 50, "question": "Khi doanh nghiệp đưa hệ thống CRM hoàn toàn mới vào vận hành, yếu tố \"Quản lý sự thay đổi\" (Change Management) cần tập trung vào khâu nào để nhân viên không né tránh sử dụng?", "options": [{"letter": "A", "text": "Sa thải ngay những nhân viên không biết dùng phần mềm"}, {"letter": "B", "text": "Sự cam kết từ lãnh đạo cấp cao, truyền thông rõ lợi ích cho nhân viên và tổ chức các chương trình đào tạo bài bản kèm hỗ trợ kỹ thuật liên tục"}, {"letter": "C", "text": "Giấu không cho nhân viên biết về hệ thống CRM mới"}, {"letter": "D", "text": "Phạt tiền nhân viên mỗi khi hệ thống phát sinh lỗi"}], "answer": "B", "answerText": "Sự cam kết từ lãnh đạo cấp cao, truyền thông rõ lợi ích cho nhân viên và tổ chức các chương trình đào tạo bài bản kèm hỗ trợ kỹ thuật liên tục", "explanation": "Các yếu tố thành công trong triển khai CRM được slide khẳng định: Cam kết từ lãnh đạo cấp cao, đào tạo người dùng toàn diện, quy trình quản lý thay đổi (Change Management) và hỗ trợ vận hành ban đầu.", "level": "Vận dụng cao"}]}, {"id": 3, "title": "Tự động hóa tiếp thị (Marketing Automation), Chatbot & Retargeting/Remarketing", "theory": ["Marketing Automation (MA): Sử dụng phần mềm để tự động hóa các quy trình chiến lược lặp đi lặp lại (gửi email, phân khúc, chấm điểm lead, báo cáo).", "Case Study Uniqlo: Tối ưu MA qua chuỗi Email post-purchase (hỏi thăm -> gợi ý phối đồ cross-sell -> gửi mã giảm giá tái mua), push notification cá nhân hóa và quản lý thành viên App.", "Phân loại Chatbot:", "Button-based (Dựa trên nút bấm).", "Keyword-based (Dựa trên từ khóa có sẵn).", "Conversational AI Chatbot (Ứng dụng NLU, xử lý ngữ cảnh và cảm xúc).", "Retargeting vs Remarketing:", "Retargeting (Tiếp thị bám đuổi): Sử dụng Cookie/Pixel để hiển thị quảng cáo cho khách truy cập website/app nhưng chưa chuyển đổi (First/Second/Third Party Data).", "Remarketing (Tiếp thị lại): Phạm vi rộng hơn, sử dụng chủ yếu First-Party Data (Email, Zalo, SMS, CRM) để tái chăm sóc khách hàng cũ."], "qa": [{"num": 1, "question": "Marketing Automation là gì? Giải thích tại sao Marketing Automation không chỉ đơn giản là \"tự động gửi email\".", "answer": ["Khái niệm: Là việc ứng dụng phần mềm để tự động hóa các tác vụ và quy trình marketing lặp đi lặp lại.", "Giải thích: Gửi email tự động chỉ là 1 chức năng nhỏ. MA bao gồm quản lý quy trình chiến lược toàn diện: phân khúc dữ liệu vi mô, chấm điểm lead, cá nhân hóa đa kênh và báo cáo phân tích hiệu năng."]}, {"num": 2, "question": "Trình bày các chức năng chính của Marketing Automation: Lead Management, Lead Scoring, Email Marketing Automation, Segmentation, Reporting & Analytics. Hãy đưa ra một ví dụ đơn giản cho ít nhất ba chức năng.", "answer": ["Lead Management: Thu thập và quản lý luồng dữ liệu lead.", "Lead Scoring: Cộng điểm khi lead mở email (+5 điểm), tải tài liệu (+10 điểm).", "Email Automation: Gửi chuỗi email chăm sóc tự động theo thời gian.", "Segmentation: Tự động chia nhóm khách hàng theo khu vực/hành vi.", "Reporting & Analytics: Xuất báo cáo tỷ lệ chuyển đổi realtime."]}, {"num": 3, "question": "Trình bày các bước cơ bản để xây dựng một hệ thống Marketing Automation. Theo bạn, tại sao doanh nghiệp cần đánh giá chất lượng dữ liệu trước khi triển khai tự động hóa?", "answer": ["Các bước: (1) Phân tích thị trường & chân dung KH -> (2) Đánh giá dữ liệu hiện có -> (3) Lựa chọn phần mềm -> (4) Thiết lập workflow -> (5) Theo dõi & tối ưu.", "Giải thích: Dữ liệu là yếu tố then chốt (\"Garbage in, garbage out\"). Nếu dữ liệu sai/trùng lặp, hệ thống tự động sẽ gửi sai thông điệp ở quy mô lớn, gây lãng phí tài nguyên và làm hỏng hình ảnh thương hiệu."]}, {"num": 4, "question": "Phân tích những lợi ích chính của Marketing Automation đối với doanh nghiệp như: Tăng hiệu quả và năng suất; Cá nhân hóa trải nghiệm; Lead nurturing; Tăng conversion; Đo lường chính xác; Phối hợp Marketing - Sales.", "answer": ["Tiết kiệm thời gian nhân sự thủ công, duy trì tương tác cá nhân hóa đúng thời điểm, nuôi dưỡng leads liên tục để tăng tỷ lệ chốt đơn (Conversion), cung cấp báo cáo đo lường minh bạch và chuyển giao leads chín rụi giúp Sales chốt đơn nhanh hơn."]}, {"num": 5, "question": "Trong case Uniqlo của bài học, hãy trình bày cách doanh nghiệp có thể sử dụng Marketing Automation để tăng tỷ lệ mua lại và Customer Lifetime Value.", "answer": ["Thiết lập chuỗi Workflow sau mua hàng: Email 1 (sau 3 ngày) hỗ trợ trải nghiệm -> Email 2 (sau 15 ngày) gợi ý sản phẩm Cross-sell phù hợp tệp đã mua (ví dụ mua áo giữ nhiệt -> gợi ý quần giữ nhiệt) -> Email 3 (sau 30 ngày) tặng voucher giảm 10% tái mua. Kết hợp Push Notification cá nhân hóa trên App theo mốc điểm thưởng."]}, {"num": 6, "question": "Chatbot là gì? Phân biệt ba dạng: Button-based chatbot, Keyword-based chatbot, Conversational chatbot. Theo bạn, loại chatbot nào phù hợp hơn với những yêu cầu khách hàng phức tạp? Giải thích.", "answer": ["Chatbot: Chương trình máy tính mô phỏng cuộc trò chuyện với con người.", "Button-based: Hoạt động dựa trên các nút bấm lựa chọn theo cây quyết định cố định.", "Keyword-based: Nhận diện từ khóa trong câu hỏi để trả lời câu mẫu.", "Conversational: Sử dụng AI/NLU để hiểu ý định và ngữ cảnh tự nhiên.", "Phù hợp yêu cầu phức tạp: Conversational Chatbot, vì nó có khả năng phân tích đa ý định, hiểu ngữ cảnh phức tạp và phản hồi linh hoạt thay vì bị gò bó bởi kịch bản cứng nhắc."]}, {"num": 7, "question": "Trình bày những hạn chế của chatbot dựa trên quy tắc hoặc từ khóa. AI có thể giúp khắc phục những hạn chế này như thế nào?", "answer": ["Hạn chế: Không hiểu ngữ cảnh, thiếu đồng cảm/cảm xúc, trả lời cứng nhắc khi từ khóa không khớp.", "AI khắc phục: Sử dụng NLU hiểu ngôn ngữ tự nhiên, Phân tích cảm xúc (Sentiment Analysis) để xoa dịu người dùng bực bội và tích hợp CDP để cá nhân hóa câu trả lời."]}, {"num": 8, "question": "Trình bày bốn ứng dụng của AI để nâng cao chatbot trong chăm sóc khách hàng: NLU và contextual understanding; Sentiment analysis; Tích hợp dữ liệu khách hàng đa kênh; Predictive analytics và proactive interaction.", "answer": ["NLU & Context: Thấu hiểu ý định ẩn sau câu từ phức tạp.", "Sentiment Analysis: Phát hiện cảm xúc tiêu cực để ưu tiên phản hồi đồng cảm.", "Tích hợp CDP: Nhận diện toàn bộ lịch sử mua sắm online/offline của người chat.", "Predictive & Proactive: Dự đoán nguy cơ bỏ giỏ hàng để chủ động nhảy khung chat hỗ trợ."]}, {"num": 9, "question": "Phân biệt Retargeting và Remarketing theo phạm vi đối tượng, dữ liệu và cách thức tái tiếp cận khách hàng. Tại sao doanh nghiệp cần tái kết nối với những khách hàng chưa chuyển đổi hoặc đã lâu không quay lại?", "answer": ["Phân biệt: Retargeting nhắm vào người vào website chưa mua qua quảng cáo hiển thị Ads (dùng Pixel/Cookie). Remarketing tái tiếp cận rộng hơn qua tệp dữ liệu có sẵn (Email/CRM/SMS).", "Lý do tái kết nối: Hầu hết khách không mua ngay lần đầu, chi phí giữ chân/tái kích hoạt khách cũ rẻ hơn nhiều so với tìm khách mới, giúp tăng CLTV."]}, {"num": 10, "question": "Trình bày vai trò của AI trong Retargeting và Remarketing. Hãy giải thích AI có thể hỗ trợ: Phân tích ý định; Dynamic Ads; Lựa chọn ưu đãi; Cá nhân hóa thông điệp; Kiểm soát tần suất quảng cáo như thế nào.", "answer": ["AI phân tích hành vi rời trang để hiểu ý định mua, tự động tạo Dynamic Ads hiển thị đúng sản phẩm khách bỏ giỏ, tự tính toán mức voucher tối ưu dựa trên giá trị giỏ hàng, cá nhân hóa thông điệp quảng cáo và tự động điều chỉnh kiểm soát tần suất (Frequency Capping) để tránh gây phiền hà cho người dùng."]}], "quiz": [{"num": 1, "question": "Theo tài liệu bài giảng, Marketing Automation (MA) được định nghĩa là gì?", "options": [{"letter": "A", "text": "Việc sử dụng robot cơ khí để đóng gói hàng hóa tại kho"}, {"letter": "B", "text": "Việc sử dụng phần mềm để tự động hóa các tác vụ Marketing lặp đi lặp lại như gửi email, phân khúc khách hàng và nuôi dưỡng khách hàng tiềm năng"}, {"letter": "C", "text": "Hoạt động thuê công ty bên ngoài chạy quảng cáo truyền hình"}, {"letter": "D", "text": "Việc tự động giảm giá sản phẩm khi cửa hàng vắng khách"}], "answer": "B", "answerText": "Việc sử dụng phần mềm để tự động hóa các tác vụ Marketing lặp đi lặp lại như gửi email, phân khúc khách hàng và nuôi dưỡng khách hàng tiềm năng", "explanation": "Slide Chương 3.1 định nghĩa: Marketing Automation là việc sử dụng phần mềm để tự động hóa các tác vụ Marketing lặp đi lặp lại như gửi email, đăng bài mạng xã hội, phân khúc khách hàng và nuôi dưỡng khách hàng tiềm năng.", "level": "Nhận biết"}, {"num": 2, "question": "Chức năng \"Chấm điểm khách hàng tiềm năng\" (Lead Scoring) trong Marketing Automation được hiểu là gì?", "options": [{"letter": "A", "text": "Đánh giá trình độ học vấn của khách hàng"}, {"letter": "B", "text": "Gán điểm số cho Leads dựa trên hành vi (như truy cập website, mở email) và thuộc tính nhân khẩu học nhằm xác định độ \"chín\" để chuyển cho Sales"}, {"letter": "C", "text": "Xếp hạng thái độ phục vụ của nhân viên tiếp thị"}, {"letter": "D", "text": "Đếm số lượng sản phẩm khách hàng đã mua"}], "answer": "B", "answerText": "Gán điểm số cho Leads dựa trên hành vi (như truy cập website, mở email) và thuộc tính nhân khẩu học nhằm xác định độ \"chín\" để chuyển cho Sales", "explanation": "Lead Scoring là chức năng gán điểm cho Leads dựa trên các tương tác thực tế (truy cập web, mở email) giúp đội ngũ Sales ưu tiên các Leads có khả năng chuyển đổi cao nhất.", "level": "Nhận biết"}, {"num": 3, "question": "Quy trình triển khai hệ thống Marketing Automation tiêu chuẩn gồm bao gồm mấy bước?", "options": [{"letter": "A", "text": "3 bước"}, {"letter": "B", "text": "5 bước"}, {"letter": "C", "text": "7 bước"}, {"letter": "D", "text": "10 bước"}], "answer": "B", "answerText": "5 bước", "explanation": "Sơ đồ quy trình triển khai Marketing Automation trong slide Chương 3.1 gồm 5 bước: (1) Phân tích thị trường & KH mục tiêu -> (2) Đánh giá dữ liệu -> (3) Lựa chọn công nghệ -> (4) Thiết lập workflow -> (5) Theo dõi & tối ưu.", "level": "Nhận biết"}, {"num": 4, "question": "Khái niệm \"Chatbot\" được định nghĩa là gì trong bài giảng?", "options": [{"letter": "A", "text": "Thiết bị nghe nhìn thông minh gắn tại cửa hàng offline"}, {"letter": "B", "text": "Chương trình máy tính mô phỏng và xử lý cuộc trò chuyện của con người (bằng văn bản hoặc giọng nói)"}, {"letter": "C", "text": "Trình duyệt web tự động chặn quảng cáo rác"}, {"letter": "D", "text": "Hệ thống định vị vệ tinh GPS cho phương tiện giao hàng"}], "answer": "B", "answerText": "Chương trình máy tính mô phỏng và xử lý cuộc trò chuyện của con người (bằng văn bản hoặc giọng nói)", "explanation": "Slide Chương 3.2 định nghĩa Chatbot là chương trình máy tính mô phỏng và xử lý cuộc trò chuyện của con người bằng văn bản hoặc giọng nói, cho phép tương tác trực tiếp giữa người và máy.", "level": "Nhận biết"}, {"num": 5, "question": "Ba dạng Chatbot phổ biến được phân loại trong bài giảng bao gồm?", "options": [{"letter": "A", "text": "Online chatbot - Offline chatbot - Hybrid chatbot"}, {"letter": "B", "text": "Button-based chatbot - Keyword-based chatbot - Conversational chatbot"}, {"letter": "C", "text": "Text chatbot - Voice chatbot - Video chatbot"}, {"letter": "D", "text": "Free chatbot - Paid chatbot - Enterprise chatbot"}], "answer": "B", "answerText": "Button-based chatbot - Keyword-based chatbot - Conversational chatbot", "explanation": "Slide Chương 3.2 phân loại 3 dạng chatbot cốt lõi: Button-based (dựa trên nút bấm), Keyword-based (dựa trên từ khóa), và Conversational chatbot (dựa trên AI trò chuyện).", "level": "Nhận biết"}, {"num": 6, "question": "Dạng Chatbot nào hoạt động dựa trên kịch bản quyết định cố định và các nút lựa chọn sẵn?", "options": [{"letter": "A", "text": "Conversational chatbot"}, {"letter": "B", "text": "Button-based chatbot"}, {"letter": "C", "text": "Voice AI agent"}, {"letter": "D", "text": "Social listening bot"}], "answer": "B", "answerText": "Button-based chatbot", "explanation": "Button-based chatbot hướng dẫn người dùng qua các cây quyết định bằng cách bấm vào các nút menu có sẵn trên màn hình.", "level": "Nhận biết"}, {"num": 7, "question": "Công nghệ cốt lõi giúp Conversational Chatbot thấu hiểu ngữ cảnh và ý định câu hỏi của con người là gì?", "options": [{"letter": "A", "text": "Mã vạch QR Code"}, {"letter": "B", "text": "NLU (Natural Language Understanding - Hiểu ngôn ngữ tự nhiên) & AI"}, {"letter": "C", "text": "Thẻ định danh RFID"}, {"letter": "D", "text": "Hệ thống định vị GPS"}], "answer": "B", "answerText": "NLU (Natural Language Understanding - Hiểu ngôn ngữ tự nhiên) & AI", "explanation": "AI-Powered NLU và các mô hình học sâu giúp Chatbot phân tích ngữ cảnh, ý định ẩn sau câu từ của người dùng.", "level": "Nhận biết"}, {"num": 8, "question": "Trong chiến lược Retargeting, đoạn mã nhỏ được gắn trên website/ứng dụng để ghi nhận hành vi người dùng được gọi là gì?", "options": [{"letter": "A", "text": "Virus máy tính"}, {"letter": "B", "text": "Pixel / Cookie"}, {"letter": "C", "text": "Tên miền Domain"}, {"letter": "D", "text": "Tập tin Font chữ"}], "answer": "B", "answerText": "Pixel / Cookie", "explanation": "Retargeting hoạt động bằng cách gắn một đoạn mã nhỏ (Pixel/Cookie) lên website/app để \"đánh dấu\" người dùng và theo dõi dấu chân kỹ thuật số của họ.", "level": "Nhận biết"}, {"num": 9, "question": "Khái niệm \"Retargeting\" (Tiếp thị bám đuổi) tập trung chủ yếu vào nhóm đối tượng nào?", "options": [{"letter": "A", "text": "Người tiêu dùng chưa từng biết đến sự tồn tại của thương hiệu"}, {"letter": "B", "text": "Những người dùng đã từng truy cập website/app hoặc tương tác với tài sản số của thương hiệu nhưng chưa chuyển đổi"}, {"letter": "C", "text": "Khách hàng đã mua hàng liên tục trong 10 năm"}, {"letter": "D", "text": "Nhân viên nội bộ của doanh nghiệp"}], "answer": "B", "answerText": "Những người dùng đã từng truy cập website/app hoặc tương tác với tài sản số của thương hiệu nhưng chưa chuyển đổi", "explanation": "Retargeting tập trung hiển thị quảng cáo trực tuyến đến những người đã truy cập website hoặc có hành động cụ thể trên kênh digital.", "level": "Nhận biết"}, {"num": 10, "question": "Dữ liệu chủ yếu được sử dụng trong chiến lược Remarketing (Tiếp thị lại) là loại dữ liệu nào?", "options": [{"letter": "A", "text": "Third-Party Data mua từ bên thứ ba không rõ nguồn gốc"}, {"letter": "B", "text": "First-Party Data (Dữ liệu do chính doanh nghiệp sở hữu như Email, SĐT, dữ liệu CRM)"}, {"letter": "C", "text": "Dữ liệu thời tiết toàn cầu"}, {"letter": "D", "text": "Dữ liệu từ các cơ quan thống kê chính phủ"}], "answer": "B", "answerText": "First-Party Data (Dữ liệu do chính doanh nghiệp sở hữu như Email, SĐT, dữ liệu CRM)", "explanation": "Bảng so sánh Chương 3.3 nêu rõ Remarketing chủ yếu dựa vào First-Party Data từ hành vi người dùng trên các nền tảng thuộc sở hữu doanh nghiệp (CRM, Email list, Zalo).", "level": "Nhận biết"}, {"num": 11, "question": "Định dạng quảng cáo Retargeting tự động hiển thị đúng sản phẩm mà khách hàng vừa xem hoặc bỏ giỏ hàng được gọi là gì?", "options": [{"letter": "A", "text": "Static Banner Ads"}, {"letter": "B", "text": "Dynamic Product Ads (Quảng cáo sản phẩm động)"}, {"letter": "C", "text": "Text Ads"}, {"letter": "D", "text": "Newspaper Ads"}], "answer": "B", "answerText": "Dynamic Product Ads (Quảng cáo sản phẩm động)", "explanation": "Dynamic Product Ads giúp tự động cá nhân hóa banner, hiển thị chính xác hình ảnh sản phẩm khách vừa xem hoặc bỏ giỏ hàng.", "level": "Nhận biết"}, {"num": 12, "question": "Trong Case study Uniqlo, tên gọi của hệ thống Chatbot chăm sóc khách hàng chính trên App/Website là gì?", "options": [{"letter": "A", "text": "Uniqlo Bot"}, {"letter": "B", "text": "Unibot (hoặc Uniqlo IQ)"}, {"letter": "C", "text": "Fast Retailing AI"}, {"letter": "D", "text": "LifeWear Assistant"}], "answer": "B", "answerText": "Unibot (hoặc Uniqlo IQ)", "explanation": "Slide Bài giảng Chương 3.2 giới thiệu Unibot (Uniqlo IQ) là kênh CSKH tự động chính của Uniqlo trên Website và Mobile App.", "level": "Nhận biết"}, {"num": 13, "question": "Mục tiêu chính của chiến dịch Email Post-purchase (sau mua hàng) trong Marketing Automation là gì?", "options": [{"letter": "A", "text": "Yêu cầu khách hàng trả lại sản phẩm"}, {"letter": "B", "text": "Duy trì sự gắn kết, hướng dẫn trải nghiệm, kích hoạt mua lặp lại và tăng giá trị trọn đời khách hàng (CLTV)"}, {"letter": "C", "text": "Tự động xóa tài khoản khách hàng"}, {"letter": "D", "text": "Quảng cáo sản phẩm của đối thủ"}], "answer": "B", "answerText": "Duy trì sự gắn kết, hướng dẫn trải nghiệm, kích hoạt mua lặp lại và tăng giá trị trọn đời khách hàng (CLTV)", "explanation": "Chuỗi email/thông báo sau mua hàng giúp hỗ trợ trải nghiệm, gợi ý phối đồ cross-sell và tặng ưu đãi tái mua để tối ưu CLTV.", "level": "Nhận biết"}, {"num": 14, "question": "Kỹ thuật \"Frequency Capping\" trong chạy quảng cáo Retargeting AI có tác dụng gì?", "options": [{"letter": "A", "text": "Tự động tăng giá thầu quảng cáo lên gấp 10 lần"}, {"letter": "B", "text": "Tự động giới hạn số lần một quảng cáo hiển thị cho cùng một người dùng trong một khoảng thời gian nhằm tránh gây khó chịu"}, {"letter": "C", "text": "Xóa vĩnh viễn tệp khách hàng bị gián đoạn"}, {"letter": "D", "text": "Tự động phát âm thanh quảng cáo ở mức tối đa"}], "answer": "B", "answerText": "Tự động giới hạn số lần một quảng cáo hiển thị cho cùng một người dùng trong một khoảng thời gian nhằm tránh gây khó chịu", "explanation": "AI giúp kiểm soát tần suất hiển thị (Frequency Capping), tránh việc tần suất quá cao làm khách hàng cảm thấy bị quấy rối.", "level": "Nhận biết"}, {"num": 15, "question": "Nền tảng hợp nhất dữ liệu khách hàng đa kênh theo thời gian thực được viết tắt là gì?", "options": [{"letter": "A", "text": "CMS"}, {"letter": "B", "text": "CDP (Customer Data Platform)"}, {"letter": "C", "text": "POS"}, {"letter": "D", "text": "SEO"}], "answer": "B", "answerText": "CDP (Customer Data Platform)", "explanation": "CDP (Customer Data Platform) giúp tích hợp dữ liệu khách hàng từ mọi điểm chạm (online, offline, ads, email) thành hồ sơ duy nhất. 🟡 PHẦN 2: MỨC ĐỘ THÔNG HIỂU (15 CÂU - CĐR 2.1) Mục tiêu: Đánh giá khả năng phân biệt, so sánh bản chất và giải thích kịch bản hoạt động của MA, Chatbot và Retargeting/Remarketing.", "level": "Nhận biết"}, {"num": 16, "question": "Giải thích tại sao Marketing Automation KHÔNG CHỈ đơn giản là việc \"tự động gửi email hàng loạt\"?", "options": [{"letter": "A", "text": "Vì gửi email hàng loạt làm tốn dung lượng máy tính"}, {"letter": "B", "text": "Vì MA bao gồm một quy trình chiến lược toàn diện: quản lý và nuôi dưỡng lead, chấm điểm lead, phân đoạn vi mô và tối ưu hóa hành trình khách hàng đa kênh"}, {"letter": "C", "text": "Vì phần mềm gửi email không phải là công cụ của marketing"}, {"letter": "D", "text": "Vì MA chỉ phục vụ cho việc gọi điện thoại tự động"}], "answer": "B", "answerText": "Vì MA bao gồm một quy trình chiến lược toàn diện: quản lý và nuôi dưỡng lead, chấm điểm lead, phân đoạn vi mô và tối ưu hóa hành trình khách hàng đa kênh", "explanation": "Gửi email tự động chỉ là một chức năng nhỏ. MA vận hành cả một quy trình quản trị dữ liệu, chấm điểm lead, phân đoạn vi mô và cá nhân hóa trải nghiệm.", "level": "Thông hiểu"}, {"num": 17, "question": "Sự khác biệt bản chất nhất giữa Retargeting và Remarketing theo phạm vi kênh tiếp cận và dữ liệu là gì?", "options": [{"letter": "A", "text": "Retargeting dùng email; Remarketing dùng banner"}, {"letter": "B", "text": "Retargeting tập trung hiển thị quảng cáo Ads bám đuổi dựa trên Pixel/Cookie; Remarketing có phạm vi rộng hơn, tiếp cận qua kênh thuộc sở hữu (Email/SMS/CRM) dựa trên First-Party Data"}, {"letter": "C", "text": "Retargeting hoàn toàn miễn phí; Remarketing đắt tiền"}, {"letter": "D", "text": "Hai chiến lược này hoàn toàn trùng khớp không có điểm khác biệt"}], "answer": "B", "answerText": "Retargeting tập trung hiển thị quảng cáo Ads bám đuổi dựa trên Pixel/Cookie; Remarketing có phạm vi rộng hơn, tiếp cận qua kênh thuộc sở hữu (Email/SMS/CRM) dựa trên First-Party Data", "explanation": "Bảng so sánh Chương 3.3 đối chiếu: Retargeting hiển thị quảng cáo qua Ads dựa trên Pixel/Cookie; Remarketing tái tiếp cận qua Email/App/SMS dựa trên dữ liệu First-Party Data.", "level": "Thông hiểu"}, {"num": 18, "question": "Vai trò bổ trợ giữa Retargeting và Remarketing trong phễu chuyển đổi (Marketing Funnel) được thể hiện như thế nào?", "options": [{"letter": "A", "text": "Remarketing ở đầu phễu; Retargeting ở cuối phễu"}, {"letter": "B", "text": "Retargeting \"đón\" khách hàng ở giai đoạn đầu phễu (thu hút lại người vào web); Remarketing \"giữ chân\" và \"phát triển\" khách hàng ở giai đoạn giữa và cuối phễu (nuôi dưỡng/tái mua)"}, {"letter": "C", "text": "Cả hai chỉ hoạt động ngoài phễu"}, {"letter": "D", "text": "Retargeting thay thế hoàn toàn Remarketing ở mọi giai đoạn"}], "answer": "B", "answerText": "Retargeting \"đón\" khách hàng ở giai đoạn đầu phễu (thu hút lại người vào web); Remarketing \"giữ chân\" và \"phát triển\" khách hàng ở giai đoạn giữa và cuối phễu (nuôi dưỡng/tái mua)", "explanation": "Bài giảng kết luận: Retargeting thu hút khách hàng quan tâm ban đầu ở đầu phễu; Remarketing chăm sóc, giữ chân và gia tăng mua lại ở giữa và cuối phễu.", "level": "Thông hiểu"}, {"num": 19, "question": "Phân tích nhược điểm lớn nhất của Chatbot dựa trên quy tắc (Rule-based / Button-based) khi xử lý thắc mắc của khách hàng?", "options": [{"letter": "A", "text": "Tốc độ phản hồi quá chậm"}, {"letter": "B", "text": "Cứng nhắc, không hiểu ngữ cảnh/ý định phức tạp, trả lời sai nếu câu hỏi lệch kịch bản và thiếu sự đồng cảm"}, {"letter": "C", "text": "Chi phí duy trì hằng ngày quá cao"}, {"letter": "D", "text": "Không hỗ trợ hoạt động 24/7"}], "answer": "B", "answerText": "Cứng nhắc, không hiểu ngữ cảnh/ý định phức tạp, trả lời sai nếu câu hỏi lệch kịch bản và thiếu sự đồng cảm", "explanation": "Slide chỉ ra nhược điểm của chatbot truyền thống: Không hiểu ngữ cảnh, thiếu khả năng học hỏi, xử lý kém câu hỏi phức tạp đa ý định và thiếu cảm xúc.", "level": "Thông hiểu"}, {"num": 20, "question": "Kỹ thuật \"Phân tích cảm xúc\" (Sentiment Analysis) giúp AI Chatbot nâng cao chất lượng CSKH như thế nào?", "options": [{"letter": "A", "text": "Tự động tính toán tiền phạt của khách hàng"}, {"letter": "B", "text": "Nhận diện giọng điệu bực bội/thất vọng của khách hàng để đưa ra phản hồi đồng cảm, xoa dịu và ưu tiên chuyển cuộc gọi cho nhân viên con người"}, {"letter": "C", "text": "Thay đổi màu sắc giao diện khung chat theo sở thích"}, {"letter": "D", "text": "Tự động khóa tài khoản khi khách hàng giận dữ"}], "answer": "B", "answerText": "Nhận diện giọng điệu bực bội/thất vọng của khách hàng để đưa ra phản hồi đồng cảm, xoa dịu và ưu tiên chuyển cuộc gọi cho nhân viên con người", "explanation": "Sentiment Analysis cho phép AI phát hiện cảm xúc tiêu cực từ từ ngữ của khách hàng để đưa ra câu trả lời đồng cảm và xử lý sự cố kịp thời.", "level": "Thông hiểu"}, {"num": 21, "question": "Trong quy trình 5 bước xây dựng hệ thống Marketing Automation, tại sao khâu \"Đánh giá và làm sạch dữ liệu\" lại vô cùng quan trọng trước khi thiết lập workflow?", "options": [{"letter": "A", "text": "Để giảm số lượng máy tính trong công ty"}, {"letter": "B", "text": "Tránh tình trạng \"Garbage in, Garbage out\" — nếu dữ liệu sai/trùng lặp, hệ thống tự động sẽ gửi sai thông điệp ở quy mô lớn gây lãng phí và hỏng uy tín"}, {"letter": "C", "text": "Vì phần mềm bắt buộc phải xóa hết dữ liệu cũ"}, {"letter": "D", "text": "Để tránh bị phạt tiền bản quyền phần mềm"}], "answer": "B", "answerText": "Tránh tình trạng \"Garbage in, Garbage out\" — nếu dữ liệu sai/trùng lặp, hệ thống tự động sẽ gửi sai thông điệp ở quy mô lớn gây lãng phí và hỏng uy tín", "explanation": "Dữ liệu chất lượng là yếu tố sống còn của Automation. Dữ liệu sai sẽ dẫn đến việc tự động phân gửi sai đối tượng ở quy mô lớn, gây sụt giảm niềm tin.", "level": "Thông hiểu"}, {"num": 22, "question": "Khái niệm \"Hyper-Personalization\" (Cá nhân hóa siêu cấp) ứng dụng AI trong Marketing Automation khác gì so với cá nhân hóa truyền thống?", "options": [{"letter": "A", "text": "Chỉ chèn thêm xưng hô Tên khách hàng vào tiêu đề email"}, {"letter": "B", "text": "Phân tích thời gian thực dữ liệu hành vi, vị trí, ngữ cảnh và sở thích để dự đoán chính xác nhu cầu tiếp theo và tạo ưu đãi riêng biệt cho từng cá nhân"}, {"letter": "C", "text": "Gửi email chúc mừng sinh nhật cố định mỗi năm một lần"}, {"letter": "D", "text": "Hiển thị một banner quảng cáo giống nhau cho toàn bộ tệp"}], "answer": "B", "answerText": "Phân tích thời gian thực dữ liệu hành vi, vị trí, ngữ cảnh và sở thích để dự đoán chính xác nhu cầu tiếp theo và tạo ưu đãi riêng biệt cho từng cá nhân", "explanation": "Hyper-personalization sử dụng AI để dự đoán xu hướng mua sắm tiếp theo dựa trên bối cảnh thực tế (như dáng người, thời tiết, phong cách) thay vì chỉ xưng tên đơn thuần.", "level": "Thông hiểu"}, {"num": 23, "question": "Cơ chế hoạt động của kịch bản Retargeting dành cho \"Khách hàng bỏ giỏ hàng\" (Cart Abandoners) diễn ra như thế nào?", "options": [{"letter": "A", "text": "Tự động xóa sản phẩm khỏi giỏ hàng sau 5 phút"}, {"letter": "B", "text": "AI phát hiện giỏ hàng chưa thanh toán -> Kích hoạt quảng cáo bám đuổi hiển thị đúng danh mục bị bỏ quên -> Gửi kèm ưu đãi/miễn phí vận chuyển để gỡ rào cản"}, {"letter": "C", "text": "Gọi điện đe dọa khách hàng phải mua hàng"}, {"letter": "D", "text": "Tăng giá sản phẩm lên để khách hàng hối hận"}], "answer": "B", "answerText": "AI phát hiện giỏ hàng chưa thanh toán -> Kích hoạt quảng cáo bám đuổi hiển thị đúng danh mục bị bỏ quên -> Gửi kèm ưu đãi/miễn phí vận chuyển để gỡ rào cản", "explanation": "Kịch bản Cart Abandoners tập trung gỡ bỏ rào cản mua hàng (phí ship, do dự) bằng cách nhắc nhở đúng danh mục hàng và tặng voucher trong thời gian giới hạn.", "level": "Thông hiểu"}, {"num": 24, "question": "Trong Case study Uniqlo, chỉ số KPI cốt lõi nào được ưu tiên đo lường để đánh giá hiệu quả của hệ thống Marketing Automation?", "options": [{"letter": "A", "text": "Số lượng nhân viên tại các showroom"}, {"letter": "B", "text": "Tỷ lệ giữ chân (Retention Rate), Tỷ lệ mua lặp lại (Repeat Purchase Rate) và Giá trị trọn đời khách hàng (CLTV)"}, {"letter": "C", "text": "Chi phí thuê mặt bằng cửa hàng"}, {"letter": "D", "text": "Số lượng mẫu quần áo thiết kế hàng năm"}], "answer": "B", "answerText": "Tỷ lệ giữ chân (Retention Rate), Tỷ lệ mua lặp lại (Repeat Purchase Rate) và Giá trị trọn đời khách hàng (CLTV)", "explanation": "Slide Uniqlo nhấn mạnh các KPI đo lường sức khỏe MA bao gồm: Retention Rate, Repeat Purchase Rate, Average Order Value (AOV) và CLTV.", "level": "Thông hiểu"}, {"num": 25, "question": "Vai trò của AI trong việc \"Chủ động tương tác\" (Proactive Interaction) của Chatbot thế hệ mới là gì?", "options": [{"letter": "A", "text": "Chờ khách hàng nhắn tin hỏi mới trả lời"}, {"letter": "B", "text": "Phân tích hành vi (thời gian duyệt web, xem sản phẩm lặp lại) để tự động bật khung chat đưa ra gợi ý hỗ trợ đúng thời điểm trước khi khách rời trang"}, {"letter": "C", "text": "Tự động gửi tin nhắn rác liên tục vào hòm thư"}, {"letter": "D", "text": "Tự động thanh toán thẻ tín dụng của khách hàng"}], "answer": "B", "answerText": "Phân tích hành vi (thời gian duyệt web, xem sản phẩm lặp lại) để tự động bật khung chat đưa ra gợi ý hỗ trợ đúng thời điểm trước khi khách rời trang", "explanation": "Proactive AI Chatbot không chờ người dùng khởi tạo trò chuyện mà tự phân tích dấu hiệu do dự để chủ động xuất hiện hỗ trợ kịp thời.", "level": "Thông hiểu"}, {"num": 26, "question": "Sự phối hợp giữa Marketing Automation và ứng dụng di động Loyalty App (như Uniqlo App) mang lại lợi ích gì?", "options": [{"letter": "A", "text": "Tự động xóa tài khoản thành viên ít tích điểm"}, {"letter": "B", "text": "Tự động gửi thông báo đẩy (Push Notification) cá nhân hóa dựa trên mốc điểm thưởng, sinh nhật hoặc lịch sử mua để kích thích tái ghé thăm"}, {"letter": "C", "text": "Yêu cầu khách hàng phải đến cửa hàng đổi quà trực tiếp"}, {"letter": "D", "text": "Miễn phí toàn bộ sản phẩm cho thành viên"}], "answer": "B", "answerText": "Tự động gửi thông báo đẩy (Push Notification) cá nhân hóa dựa trên mốc điểm thưởng, sinh nhật hoặc lịch sử mua để kích thích tái ghé thăm", "explanation": "MA kết hợp App Loyalty giúp tự động kích hoạt Push Notification đúng thời điểm mốc điểm tích lũy, giúp kích hoạt tương tác tệp thành viên hiệu quả.", "level": "Thông hiểu"}, {"num": 27, "question": "Kịch bản Retargeting người dùng tương tác trên Social Media (xem video, like page) nhằm giải quyết thách thức nào?", "options": [{"letter": "A", "text": "Ép buộc người dùng xóa ứng dụng mạng xã hội"}, {"letter": "B", "text": "Chuyển đổi sự quan tâm ban đầu trên mạng xã hội thành hành động có giá trị cao hơn (truy cập website, tải app, đăng ký, mua hàng)"}, {"letter": "C", "text": "Tự động tăng lượt follow ảo cho fanpage"}, {"letter": "D", "text": "Giảm lượng truy cập vào website doanh nghiệp"}], "answer": "B", "answerText": "Chuyển đổi sự quan tâm ban đầu trên mạng xã hội thành hành động có giá trị cao hơn (truy cập website, tải app, đăng ký, mua hàng)", "explanation": "Thách thức của kịch bản Social Media Engagers là biến sự tò mò/thích thú lướt xem video thành hành động nhấp chuột đi sâu vào phễu mua hàng.", "level": "Thông hiểu"}, {"num": 28, "question": "Việc tích hợp dữ liệu CRM và Marketing Automation giúp đội ngũ Sales hưởng lợi gì từ quy trình nuôi dưỡng Lead?", "options": [{"letter": "A", "text": "Sales không cần phải đi làm nữa"}, {"letter": "B", "text": "Sales nhận được danh sách Leads đã được chấm điểm (Hot Leads), nắm rõ toàn bộ lịch sử tương tác để chốt đơn nhanh chóng với tỷ lệ thành công cao"}, {"letter": "C", "text": "Sales phải tự gửi email thủ công cho từng người"}, {"letter": "D", "text": "Tự động giảm hoa hồng của nhân viên Sales"}], "answer": "B", "answerText": "Sales nhận được danh sách Leads đã được chấm điểm (Hot Leads), nắm rõ toàn bộ lịch sử tương tác để chốt đơn nhanh chóng với tỷ lệ thành công cao", "explanation": "MA nuôi dưỡng và chấm điểm lead, khi lead đạt mức điểm quy định sẽ chuyển giao cho Sales kèm bối cảnh tương tác, giúp tăng tỷ lệ chốt giao dịch.", "level": "Thông hiểu"}, {"num": 29, "question": "Rào cản lớn nhất khi doanh nghiệp triển khai Chatbot AI mà thiếu sự can thiệp của con người (Human-in-the-loop) là gì?", "options": [{"letter": "A", "text": "Máy tính sẽ bị hỏng"}, {"letter": "B", "text": "Nguy cơ AI trả lời sai thực tế (hallucination), không xử lý được các khiếu nại quá phức tạp làm gia tăng sự phẫn nộ của khách hàng"}, {"letter": "C", "text": "Khách hàng không thích dùng điện thoại"}, {"letter": "D", "text": "Phần mềm cấm con người đăng nhập"}], "answer": "B", "answerText": "Nguy cơ AI trả lời sai thực tế (hallucination), không xử lý được các khiếu nại quá phức tạp làm gia tăng sự phẫn nộ của khách hàng", "explanation": "Bài giảng kết luận: Triển khai chatbot chiến lược phải luôn có sự phối hợp giữa AI và Con người (Hybrid) để tiếp quản kịp thời các case phức tạp.", "level": "Thông hiểu"}, {"num": 30, "question": "Mục tiêu cuối cùng của việc ứng dụng kết hợp Marketing Automation, Chatbot và Retargeting trong doanh nghiệp là gì?", "options": [{"letter": "A", "text": "Thay thế toàn bộ bộ phận Marketing và Sales"}, {"letter": "B", "text": "Tối ưu hóa chi phí vận hành, nâng cao trải nghiệm khách hàng xuyên suốt và tối đa hóa giá trị trọn đời (CLTV)"}, {"letter": "C", "text": "Bán hàng giá rẻ nhất thị trường"}, {"letter": "D", "text": "Tăng số lượng thư rác gửi ra thị trường"}], "answer": "B", "answerText": "Tối ưu hóa chi phí vận hành, nâng cao trải nghiệm khách hàng xuyên suốt và tối đa hóa giá trị trọn đời (CLTV)", "explanation": "Sự phối hợp của bộ ba công cụ này tạo ra một hệ sinh thái tự động hoàn chỉnh: thu hút -> tương tác hỗ trợ -> nuôi dưỡng tái mua để gia tăng CLTV. 🟠 PHẦN 3: MỨC ĐỘ VẬN DỤNG (10 CÂU - CĐR 2.1 & 4.1) Mục tiêu: Đánh giá khả năng xây dựng kịch bản, thiết lập workflow tự động và lựa chọn giải pháp xử lý tình huống thực tế.", "level": "Thông hiểu"}, {"num": 31, "question": "Thương hiệu trà sữa Phê La có 10.000 lượt truy cập website mỗi ngày để xem menu nhưng chỉ có 300 đơn hàng online. Bạn đề xuất kịch bản Retargeting nào để cải thiện tỷ lệ chuyển đổi?", "options": [{"letter": "A", "text": "Chạy quảng cáo tìm kiếm từ khóa toàn quốc"}, {"letter": "B", "text": "Gắn Pixel theo dõi tệp xem menu nhưng chưa đặt -> Chạy quảng cáo Retargeting trên Facebook/Instagram hiển thị món bestseller kèm mã freeship cho đơn đầu tiên"}, {"letter": "C", "text": "Tắt tính năng xem menu trên website"}, {"letter": "D", "text": "In tờ rơi phát ngẫu nhiên trên đường phố"}], "answer": "B", "answerText": "Gắn Pixel theo dõi tệp xem menu nhưng chưa đặt -> Chạy quảng cáo Retargeting trên Facebook/Instagram hiển thị món bestseller kèm mã freeship cho đơn đầu tiên", "explanation": "Đây là ví dụ thực tế được nêu trong slide Chương 3.3: Retargeting tệp đã xem menu nhưng chưa đặt hàng nhằm nhắc nhở và đưa ưu đãi thúc đẩy mua ngay.", "level": "Vận dụng"}, {"num": 32, "question": "Một công ty kinh doanh phần mềm B2B xây dựng kịch bản Lead Scoring trong Marketing Automation. Thao tác nào sau đây nên được gán điểm số cao nhất (+20 điểm)?", "options": [{"letter": "A", "text": "Khách hàng lướt xem trang chủ 5 giây"}, {"letter": "B", "text": "Khách hàng điền Form đăng ký nhận bản Demo dùng thử và xem trang bảng giá"}, {"letter": "C", "text": "Khách hàng bấm Like một hình ảnh trên Fanpage"}, {"letter": "D", "text": "Khách hàng mở email chào mừng nhưng không nhấp link"}], "answer": "B", "answerText": "Khách hàng điền Form đăng ký nhận bản Demo dùng thử và xem trang bảng giá", "explanation": "Điền form nhận Demo và xem bảng giá thể hiện ý định mua hàng (Buying Intent) rất cao, do đó được gán điểm thưởng cao để ưu tiên chuyển ngay cho Sales.", "level": "Vận dụng"}, {"num": 33, "question": "Bạn được giao thiết kế Chuỗi Email Nuôi dưỡng (Lead Nurturing Workflow) 3 bước cho khách hàng vừa tải Ebook \"Cẩm nang Marketing 2026\". Sắp xếp nào sau đây là chuẩn mực nhất?", "options": [{"letter": "A", "text": "Email 1: Ép mua hàng ngay -> Email 2: Giảm giá 50% -> Email 3: Doạ hủy tài khoản"}, {"letter": "B", "text": "Email 1 (Ngay lập tức): Cảm ơn + Link tải Ebook -> Email 2 (Sau 3 ngày): Chia sẻ bài viết Case study liên quan -> Email 3 (Sau 7 ngày): Lời mời đăng ký tư vấn/Demo sản phẩm"}, {"letter": "C", "text": "Email 1: Quảng cáo sản phẩm đối thủ -> Email 2: Hỏi khảo sát -> Email 3: Gửi link tải Ebook"}, {"letter": "D", "text": "Gửi cùng lúc 3 email trong vòng 1 phút"}], "answer": "B", "answerText": "Email 1 (Ngay lập tức): Cảm ơn + Link tải Ebook -> Email 2 (Sau 3 ngày): Chia sẻ bài viết Case study liên quan -> Email 3 (Sau 7 ngày): Lời mời đăng ký tư vấn/Demo sản phẩm", "explanation": "Bài giảng hướng dẫn thiết kế chuỗi email nuôi dưỡng: Trao giá trị trước (link tải) -> Giáo dục bổ sung (case study) -> Kêu gọi hành động mua hàng (Demo).", "level": "Vận dụng"}, {"num": 34, "question": "Khách hàng gửi tin nhắn cho Unibot: \"Áo khoác giữ nhiệt Heattech mua tuần trước bị rách chỉ ở nách, shop làm ăn chán quá!\". AI Chatbot nên phản hồi theo kịch bản Sentiment Analysis nào?", "options": [{"letter": "A", "text": "Trả lời mẫu: \"Cảm ơn bạn, chúc bạn một ngày vui vẻ!\""}, {"letter": "B", "text": "Nhận diện cảm xúc tiêu cực -> Phản hồi đồng cảm xin lỗi -> Xin số điện thoại/Mã đơn -> Tự tạo Ticket đổi trả ưu tiên và chuyển nhân viên hỗ trợ ngay"}, {"letter": "C", "text": "Tự động cãi lại khách hàng"}, {"letter": "D", "text": "Tắt khung chat không trả lời"}], "answer": "B", "answerText": "Nhận diện cảm xúc tiêu cực -> Phản hồi đồng cảm xin lỗi -> Xin số điện thoại/Mã đơn -> Tự tạo Ticket đổi trả ưu tiên và chuyển nhân viên hỗ trợ ngay", "explanation": "Ứng dụng Sentiment Analysis trong slide Uniqlo: Phản hồi đồng cảm, xin lỗi về sự bất tiện, thu thập thông tin đơn hàng và xử lý đổi trả ngay.", "level": "Vận dụng"}, {"num": 35, "question": "Một thương hiệu thời trang muốn thực hiện chiến dịch Remarketing qua Email cho những khách hàng đã mua sản phẩm quá 60 ngày nhưng chưa quay lại. Nội dung thông điệp nào hiệu quả nhất?", "options": [{"letter": "A", "text": "Gửi email yêu cầu khách hàng trả lại hàng đã mua"}, {"letter": "B", "text": "Gửi email cá nhân hóa \"Chúng tôi nhớ bạn!\", cập nhật bộ sưu tập mới hợp gu kèm mã giảm giá 15% kích thích tái mua"}, {"letter": "C", "text": "Gửi thông báo tăng giá sản phẩm"}, {"letter": "D", "text": "Không làm gì cả"}], "answer": "B", "answerText": "Gửi email cá nhân hóa \"Chúng tôi nhớ bạn!\", cập nhật bộ sưu tập mới hợp gu kèm mã giảm giá 15% kích thích tái mua", "explanation": "Kịch bản Re-engagement (Tái kích hoạt) áp dụng cho tệp ngủ đông: Nhắc nhớ thương hiệu, giới thiệu sản phẩm đúng sở thích và tặng ưu đãi kích cầu.", "level": "Vận dụng"}, {"num": 36, "question": "Để triển khai chiến dịch Retargeting trên TikTok (TikTok Pixel), bước thiết lập đầu tiên Marketer bắt buộc phải hoàn thành là gì?", "options": [{"letter": "A", "text": "Quay 100 video nhảy TikTok"}, {"letter": "B", "text": "Tạo TikTok Pixel trong TikTok Ads Manager và cài đặt mã này vào mã nguồn website để ghi nhận sự kiện"}, {"letter": "C", "text": "Mua 10.000 follow cho tài khoản TikTok"}, {"letter": "D", "text": "Nhắn tin cho từng người dùng TikTok"}], "answer": "B", "answerText": "Tạo TikTok Pixel trong TikTok Ads Manager và cài đặt mã này vào mã nguồn website để ghi nhận sự kiện", "explanation": "Slide hướng dẫn các bước Remarketing trên TikTok: Bước 1 là Tạo TikTok Pixel và cài mã theo dõi vào website để ghi nhận hành vi xem/thêm giỏ hàng.", "level": "Vận dụng"}, {"num": 37, "question": "Doanh nghiệp bạn muốn phân loại tệp khách hàng để gửi chiến dịch email chào hàng cá nhân hóa cao. Tiêu chí Phân đoạn vi mô (Micro-segmentation) nào sâu sắc nhất?", "options": [{"letter": "A", "text": "Chỉ dựa vào giới tính Nam / Nữ"}, {"letter": "B", "text": "Dựa vào hành vi tổng hợp: \"Nam giới, 25-35 tuổi, lịch sử mua đồ chạy bộ, vừa xem mẫu giày marathon mới 2 lần trong tuần\""}, {"letter": "C", "text": "Chỉ dựa vào thành phố đang sống"}, {"letter": "D", "text": "Phân loại ngẫu nhiên theo số may mắn"}], "answer": "B", "answerText": "Dựa vào hành vi tổng hợp: \"Nam giới, 25-35 tuổi, lịch sử mua đồ chạy bộ, vừa xem mẫu giày marathon mới 2 lần trong tuần\"", "explanation": "Ví dụ về Micro-segmentation trong bài giảng Uniqlo: Kết hợp nhân khẩu học + lịch sử mua hàng chi tiết + hành vi xem web thời gian thực để gửi thông điệp siêu mục tiêu.", "level": "Vận dụng"}, {"num": 38, "question": "Khi khách hàng do dự chuẩn bị rê chuột tắt trang giỏ hàng (Exit-intent), Chatbot tích hợp AI trên website nên thực hiện hành động tự động nào?", "options": [{"letter": "A", "text": "Đóng trình duyệt của khách hàng"}, {"letter": "B", "text": "Kích hoạt pop-up chat chủ động: \"Giỏ hàng của bạn đang có ưu đãi! Hoàn tất trong 10 phút để nhận freeship nhé?\""}, {"letter": "C", "text": "Tự động tăng giá sản phẩm trong giỏ"}, {"letter": "D", "text": "Phát tiếng chuông báo động"}], "answer": "B", "answerText": "Kích hoạt pop-up chat chủ động: \"Giỏ hàng của bạn đang có ưu đãi! Hoàn tất trong 10 phút để nhận freeship nhé?\"", "explanation": "Ứng dụng AI Chatbot trong kịch bản giỏ hàng bị bỏ quên: Phát hiện ý định rời trang và kích hoạt khung chat chủ động hỗ trợ kèm ưu đãi nhỏ.", "level": "Vận dụng"}, {"num": 39, "question": "Một nhãn hàng mỹ phẩm muốn tái chăm sóc 20.000 khách hàng đã mua kem chống nắng cách đây 3 tháng (thời gian trung bình dùng hết 1 tuýp). Phương pháp tiếp cận nào là Remarketing chuẩn xác nhất?", "options": [{"letter": "A", "text": "Chạy quảng cáo banner hiển thị ngẫu nhiên trên báo dantri"}, {"letter": "B", "text": "Sử dụng Marketing Automation tự động gửi Zalo ZNS / SMS / Email nhắc nhở hết sản phẩm kèm nút bấm \"Đặt lại tuýp mới giảm 10%\""}, {"letter": "C", "text": "Mua danh sách số điện thoại mới để gọi điện chào hàng"}, {"letter": "D", "text": "Đăng một bài viết chung chung trên Fanpage"}], "answer": "B", "answerText": "Sử dụng Marketing Automation tự động gửi Zalo ZNS / SMS / Email nhắc nhở hết sản phẩm kèm nút bấm \"Đặt lại tuýp mới giảm 10%\"", "explanation": "Sử dụng First-Party Data (lịch sử đơn hàng 3 tháng trước) để tái chăm sóc đúng vòng đời sản phẩm qua Email/Zalo là bản chất của Remarketing.", "level": "Vận dụng"}, {"num": 40, "question": "Để kiểm soát chi phí quảng cáo Retargeting không bị lãng phí vào những người đã mua hàng thành công, Marketer cần thiết lập điều kiện đối tượng (Audience Rule) như thế nào?", "options": [{"letter": "A", "text": "Nhắm mục tiêu vào tất cả mọi người trên Internet"}, {"letter": "B", "text": "Bao gồm người đã xem trang sản phẩm / thêm giỏ hàng VÀ Loại trừ (Exclude) những người đã truy cập trang Cảm ơn/Xác nhận đơn hàng (Thank You Page)"}, {"letter": "C", "text": "Chỉ chọn người dùng dưới 18 tuổi"}, {"letter": "D", "text": "Không đặt bất kỳ điều kiện loại trừ nào"}], "answer": "B", "answerText": "Bao gồm người đã xem trang sản phẩm / thêm giỏ hàng VÀ Loại trừ (Exclude) những người đã truy cập trang Cảm ơn/Xác nhận đơn hàng (Thank You Page)", "explanation": "Quy tắc thiết lập danh sách Retargeting hiệu quả: Luôn phải Exclude tệp đã mua hàng thành công (hoàn tất Thank You page) để tránh tốn tiền quảng cáo lại sản phẩm họ vừa mua. 🔴 PHẦN 4: MỨC ĐỘ VẬN DỤNG CAO (10 CÂU - CĐR 2.2 & 4.1) Mục tiêu: Đánh giá khả năng phân tích case study Uniqlo, giải quyết rào cản triển khai và đề xuất chiến lược tối ưu toàn diện.", "level": "Vận dụng"}, {"num": 41, "question": "Phân tích Case Study Uniqlo: Tại sao Fast Retailing lại coi việc kết nối dữ liệu giữa Chương trình thành viên trên Mobile App và Hệ thống Marketing Automation là chìa khóa tăng trưởng doanh thu?", "options": [{"letter": "A", "text": "Vì giúp giảm bớt số lượng cửa hàng vật lý"}, {"letter": "B", "text": "Vì App thu thập First-Party Data sâu sắc (lịch sử mua online/offline, điểm thưởng), giúp MA gửi Push Notification/Email đúng thời điểm, tăng tỷ lệ mua lặp lại và CLTV"}, {"letter": "C", "text": "Vì App tự động sản xuất quần áo"}, {"letter": "D", "text": "Vì giúp Uniqlo không cần chạy quảng cáo trên Facebook"}], "answer": "B", "answerText": "Vì App thu thập First-Party Data sâu sắc (lịch sử mua online/offline, điểm thưởng), giúp MA gửi Push Notification/Email đúng thời điểm, tăng tỷ lệ mua lặp lại và CLTV", "explanation": "Slide Uniqlo chỉ ra: Tích hợp Loyalty App với MA giúp khai thác tối đa dữ liệu thành viên, tự động hóa tương tác đa kênh và giải quyết bài toán duy trì giữ chân khách hàng (Retention).", "level": "Vận dụng cao"}, {"num": 42, "question": "Đề xuất giải pháp Marketing Automation định hướng tương lai cho Uniqlo nhằm kết nối trải nghiệm mua sắm Omnichannel (Online - Offline) tại cửa hàng?", "options": [{"letter": "A", "text": "Đóng cửa toàn bộ website bán hàng online"}, {"letter": "B", "text": "Khách hàng thử đồ tại cửa hàng offline nhưng chưa mua -> Mã RFID/App ghi nhận -> MA tự động kích hoạt Email/Push Notification gửi ưu đãi sản phẩm đó khi khách rời cửa hàng"}, {"letter": "C", "text": "Buộc khách hàng phải thanh toán trước khi vào cửa hàng"}, {"letter": "D", "text": "Xóa bỏ chương trình tích điểm thành viên"}], "answer": "B", "answerText": "Khách hàng thử đồ tại cửa hàng offline nhưng chưa mua -> Mã RFID/App ghi nhận -> MA tự động kích hoạt Email/Push Notification gửi ưu đãi sản phẩm đó khi khách rời cửa hàng", "explanation": "Đề xuất MA tương lai cho Uniqlo trong slide: Tạo hành trình Omnichannel liền mạch, kết nối hành vi thử đồ offline với kịch bản tự động hóa tiếp thị online.", "level": "Vận dụng cao"}, {"num": 43, "question": "Đánh giá rủi ro lớn nhất khi doanh nghiệp triển khai quá nhiều kịch bản Retargeting bám đuổi dồn dập mà không kiểm soát tần suất (Frequency Capping)?", "options": [{"letter": "A", "text": "Quảng cáo bị giảm chi phí xuống quá thấp"}, {"letter": "B", "text": "Gây ức chế, dị ứng thương hiệu (Ad Fatigue/Annoyance), khiến khách hàng chặn quảng cáo hoặc đánh giá tiêu cực thương hiệu"}, {"letter": "C", "text": "Website bị sập do quá tải truy cập"}, {"letter": "D", "text": "Khách hàng sẽ mua hàng nhiều hơn gấp 10 lần"}], "answer": "B", "answerText": "Gây ức chế, dị ứng thương hiệu (Ad Fatigue/Annoyance), khiến khách hàng chặn quảng cáo hoặc đánh giá tiêu cực thương hiệu", "explanation": "Tác hại của Retargeting quá đà: Thấy quảng cáo quá nhiều lần gây cảm giác bị theo dõi, phiền phức, dẫn đến hiện tượng mệt mỏi với quảng cáo (Ad Fatigue) và ghét thương hiệu.", "level": "Vận dụng cao"}, {"num": 44, "question": "Một công ty bán lẻ gặp tình trạng: Chatbot AI trả lời rất hay nhưng tỷ lệ chuyển đổi đơn hàng thực tế vẫn thấp. Qua phân tích thấy khách hàng thường dừng lại ở bước hỏi phí giao hàng. Bạn đề xuất điều chỉnh chiến lược gì?", "options": [{"letter": "A", "text": "Sa thải đội ngũ IT"}, {"letter": "B", "text": "Tích hợp dữ liệu phí ship real-time vào Chatbot VÀ cài đặt AI tự động kích hoạt mã \"Miễn phí vận chuyển\" khi phát hiện khách do dự ở bước tính phí"}, {"letter": "C", "text": "Tắt tính năng Chatbot"}, {"letter": "D", "text": "Tăng phí giao hàng lên gấp đôi"}], "answer": "B", "answerText": "Tích hợp dữ liệu phí ship real-time vào Chatbot VÀ cài đặt AI tự động kích hoạt mã \"Miễn phí vận chuyển\" khi phát hiện khách do dự ở bước tính phí", "explanation": "Xử lý rào cản chuyển đổi: Chatbot không chỉ trả lời thông tin mà phải biết giải quyết đúng \"điểm nghẽn\" (phí ship) bằng cách đưa ra ưu đãi kích thích chốt đơn.", "level": "Vận dụng cao"}, {"num": 45, "question": "Để đo lường mức độ đóng góp thực sự của chiến dịch Marketing Automation vào doanh thu lâu dài của doanh nghiệp, thước đo tài chính nào sau đây là quan trọng nhất?", "options": [{"letter": "A", "text": "Tỷ lệ mở Email (Open Rate)"}, {"letter": "B", "text": "Giá trị trọn đời khách hàng (CLTV - Customer Lifetime Value) và Chi phí thu hút KH (CAC)"}, {"letter": "C", "text": "Số lượt tải Ebook"}, {"letter": "D", "text": "Số lượng bài viết đăng trên blog"}], "answer": "B", "answerText": "Giá trị trọn đời khách hàng (CLTV - Customer Lifetime Value) và Chi phí thu hút KH (CAC)", "explanation": "MA hướng tới mối quan hệ lâu dài. Do đó, chỉ số đánh giá thành công chiến lược nhất là sự gia tăng giá trị trọn đời CLTV và tối ưu tỷ lệ CLTV/CAC.", "level": "Vận dụng cao"}, {"num": 46, "question": "Sự kết hợp giữa AI Generative (AI tạo nội dung) và Marketing Automation mang lại bứt phá gì cho các chiến dịch Dynamic Email Marketing?", "options": [{"letter": "A", "text": "Tự động viết tiêu đề email bằng tất cả ngôn ngữ trên thế giới"}, {"letter": "B", "text": "AI tự động khởi tạo hình ảnh, văn bản và đề xuất sản phẩm được thiết kế độc bản riêng cho từng email của từng cá nhân theo thời gian thực"}, {"letter": "C", "text": "Tự động gửi email mà không cần địa chỉ người nhận"}, {"letter": "D", "text": "Giảm tỷ lệ mở email xuống 0%"}], "answer": "B", "answerText": "AI tự động khởi tạo hình ảnh, văn bản và đề xuất sản phẩm được thiết kế độc bản riêng cho từng email của từng cá nhân theo thời gian thực", "explanation": "AI Generative giúp tự động hóa việc tạo nội dung biến thể (copywriting, hình ảnh) phù hợp với từng profile cá nhân ở quy mô hàng triệu email.", "level": "Vận dụng cao"}, {"num": 47, "question": "Giải pháp khắc phục tình trạng \"Phân mảnh dữ liệu\" (Data Silos) khi triển khai Marketing Automation giữa phòng Marketing và Sales?", "options": [{"letter": "A", "text": "Cho Marketing và Sales sử dụng hai phần mềm hoàn toàn độc lập"}, {"letter": "B", "text": "Tích hợp đồng bộ dữ liệu hai chiều giữa Marketing Automation Platform và CRM chung của doanh nghiệp"}, {"letter": "C", "text": "Yêu cầu nhân viên chép dữ liệu bằng tay sang file Excel hàng ngày"}, {"letter": "D", "text": "Cấm phòng Sales truy cập vào dữ liệu khách hàng"}], "answer": "B", "answerText": "Tích hợp đồng bộ dữ liệu hai chiều giữa Marketing Automation Platform và CRM chung của doanh nghiệp", "explanation": "Xóa bỏ Data Silos bằng cách kết nối đồng bộ 2 chiều giữa nền tảng Automation và CRM, đảm bảo dữ liệu tương tác đổ về một nơi thống nhất.", "level": "Vận dụng cao"}, {"num": 48, "question": "Tại sao chiến lược \"Nuôi dưỡng khách hàng\" (Lead Nurturing) bằng Marketing Automation lại đặc biệt hiệu quả và bắt buộc phải có đối với ngành B2B hoặc sản phẩm giá trị cao (High-involvement)?", "options": [{"letter": "A", "text": "Vì khách hàng B2B thích đọc email quảng cáo hàng ngày"}, {"letter": "B", "text": "Vì hành trình mua hàng B2B kéo dài, gồm nhiều người quyết định; MA giúp cung cấp kiến thức giá trị liên tục để xây dựng niềm tin cho đến khi họ sẵn sàng xuống tiền"}, {"letter": "C", "text": "Vì sản phẩm B2B không thể bán qua cửa hàng"}, {"letter": "D", "text": "Vì doanh nghiệp B2B không được phép chạy quảng cáo AdTech"}], "answer": "B", "answerText": "Vì hành trình mua hàng B2B kéo dài, gồm nhiều người quyết định; MA giúp cung cấp kiến thức giá trị liên tục để xây dựng niềm tin cho đến khi họ sẵn sàng xuống tiền", "explanation": "Ngành B2B có chu kỳ bán hàng dài và phức tạp. Lead Nurturing giúp duy trì sự hiện diện, giáo dục thị trường và xây dựng uy tín dài hạn.", "level": "Vận dụng c
